window.LESSONS = [
  // ===================================================================== SAYISAL
  {
    id: "temel", area: "say", phase: 1, title: "Temel Kavramlar ve Sayılar", group: "A. Temel Matematik",
    subs: ["Doğal sayılar", "Tam sayılar", "Sayı kümeleri", "Tek ve çift sayılar", "Pozitif ve negatif sayılar", "Asal sayılar", "Ardışık sayılar", "Sayı basamakları"],
    kaz: ["Sayı kümelerini ve aralarındaki kapsama ilişkisini açıklar.", "Tek-çift ve işaret kurallarını kullanarak kesin yargıya ulaşır.", "Basamak çözümlemesiyle denklem kurar.", "Ardışık sayı dizilerinde terim-toplam ilişkisini kullanır."],
    tanim: "Temel kavramlar; sayı kümeleri, sayıların türleri (tek, çift, asal, ardışık) ve basamak yapısıyla ilgilidir. ALES Sayısal testinin ilk sorularında sıkça doğrudan, ilerleyen sorularda ise başka konuların içinde dolaylı olarak kullanılır.",
    kavramlar: [["Doğal sayılar (ℕ)", "0, 1, 2, 3, … biçiminde devam eden sayılar."], ["Tam sayılar (ℤ)", "…, −2, −1, 0, 1, 2, … ; sıfır ne pozitif ne negatiftir."], ["Rakam", "0–9 arasındaki 10 simge; sayı, rakamlarla yazılır."], ["Asal sayı", "1'den büyük, yalnızca 1'e ve kendisine bölünebilen doğal sayı. En küçük asal 2'dir ve tek çift asal da odur."], ["Ardışık sayılar", "Belirli bir kurala göre (genellikle eşit artışla) art arda gelen sayılar."]],
    mantik: "Bu konudaki soruların çoğu bir 'durum tablosu' kurmayı gerektirir: Tek-çift, pozitif-negatif ya da rakam olasılıkları tek tek listelenir ve 'kesinlikle' istenen yargı tüm durumlarda sınanır. Ezberden çok sistemli deneme yapılır.",
    anlatim: [
      { h: "Tek ve çift sayılar", p: "Çift ± çift = çift, tek ± tek = çift, tek ± çift = tek. Çarpımda tek bir çift çarpan sonucu çift yapar; çarpımın tek olması için bütün çarpanlar tek olmalıdır. Üs almak tek-çiftliği değiştirmez (pozitif tam sayı üslerde): aⁿ ile a aynı tek-çiftliktedir." },
      { h: "Pozitif ve negatif sayılar", p: "Çarpma ve bölmede işaretler çarpılır: (−)·(−) = (+), (−)·(+) = (−). Çift kuvvetler her zaman negatif olmayan sonuç verir; tek kuvvetler tabanın işaretini korur. 'a·b < 0' bilgisi a ile b'nin ters işaretli olduğunu söyler, hangisinin negatif olduğunu söylemez." },
      { h: "Asal sayılar", p: "100'e kadar 25 asal vardır. Bir sayının asal olup olmadığı, karekökünden küçük asallara bölünüp bölünmediğine bakılarak anlaşılır. 'a ve b asal, a + b tek' bilgisi asallardan birinin 2 olmasını zorunlu kılar." },
      { h: "Ardışık sayılar", p: "Ardışık sayılarda terim sayısı = (son − ilk) ÷ artış + 1; toplam = (ilk + son) · terim sayısı ÷ 2. Terim sayısı tek ise ortadaki terim ortalamaya eşittir." },
      { h: "Sayı basamakları", p: "AB = 10A + B, ABC = 100A + 10B + C. AB + BA = 11(A + B), AB − BA = 9(A − B). Rakamların farklı olması, ilk rakamın sıfır olamaması gibi koşullar en büyük/en küçük sayı sorularının anahtarıdır." }
    ],
    formuller: ["AB = 10A + B", "AB + BA = 11(A + B)", "AB − BA = 9(A − B)", "Terim sayısı = (son − ilk) / artış + 1", "Toplam = (ilk + son) · n / 2"],
    ornekler: [

/* Bir sorunun cevaplanmasını kaydeder; yanlışlar ve akıllı tekrar kutusu burada güncellenir. */
const BOX_DAYS = [1, 3, 7, 14];
function recordAnswer(qid, choice, ms, src = "banka") {
  const d = S(), q = QMAP[qid]; if (!q) return null;
  const ok = choice === q.a ? 1 : 0, now = Date.now();
  (d.att[qid] = d.att[qid] || []).push([now, choice, ok, Math.round(ms || 0), src]);
  const day = todayStr(); const dd = d.days[day] = d.days[day] || { q: 0, ok: 0, ms: 0 };
  dd.q++; dd.ok += ok; dd.ms += Math.min(ms || 0, 600000);
  const w = d.wrong[qid];
  if (!ok) d.wrong[qid] = { d: now, c: choice, box: 0, due: now + BOX_DAYS[0] * DAY, fixed: 0, n: (w ? w.n : 0) + 1 };
  else if (w && !w.fixed) { w.box++; w.last = now; if (w.box >= 3) { w.fixed = now; } else w.due = now + BOX_DAYS[w.box] * DAY; }
  return ok;
}

/* ------------------------------------------------------------------ istatistik */
function stats(filter = () => true) {
  const d = S(); let n = 0, ok = 0, ms = 0;
  const by = {}, lv = {}, ar = { say: { n: 0, ok: 0 }, soz: { n: 0, ok: 0 } };
  for (const [id, list] of Object.entries(d.att)) {
    const q = QMAP[id]; if (!q) continue;
    for (const a of list) {
      if (!filter(a, q)) continue;
      n++; ok += a[2]; ms += a[3];
      const t = by[q.topic] = by[q.topic] || { n: 0, ok: 0, ms: 0 }; t.n++; t.ok += a[2]; t.ms += a[3];
      const l = lv[q.level] = lv[q.level] || { n: 0, ok: 0 }; l.n++; l.ok += a[2];
      ar[q.area].n++; ar[q.area].ok += a[2];
    }
  }
  return { n, ok, bad: n - ok, ms, by, lv, ar };
}
function weakTopics(minN = 5) {
  const st = stats().by;
  return Object.entries(st).filter(([, v]) => v.n >= minN)
    .map(([k, v]) => ({ id: k, acc: v.ok / v.n, n: v.n, score: (v.ok + 1) / (v.n + 2) }))
    .sort((a, b) => a.score - b.score);
}
function streak() {
  const d = S().days; let s = 0, day = todayStr();
  if (!d[day]) day = addDays(day, -1);
  while (d[day] && d[day].q > 0) { s++; day = addDays(day, -1); }
  return s;
}
function lessonProgress(id) {
  const L = S().lessons[id] || {}; let p = 0;
  if (L.read) p += 40;
  const t = L.tests || {};
  ["kolay", "orta", "zor"].forEach(k => { if (t[k]) p += 12; });
  if (t.final && t.final.p >= 60) p += 24;
  return Math.min(100, p);
}

const TIP = { el: null };
function tipInit() {
  TIP.el = document.createElement("div"); TIP.el.className = "tip"; TIP.el.setAttribute("role", "tooltip"); document.body.appendChild(TIP.el);
  document.addEventListener("pointerover", e => { const t = e.target.closest("[data-tip]"); if (!t) return; TIP.el.innerHTML = t.dataset.tip; TIP.el.classList.add("on"); });

function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
/* Tek seri sütun grafiği */
function barChart(data, { h = 180, unit = "", cls = "s1", max = null } = {}) {
  if (!data.length) return "";
  const W = 560, H = h, pl = 34, pr = 8, pt = 14, pb = 26;
  const mx = max || niceMax(Math.max(...data.map(d => d.v), 1));
  const bw = (W - pl - pr) / data.length;
  const y = v => H - pb - (H - pt - pb) * v / mx;
  const ticks = [0, mx / 2, mx];
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sütun grafiği"><g class="grid">${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>`;
  s += ticks.map(t => `<text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${fmt1(t)}</text>`).join("");
  data.forEach((d, i) => {
    const x = pl + i * bw, w = Math.max(4, bw * .58), bx = x + (bw - w) / 2, top = y(d.v), hh = H - pb - top;
    const r = Math.min(4, w / 2, hh);
    if (d.v > 0) s += `<path class="${cls}" d="M${bx},${H - pb} V${top + r} q0,-${r} ${r},-${r} H${bx + w - r} q${r},0 ${r},${r} V${H - pb} Z"/>`;
    s += `<rect class="hit" x="${x}" y="${pt}" width="${bw}" height="${H - pt - pb}" data-tip="<b>${esc(d.label)}</b><br>${fmt1(d.v)}${unit}${d.tip ? "<br>" + d.tip : ""}"/>`;
    if (data.length <= 16 || i % 2 === 0) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(d.short || d.label)}</text>`;
  });
  return s + "</svg>";
}
/* Çok serili çizgi grafiği (tek eksen) */
function lineChart(series, labels, { h = 200, unit = "", min = null, max = null } = {}) {
  const pts = series.flatMap(s => s.vals.filter(v => v != null));
  if (!pts.length) return "";
  const W = 560, H = h, pl = 36, pr = 64, pt = 14, pb = 26;
  let lo = min != null ? min : Math.min(0, ...pts), hi = max != null ? max : niceMax(Math.max(...pts, 1));
  const n = labels.length, xs = i => pl + (n === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (n - 1));
  const y = v => H - pb - (H - pt - pb) * (v - lo) / (hi - lo || 1);
  const ticks = [lo, (lo + hi) / 2, hi];
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Çizgi grafiği"><g class="grid">${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>`;
  s += ticks.map(t => `<text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${fmt1(t)}</text>`).join("");
  labels.forEach((l, i) => { if (n <= 10 || i % Math.ceil(n / 8) === 0 || i === n - 1) s += `<text x="${xs(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(se => {
    let d = "", started = false;
    se.vals.forEach((v, i) => { if (v == null) { started = false; return; } d += (started ? "L" : "M") + xs(i) + "," + y(v); started = true; });
    s += `<path class="line ${se.cls}" style="fill:none" d="${d}"/>`;
    se.vals.forEach((v, i) => { if (v != null) s += `<circle class="${se.cls}" cx="${xs(i)}" cy="${y(v)}" r="4" stroke="var(--surface)" stroke-width="2"/>`; });
    const li = se.vals.map((v, i) => v != null ? i : -1).filter(i => i >= 0).pop();
    if (li != null && series.length > 1) s += `<text class="dl" x="${xs(li) + 8}" y="${y(se.vals[li]) + 4}">${esc(se.name)}</text>`;
  });
  labels.forEach((l, i) => {
    const tip = `<b>${esc(l)}</b>` + series.map(se => se.vals[i] != null ? `<br>${esc(se.name)}: ${fmt1(se.vals[i])}${unit}` : "").join("");
    const x0 = i === 0 ? pl : (xs(i - 1) + xs(i)) / 2, x1 = i === n - 1 ? W - pr : (xs(i) + xs(i + 1)) / 2;
    s += `<rect class="hit" x="${x0}" y="${pt}" width="${Math.max(2, x1 - x0)}" height="${H - pt - pb}" data-tip="${tip.replace(/"/g, "&quot;")}"/>`;
  });
  return s + "</svg>";
}
const legend = items => `<div class="legend">${items.map(([n, c]) => `<span><i style="background:var(--${c});border-color:transparent"></i>${esc(n)}</span>`).join("")}</div>`;
function seqColor(acc) { const i = Math.min(5, Math.max(0, Math.floor(acc * 6))); return [`var(--seq-1)`, `var(--seq-2)`, `var(--seq-3)`, `var(--seq-4)`, `var(--seq-5)`, `var(--seq-6)`][i]; }

/* ---- engine.js ---- */
/* ALES Akademi — soru çözme oturumu ve sınav motoru (deneme, konu testi, zamanlı test). */
"use strict";

/* ================================================================ soru seçimi */
function usedIds() {
  const u = new Set(Object.keys(S().att));
  S().exams.forEach(e => e.qs.forEach(id => u.add(id)));
  return u;
}
function pickSingles(pool, n, used) {
  const fresh = shuffle(pool.filter(q => !used.has(q.id))), old = shuffle(pool.filter(q => used.has(q.id)));
  return fresh.concat(old).slice(0, n);
}
function pickGroups(pool, n, used) {
  const groups = {};
  pool.filter(q => q.group).forEach(q => (groups[q.group.id] = groups[q.group.id] || []).push(q));
  let gl = Object.values(groups);
  gl = shuffle(gl).sort((a, b) => a.filter(q => used.has(q.id)).length / a.length - b.filter(q => used.has(q.id)).length / b.length);
  const out = [];
  for (const g of gl) { if (out.length >= n) break; out.push(...g.slice(0, n - out.length)); }
  if (out.length < n) out.push(...pickSingles(pool.filter(q => !q.group && !out.includes(q)), n - out.length, used));
  return out;
}
const byTopic = (t, sub) => QB.filter(q => q.topic === t && (!sub || sub.includes(q.sub)));

function buildDeneme(kind) {
  const used = usedIds(), taken = new Set();
  const take = arr => { arr.forEach(q => taken.add(q.id)); return arr.map(q => q.id); };
  const avail = arr => arr.filter(q => !taken.has(q.id));
  const full = kind === "tam";
  const k = full ? 1 : 0.4;
  const sayDist = full ? { temel: 3, bolunebilme: 2, rasyonel: 2, esitsizlik: 2, uslu: 2, cebir: 2, oran: 2, problem: 4, islem: 2, sayma: 1 }
    : { temel: 1, bolunebilme: 1, rasyonel: 1, esitsizlik: 1, uslu: 1, cebir: 1, oran: 1, problem: 2, islem: 1 };
  let say = [];
  for (const [t, n] of Object.entries(sayDist)) say.push(...take(pickSingles(avail(byTopic(t)).filter(q => !q.group), n, used)));
  say.push(...take(pickGroups(avail(QB.filter(q => q.area === "say" && (q.topic === "veri" || q.topic === "saymantik"))), full ? 21 : 8, used)));
  say.push(...take(pickSingles(avail(byTopic("geometri")), full ? 7 : 3, used)));
  let soz = [];
  const sp = (pool, n) => soz.push(...take(pickSingles(avail(pool).filter(q => !q.group), n, used)));
  sp(byTopic("sozcuk", ["Boşluk doldurma"]), Math.round(5 * k));
  sp(byTopic("cumle", ["Kesin çıkarım"]), full ? 3 : 1);
  sp(QB.filter(q => (q.topic === "cumle" && q.sub !== "Kesin çıkarım") || (q.topic === "yapi" && q.sub === "Söz dizimi / sıralama") || (q.topic === "sozcuk" && q.sub !== "Boşluk doldurma")), full ? 4 : 2);
  sp(byTopic("yapi", ["Cümle yer değiştirme"]), full ? 3 : 1);
  sp(byTopic("yapi", ["Anlam bütünlüğünü bozan cümle"]), full ? 3 : 1);
  sp(QB.filter(q => q.topic === "paragraf" || (q.topic === "yapi" && q.sub === "Paragraf tamamlama")), full ? 19 : 8);
  soz.push(...take(pickGroups(avail(byTopic("paragraf")), full ? 5 : 2, used)));
  soz.push(...take(pickGroups(avail(byTopic("sozmantik")), full ? 8 : 4, used)));
  return { say: say.slice(0, full ? 50 : 20), soz: soz.slice(0, full ? 50 : 20) };
}

/* ================================================================ sınav motoru */
function startExam(cfg) {
  const d = S();
  d.active = { id: uid(), kind: cfg.kind, title: cfg.title, ref: cfg.ref || null, sections: cfg.sections, ans: {}, mark: {}, time: {},
    cur: [0, 0], start: Date.now(), end: Date.now() + cfg.minutes * 60000, minutes: cfg.minutes, last: Date.now() };
  Store.save(); location.hash = "#/sinav";
}
function startDeneme(kind) {
  const set = buildDeneme(kind);
  const full = kind === "tam";
  startExam({ kind, title: full ? "Tam Deneme (50 Sayısal + 50 Sözel)" : "Mini Deneme (20 Sayısal + 20 Sözel)", minutes: full ? 150 : 60,
    sections: [{ key: "say", label: "Sayısal Testi", ids: set.say }, { key: "soz", label: "Sözel Testi", ids: set.soz }] });
}
function startTopicTest(topic, kind) {
  const L = LMAP[topic], pool = byTopic(topic);
  const lv = { kolay: [1, 2], orta: [3], zor: [4, 5], final: [1, 2, 3, 4, 5] }[kind];
  let qs = pool.filter(q => lv.includes(q.level));
  const want = kind === "final" ? 12 : 8;
  if (qs.length < want) { // zorluk aralığında yeterli soru yoksa bir alt/üst seviyeyle tamamla
    const near = kind === "zor" ? pool.filter(q => q.level === 3) : kind === "kolay" ? pool.filter(q => q.level === 3) : pool.filter(q => q.level !== 3);
    qs = qs.concat(shuffle(near).slice(0, want - qs.length));
  }
  const pick = pool.some(q => q.group) ? pickGroups(qs, want, usedIds()) : pickSingles(qs, want, usedIds());
  const ids = pick.map(q => q.id);
  const min = Math.max(5, Math.ceil(pick.reduce((s, q) => s + q.sure, 0) / 60 * 1.15));
  const names = { kolay: "Kolay seviye test", orta: "Orta seviye test", zor: "Zor seviye test", final: "Konu sonu değerlendirmesi" };
  startExam({ kind: "konu", title: `${L.title} — ${names[kind]}`, ref: { topic, kind }, minutes: min, sections: [{ key: L.area, label: L.title, ids }] });
}

"use strict";

const PHASES = [
  { key: 1, name: "Temel Oluşturma", goal: "Temel konuları öğrenmek ve düzenli soru çözme alışkanlığı kazanmak.",
    say: ["temel", "bolunebilme", "rasyonel", "esitsizlik", "uslu", "cebir", "oran"], soz: ["sozcuk", "cumle", "paragraf", "yapi"] },
  { key: 2, name: "Gelişim", goal: "Orta ve zor seviyedeki soruları çözebilmek.",
    say: ["problem", "islem", "sayma", "veri", "saymantik", "geometri"], soz: ["paragraf", "yapi", "sozmantik"] },
  { key: 3, name: "Sınav Simülasyonu", goal: "Deneme, süre yönetimi ve zayıf konu tekrarıyla sınav performansını geliştirmek.", say: [], soz: [] }
];
/* Seviye ve süreye göre aşama oranları */
function phaseSplit(days, level) {
  const base = { baslangic: [.4, .35, .25], orta: [.33, .34, .33], ileri: [.25, .35, .4] }[level] || [.33, .34, .33];
  const r = days <= 30 ? base.map((x, i) => i === 2 ? Math.max(x, .3) : x) : base;
  const s = r.reduce((a, b) => a + b, 0);
  const p1 = Math.round(days * r[0] / s), p2 = Math.round(days * r[1] / s);
  return [p1, p2, days - p1 - p2];
}
/* Günlük dakikayı örnek 3 saatlik plana (60/45/35/20/20) oranlayarak böler; hedef puan türüne göre sayısal–sözel payı kaydırır. */
function minuteSplit(total, type) {
  const r = { say: 60, soz: 45, mantik: 35, yanlis: 20, tekrar: 20 };
  const shift = type === "SAY" ? 10 : type === "SOZ" ? -10 : 0;
  r.say += shift; r.soz -= shift;
  const sum = Object.values(r).reduce((a, b) => a + b, 0), out = {};
  for (const k in r) out[k] = Math.max(5, Math.round(total * r[k] / sum / 5) * 5);
  return out;
}
function buildPlan(p) {
  const [a, b, c] = phaseSplit(p.days, p.level), days = [];
  const sp = minuteSplit(p.dailyMin, p.targetType);
  const spread = (list, n) => Array.from({ length: n }, (_, i) => list[Math.min(list.length - 1, Math.floor(i * list.length / n))]);
  const s1 = spread(PHASES[0].say, a), z1 = spread(PHASES[0].soz, a), s2 = spread(PHASES[1].say, b), z2 = spread(PHASES[1].soz, b);
  const perWeek = p.days <= 30 ? 2 : p.days >= 120 ? 2 : 3;
  for (let i = 0; i < p.days; i++) {
    const date = addDays(p.start, i), ph = i < a ? 1 : i < a + b ? 2 : 3, tasks = [];
    const rest = (i + 1) % 7 === 0 && ph !== 3;
    if (rest) {
      tasks.push({ t: "Haftalık genel tekrar: bu haftanın konularının kısa tekrar notları", min: Math.round(p.dailyMin * .4), cat: "tekrar", go: "#/akademi" });
      tasks.push({ t: "Yanlışlarım: bugün tekrar edilecek soruları çöz", min: Math.round(p.dailyMin * .35), cat: "yanlis", go: "#/yanlislar" });

  if (k === "alt") { const a = r(2, 20), x = r(2, 9), y = r(1, 5); seq = [a]; for (let i = 1; i < 6; i++) seq.push(seq[i - 1] + (i % 2 ? x : -y)); rule = `Sırayla +${x} ve −${y} uygulanıyor.`; }
  if (k === "d2") { const a = r(1, 10), d = r(1, 5), e = r(1, 4); seq = [a]; for (let i = 0; i < 5; i++) seq.push(seq[i] + d + e * i); rule = `Ardışık farklar ${d}'den başlayıp ${e}'er artıyor.`; }
  if (k === "fib") { seq = [r(1, 5), r(2, 8)]; for (let i = 2; i < 6; i++) seq.push(seq[i - 1] + seq[i - 2]); rule = "Her terim önceki iki terimin toplamı."; }
  if (k === "inter") { const a = r(1, 9), d = r(2, 6), b = r(30, 60), f = r(2, 7); for (let i = 0; i < 3; i++) seq.push(a + d * i, b - f * i); rule = `Tek sıralar +${d}, çift sıralar −${f} ile ilerleyen iç içe iki dizi.`; }

const FILLS = ["", "o", "h"];
function figSVG(f) {
  const pts = []; const R = 24;
  for (let i = 0; i < f.sides; i++) { const a = (Math.PI * 2 * i / f.sides) - Math.PI / 2 + f.rot * Math.PI / 180; pts.push((32 + R * Math.cos(a)).toFixed(1) + "," + (32 + R * Math.sin(a)).toFixed(1)); }
  const dots = Array.from({ length: f.dots }, (_, i) => `<circle cx="${20 + i * 8}" cy="60" r="2.4" fill="var(--text)"/>`).join("");
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--series-1)" stroke-width="2.5"/></pattern></defs><polygon class="fig ${FILLS[f.fill]}" points="${pts.join(" ")}"/><line x1="32" y1="32" x2="${(32 + 16 * Math.cos((f.rot - 90) * Math.PI / 180)).toFixed(1)}" y2="${(32 + 16 * Math.sin((f.rot - 90) * Math.PI / 180)).toFixed(1)}" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>${dots}</svg>`;
}
function shapePattern(level) {
  const attrs = shuffle(["sides", "rot", "fill", "dots"]).slice(0, Math.min(3, level));
  const step = { sides: 1, rot: [45, 90][Math.floor(Math.random() * 2)], fill: 1, dots: 1 };
  const base = { sides: 3, rot: 0, fill: 0, dots: 0 };
  const at = i => { const f = { ...base }; attrs.forEach(a => { if (a === "sides") f.sides = 3 + i; if (a === "rot") f.rot = (i * step.rot) % 360; if (a === "fill") f.fill = i % 3; if (a === "dots") f.dots = i; }); if (!attrs.includes("sides")) f.sides = 4; return f; };
  const seq = [0, 1, 2, 3].map(at), ans = at(4);
  const wrongs = []; const key = f => JSON.stringify(f);
  const variants = [{ ...ans, rot: (ans.rot + 90) % 360 }, { ...ans, sides: ans.sides + 1 }, { ...ans, fill: (ans.fill + 1) % 3 }, { ...ans, dots: Math.max(0, ans.dots - 1) }, { ...ans, sides: Math.max(3, ans.sides - 1) }, { ...ans, rot: (ans.rot + 45) % 360 }, at(3), { ...ans, dots: ans.dots + 1 }];
  for (const v of shuffle(variants)) if (key(v) !== key(ans) && !wrongs.some(w => key(w) === key(v))) wrongs.push(v);
  const opts = shuffle([ans, ...wrongs.slice(0, 4)]);
  const desc = { sides: "kenar sayısı her adımda 1 artıyor", rot: `iç çizgi her adımda ${step.rot}° dönüyor`, fill: "dolgu sırayla dolu → boş → taralı değişiyor", dots: "alttaki nokta sayısı her adımda 1 artıyor" };
  return { seq, opts, a: opts.indexOf(ans), rule: attrs.map(a => desc[a]).join("; ") + "." };
}

function recommend() {
  const out = [], d = S(), w = weakTopics(), st = stats();
  if (!st.n) out.push({ html: `<b>Başlangıç:</b> <a href="#/konu/temel">Temel Kavramlar ve Sayılar</a> ve <a href="#/konu/paragraf">Paragrafta Anlam</a> konularından başlayın; ilk sonuçlarınızdan sonra öneriler verilerinize göre üretilecek.` });
  const due = dueWrongs().length;
  if (due) out.push({ html: `<b>${due} yanlış soru</b> akıllı tekrar takvimine göre bugün tekrar edilmeyi bekliyor. <a href="#/yanlislar">Tekrar et →</a>`, cls: "warn" });
  w.filter(x => x.acc < .5).slice(0, 2).forEach(x => {
    const L = LMAP[x.id];
    const extra = x.id === "problem" ? " Problem türlerini ayrı ayrı çalışın: yaş, işçi-havuz, hareket, yüzde ve karışım." : (x.id === "saymantik" || x.id === "sozmantik") ? ' <a href="#/mantik">Mantık Atölyesi</a>\'nde tablo kurma bulmacalarıyla ek çalışma yapın.' : "";
    out.push({ html: `<b>${L.title}</b> başarınız %${Math.round(x.acc * 100)} (${x.n} soru). Önce konu anlatımını ve sık yapılan hataları tekrar edin, ardından kolay testten başlayın.${extra} <a href="#/konu/${x.id}">Konuya git →</a>`, cls: "bad" });
  });
  w.filter(x => x.acc >= .75 && x.n >= 10).slice(-1).forEach(x => out.push({ html: `<b>${LMAP[x.id].title}</b> başarınız yüksek (%${Math.round(x.acc * 100)}). Mevcut seviyeyi korumak için haftada bir karma tekrar yeterli; zor seviye teste geçebilirsiniz.`, cls: "good" }));
  if (st.n && !d.exams.some(e => e.kind === "tam" || e.kind === "mini")) out.push({ html: `Henüz deneme çözmediniz. Süre yönetimini görmek için bir <a href="#/deneme">mini deneme</a> çözün.` });
  if (!out.length) out.push({ html: `Dengeli ilerliyorsunuz. Bugün bir <a href="#/deneme">tam deneme</a> ile süre yönetiminizi sınayın.` });
  return out;
}

  const root = $("#view"), d = S(), f = window._bf = window._bf || { area: "", topic: "", sub: "", level: "", state: "", n: 20 };
  let list = QB.filter(q => (!f.area || q.area === f.area) && (!f.topic || q.topic === f.topic) && (!f.sub || q.sub === f.sub) && (!f.level || q.level === +f.level));
  const st = id => { const a = d.att[id]; return !a ? "yeni" : a[a.length - 1][2] ? "dogru" : "yanlis"; };
  if (f.state === "yeni") list = list.filter(q => !d.att[q.id]);
  if (f.state === "yanlis") list = list.filter(q => d.wrong[q.id] && !d.wrong[q.id].fixed);
  if (f.state === "isaretli") list = list.filter(q => d.mark[q.id]);
  if (f.state === "favori") list = list.filter(q => d.fav[q.id]);

    <label class="f">Zorluk<select id="bf-level"><option value="">Tümü</option>${[1, 2, 3, 4, 5].map(l => `<option value="${l}" ${+f.level === l ? "selected" : ""}>${LEVELS[l]}</option>`).join("")}</select></label>

    <div class="row between" style="margin-top:14px"><span class="small muted"><b>${list.length}</b> soru eşleşti</span><div class="row"><button class="btn" id="bf-reset">Filtreleri temizle</button><button class="btn primary" id="bf-go" ${list.length ? "" : "disabled"}>${ic("play")}Çözmeye başla</button></div></div></div>

  pp && (pp.onclick = () => { window._bp = page - 1; renderBank(); }); pn && (pn.onclick = () => { window._bp = page + 1; renderBank(); });
}

  const days = [...Array(14)].map((_, i) => addDays(todayStr(), i - 13));
  const daily = barChart(days.map(x => ({ label: trDate(x, { day: "numeric", month: "long" }), short: trDate(x, { day: "numeric" }), v: (d.days[x] || {}).q || 0, tip: (d.days[x] || {}).q ? `%${pct(d.days[x].ok, d.days[x].q)} doğru` : "" })), { unit: " soru" });

  <div class="stack"><div class="grid g4">
    <div class="card"><div class="stat"><span class="l">Toplam çözüm</span><span class="v">${st.n}</span><span class="s">${Object.keys(d.att).length} farklı soru</span></div></div>
    <div class="card"><div class="stat"><span class="l">Sayısal başarı</span><span class="v">%${pct(st.ar.say.ok, st.ar.say.n)}</span><span class="s">${st.ar.say.n} çözüm</span></div></div>
    <div class="card"><div class="stat"><span class="l">Sözel başarı</span><span class="v">%${pct(st.ar.soz.ok, st.ar.soz.n)}</span><span class="s">${st.ar.soz.n} çözüm</span></div></div>
    <div class="card"><div class="stat"><span class="l">Ortalama süre</span><span class="v">${Math.round(st.ms / st.n / 1000)} sn</span><span class="s">soru başına</span></div></div></div>
  <div class="card"><h3>Çalışma önerileri</h3><div class="stack" style="gap:8px">${recs.map(r => `<div class="note ${r.cls || ""}">${r.html}</div>`).join("")}</div></div>

  <div class="grid g2"><div class="card"><h3>Sayısal başarı (haftalık %)</h3>${sayAcc}</div><div class="card"><h3>Sözel başarı (haftalık %)</h3>${sozAcc}</div></div>

  <details class="card"><summary style="cursor:pointer"><b>Tablo görünümü</b> (konu bazında ham veri)</summary><div class="tbl-wrap" style="margin-top:10px"><table class="t"><tr><th>Konu</th><th class="n">Çözüm</th><th class="n">Doğru</th><th class="n">Başarı</th><th class="n">Ort. süre</th></tr>${Object.entries(st.by).map(([k, v]) => `<tr><td>${esc(LMAP[k].title)}</td><td class="n">${v.n}</td><td class="n">${v.ok}</td><td class="n">%${pct(v.ok, v.n)}</td><td class="n">${Math.round(v.ms / v.n / 1000)} sn</td></tr>`).join("")}</table></div></details></div>`;

    if (v.adv) {
      ["ms", "ss", "mz", "sz"].forEach(k => v[k] = $("#sc-" + k).value);
      $$("[data-tx]").forEach(el => { const [t, k] = el.dataset.tx.split(","); v.tx[t][+k] = el.value; });
      const f = x => x === "" ? null : +x;
      if ([v.ms, v.ss, v.mz, v.sz].every(x => x !== "") && +v.ss > 0 && +v.sz > 0) {
        const sps = 50 + 10 * (ns - v.ms) / v.ss, spz = 50 + 10 * (nz - v.mz) / v.sz;
        const ap = { SAY: .75 * sps + .25 * spz, SOZ: .25 * sps + .75 * spz, EA: .5 * sps + .5 * spz };
        est = `<div class="card"><h3>Tahmini sonuç <span class="chip warn">varsayıma dayalı</span></h3><div class="grid g4"><div class="stat"><span class="l">SP Sayısal</span><span class="v">${fmt1(sps)}</span></div><div class="stat"><span class="l">SP Sözel</span><span class="v">${fmt1(spz)}</span></div></div>
          <div class="tbl-wrap" style="margin-top:12px"><table class="t"><tr><th>Puan türü</th><th class="n">Ağırlıklı puan</th><th class="n">Tahmini ALES puanı</th></tr>${["SAY", "SOZ", "EA"].map(t => { const [X, Sd, Bm] = v.tx[t].map(f); const ok = X != null && Sd != null && Bm != null && (2 * (Bm - X) - Sd) !== 0; const sc = ok ? 70 + 30 * (2 * (ap[t] - X) - Sd) / (2 * (Bm - X) - Sd) : null; return `<tr><td>${{ SAY: "ALES Sayısal", SOZ: "ALES Sözel", EA: "ALES Eşit Ağırlık" }[t]}</td><td class="n">${fmt1(ap[t])}</td><td class="n">${ok ? `<b>${fmt1(Math.min(100, sc))}</b>` : '<span class="muted">X, S, B girin</span>'}</td></tr>`; }).join("")}</table></div></div>`;
      } else est = `<div class="note small">Tahmin için dört ham puan istatistiğini girin.</div>`;
    }
    $("#sc-out").innerHTML = `${err ? `<div class="note bad">${err}</div>` : ""}<div class="grid g3"><div class="card"><div class="stat"><span class="l">Sayısal net (kesin)</span><span class="v">${fmt1(ns)}</span><span class="s">${v.sd} − ${v.sy}/4 · boş ${Math.max(0, 50 - v.sd - v.sy)}</span></div></div>
      <div class="card"><div class="stat"><span class="l">Sözel net (kesin)</span><span class="v">${fmt1(nz)}</span><span class="s">${v.zd} − ${v.zy}/4 · boş ${Math.max(0, 50 - v.zd - v.zy)}</span></div></div>
      <div class="card"><div class="stat"><span class="l">ALES SAY / SÖZ / EA</span><span class="v" style="font-size:1.1rem">Kesin hesaplanamaz</span><span class="s">Oturum istatistikleri gerekir · aşağıdaki senaryo bölümünü kullanın</span></div></div></div>${est}`;
  };
  $$("input", root).forEach(i => i.oninput = calc);
  $("#sc-adv").onclick = () => { v.adv = !v.adv; renderScore(); };
  calc();
}

/* ================================================================ yönlendirme */
function applyTheme() {
  const t = S().theme; if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $$(".theme-btn").forEach(b => { b.innerHTML = ic(dark ? "sun" : "moon"); b.setAttribute("aria-label", dark ? "Açık temaya geç" : "Koyu temaya geç"); });
}
function route() {
  const h = location.hash.replace(/^#\/?/, ""), [path] = h.split("?"), parts = path.split("/");
  if (parts[0] !== "sinav") clearInterval(EXAM_TIMER);
  if (parts[0] !== "coz") clearInterval(window._qt);
  const map = {
    "": renderHome, akademi: () => renderAcademy(), sayisal: () => renderAcademy("say"), sozel: () => renderAcademy("soz"),
    konu: () => renderLesson(parts[1]), banka: renderBank, coz: renderPractice, mantik: () => renderLogic(parts[1] || ""),
    deneme: renderExamCenter, sinav: renderExam, sonuc: () => renderResult(parts[1]), gorevler: renderTasks, yanlislar: renderWrongs,
    favoriler: renderFavs, program: renderProgram, performans: renderPerf, puan: renderScore, rehber: renderGuide, kaynak: renderSources, ayarlar: renderSettings
  };
  const fn = map[parts[0]] || renderHome;
  try { fn(); } catch (e) { console.error(e); $("#view").innerHTML = `<div class="note bad">Sayfa yüklenirken bir hata oluştu: ${esc(e.message)}</div>`; }
  renderNav();
  $(".side").classList.remove("open"); $(".scrim").classList.remove("on");
  if (!["sinav", "coz"].includes(parts[0])) window.scrollTo(0, 0);
  document.title = (({ "": "Ana Sayfa", konu: (LMAP[parts[1]] || {}).title }[parts[0]]) || ($(".nav a.on span") || {}).textContent || "ALES Akademi") + " · ALES Akademi";
}
function boot() {
  Store.load(); applyTheme(); tipInit();
  const toggleTheme = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; S().theme = dark ? "light" : "dark"; Store.save(); applyTheme(); };
  $$(".theme-btn").forEach(b => b.onclick = toggleTheme);
  $("#menu").onclick = () => { $(".side").classList.add("open"); $(".scrim").classList.add("on"); };
  $(".scrim").onclick = () => { $(".side").classList.remove("open"); $(".scrim").classList.remove("on"); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  addEventListener("hashchange", route);
  addEventListener("keydown", e => { examKeys(e); practiceKeys(e); });
  if (S().active && Date.now() >= S().active.end) finishExam(true);
  route();
}
document.addEventListener("DOMContentLoaded", boot);
