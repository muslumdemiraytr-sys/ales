daha zor topladıklarını belirtti.<br>Bu cümleden aşağıdaki yargılardan hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Çevrim içi derslerin kaldırılması gerekir.","Bütün öğrenciler sınıf ortamını tercih etmektedir.","Öğrencilerin başarısı çevrim içi derslerde düşmüştür.","Katılımcıların çoğunluğu, çevrim içi derslerde dikkat toplamakta daha çok güçlük çektiğini ifade etmiştir.","Araştırma yalnızca üniversite öğrencileriyle yapılmıştır."],"a":3,"sol":["'Yarısından fazlası' çoğunluk demektir; cümle bunların beyanını aktarır.","'Bütün öğrenciler' aşırı genellemedir; başarıyla ilgili bir bilgi verilmemiştir."],"kaz":"Nicelik bildiren ifadeleri doğru yorumlar.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-013"},{"area":"soz","topic":"cumle","sub":"Cümle yorumlama","level":2,"q":"Usta bir oyuncu, rolünü oynarken seyirciye oynadığını unutturan kişidir.<br>Bu cümleyle anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Oyuncular rollerini ezberlemek zorunda değildir.","Seyirci, oyuncunun kim olduğunu bilmemelidir.","Usta oyuncular sahnede doğaçlama yapar.","Oyunculukta başarı, seyircinin canlandırılanı gerçek gibi algılamasıyla ilgilidir.","İyi oyuncular yalnızca dram türünde rol alır."],"a":3,"sol":["Oynadığını unutturmak, canlandırmanın doğal ve inandırıcı olmasıdır.","Diğer seçenekler cümlede yer almayan dar ya da ilgisiz yorumlardır."],"kaz":"Cümlenin dolaylı anlatımını çözer.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-014"},{"area":"soz","topic":"cumle","sub":"Tanım","level":1,"q":"Aşağıdakilerden hangisi bir <b>tanım</b> cümlesidir?","opts":["Biyografiler genellikle kalın kitaplardır.","Okuduğum son biyografi çok sürükleyiciydi.","Biyografi, bir kişinin hayatını belgelere dayanarak anlatan yazı türüdür.","Dün kütüphaneden bir biyografi aldım.","Biyografi okumayı çok severim."],"a":2,"sol":["Tanım cümlesi bir kavramın ne olduğunu, ayırt edici özellikleriyle açıklar."],"kaz":"Tanım cümlesini tanır.","sure":30,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-015"},{"area":"soz","topic":"cumle","sub":"Ön yargı","level":2,"q":"Aşağıdaki cümlelerin hangisinde <b>ön yargı</b> vardır?","opts":["Bu yazarın yeni kitabını okumadım ama yine sıkıcı olduğundan eminim.","Kitabı okuduktan sonra yazarın üslubunu sevmediğimi fark ettim.","Kitabın ikinci baskısı bu ay çıkacak.","Eleştirmenler kitabın kurgusunu başarılı bulmuş.","Yazar, yeni kitabını iki yılda tamamlamış."],"a":0,"sol":["Ön yargı, bir şey hakkında onu tanımadan yargıya varmaktır: 'okumadım ama … eminim'.","İlk yanlış seçenekte yargı okuma deneyimine dayanır; ön yargı değildir."],"kaz":"Ön yargıyı deneyime dayalı yargıdan ayırır.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-016"},{"area":"soz","topic":"cumle","sub":"Tahmin","level":1,"q":"Aşağıdaki cümlelerin hangisinde <b>tahmin</b> anlamı vardır?","opts":["Bu gidişle proje sanırım ay sonuna kadar tamamlanır.","Proje tamamlanınca bir tören düzenlendi.","Projede beş kişi görev aldı.","Proje geçen ay tamamlandı.","Projeyi bitirmek için gece gündüz çalıştık."],"a":0,"sol":["'Sanırım' ve 'bu gidişle' ifadeleri kesin olmayan, öngörüye dayalı bir yargı bildirir."],"kaz":"Tahmin bildiren anlatımı tanır.","sure":30,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-017"},{"area":"soz","topic":"cumle","sub":"Kesin çıkarım","level":3,"q":"Kurak geçen yazın ardından barajlardaki doluluk oranı son on yılın en düşük düzeyine indi.<br>Bu cümleden aşağıdaki yargılardan hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Bu yıl hiç yağış olmamıştır.","Barajlar on yıl önce yapılmıştır.","Son on yıl içinde barajlarda bundan daha düşük bir doluluk oranı görülmemiştir.","Kurak yazlar her yıl yaşanmaktadır.","Yakında su kesintileri başlayacaktır."],"a":2,"sol":["'Son on yılın en düşük düzeyi' ifadesi, bu dönemde daha düşük bir oranın görülmediğini kesin olarak bildirir.","'Hiç yağış olmaması' kuraklıktan çıkarılamayacak kadar güçlü bir iddiadır; su kesintisi bir tahmindir."],"kaz":"Üstünlük bildiren ifadeyi doğru yorumlar.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-018"},{"area":"soz","topic":"cumle","sub":"Öneri","level":1,"q":"Aşağıdaki cümlelerin hangisinde <b>öneri</b> vardır?","opts":["Metin, beklediğimden çok daha uzun olmuş.","Metni teslim etmeden önce bir kez de yüksek sesle okumanı tavsiye ederim.","Metni okuyan herkes beğendiğini söyledi.","Metni dün akşam teslim ettim.","Metindeki yazım yanlışları beni rahatsız etti."],"a":1,"sol":["Öneri, karşıdakine bir davranış tavsiye etmektir: 'tavsiye ederim'."],"kaz":"Öneri cümlesini tanır.","sure":30,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-019"},{"area":"soz","topic":"cumle","sub":"Kesin çıkarım","level":3,"q":"Müzenin ziyaretçi sayısı, giriş ücretinin kaldırıldığı ay bir önceki aya göre iki katına çıktı.<br>Bu cümleden aşağıdaki yargılardan hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Giriş ücretinin kaldırıldığı ayda müze, bir önceki aydan daha çok ziyaretçi ağırlamıştır.","Müze, kentin en çok ziyaret edilen yeridir.","Ziyaretçi sayısı sonraki ayda da artmıştır.","Müze ücretli olduğu dönemde zarar ediyordu.","Ziyaretçi artışının tek nedeni ücretin kaldırılmasıdır."],"a":0,"sol":["Cümle yalnızca iki ay arasındaki sayısal karşılaştırmayı bildirir.","Zamanlama bir neden–sonuç ilişkisini kesinleştirmez; 'tek nedeni' seçeneği bu yüzden çıkarılamaz."],"kaz":"Birliktelik ile nedenselliği ayırt eder.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-020"},{"area":"soz","topic":"cumle","sub":"Kesin çıkarım","level":3,"q":"Bir sanat eseri, yaratıldığı dönemin koşulları bilinmeden de beğenilebilir; ancak o koşulları bilmek, esere ilişkin anlamı derinleştirir.<br>Bu cümleden aşağıdaki yargılardan hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Her sanat eseri yaratıldığı dönemi yansıtır.","Sanat eserleri yalnızca kendi dönemlerinde anlaşılır.","Dönemini bilmeyen biri bir eseri beğenemez.","Sanat eleştirmenleri eserlerin bağlamını önemsemez.","Bir eserin ortaya çıktığı bağlamı bilmek, onu anlamaya katkı sağlar."],"a":4,"sol":["'Anlamı derinleştirir' ifadesi doğrudan bu yargıyı verir.","İlk yanlış seçenek, cümlenin 'bilinmeden de beğenilebilir' bölümüyle çelişir."],"kaz":"Cümlenin iki bölümünü birlikte değerlendirir.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-021"},{"area":"soz","topic":"cumle","sub":"Cümle yorumlama","level":2,"q":"Kitaplar, insanın kendi yaşamı dışında yüzlerce hayat yaşamasını sağlar.<br>Bu cümleyle anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Her kitap gerçek bir yaşam öyküsü anlatır.","İnsan, kitaplardan çok kendi deneyimlerinden öğrenir.","Kitap okumak zaman kaybıdır.","Okumak, insanın farklı deneyimleri dolaylı yoldan edinmesine olanak tanır.","Kitap okuyanlar daha uzun yaşar."],"a":3,"sol":["'Yüzlerce hayat yaşamak' mecazdır; başkalarının deneyimlerini okuma yoluyla tanımayı anlatır."],"kaz":"Mecazlı anlatımı yorumlar.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-022"},{"area":"soz","topic":"cumle","sub":"Anlam ilişkisi","level":2,"q":"'Sabah erken kalktığı için otobüsü kaçırmadı.' cümlesindeki anlam ilişkisi aşağıdakilerin hangisinde de vardır?","opts":["Erken kalkarsa otobüse yetişir.","Otobüse yetişmek için erken kalktı.","Erken kalktı ama yine de otobüsü kaçırdı.","Yağmur yağdığı için piknik iptal edildi.","Kardeşinden daha erken kalkar."],"a":3,"sol":["Örnek cümlede neden–sonuç ilişkisi vardır ('-dığı için' + gerçekleşmiş sonuç).","Aynı ilişki yalnızca piknik cümlesinde vardır; diğerleri amaç, koşul, karşıtlık ve karşılaştırma bildirir."],"kaz":"Anlam ilişkisini farklı cümlelerde tanır.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-023"},{"area":"soz","topic":"cumle","sub":"Kesin çıkarım","level":3,"q":"Yeni düzenleme, yalnızca 2027 yılından sonra kurulacak işletmeleri kapsamaktadır.<br>Bu cümleden aşağıdaki yargılardan hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Düzenleme, işletmelerin vergilerini artırmaktadır.","Bütün işletmeler 2027'ye kadar düzenlemeye uyum sağlamalıdır.","2027'den sonra yeni işletme kurulması yasaklanmıştır.","Hâlihazırda faaliyette olan işletmeler bu düzenlemenin kapsamı dışındadır.","Düzenleme 2027'de yürürlükten kalkacaktır."],"a":3,"sol":["'Yalnızca … kurulacak işletmeler' ifadesi, şimdiki işletmeleri kapsam dışında bırakır.","Son seçenek bu kesin yargıyla çelişir; diğerleri cümlede yoktur."],"kaz":"'Yalnızca' sözcüğünün sınırlayıcı işlevini yorumlar.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-024"},{"area":"soz","topic":"cumle","sub":"Örtülü anlam","level":2,"q":"Annem bile bu yemeği beğendi.<br>Bu cümleden aşağıdakilerden hangisi <b>çıkarılabilir</b>?","opts":["Yemeği kimse beğenmemiştir.","Konuşan kişinin annesi kolay kolay yemek beğenmez.","Anne bu yemeği ilk kez yemiştir.","Yemeği konuşan kişinin annesi yapmıştır.","Yemek çok pahalı malzemelerle yapılmıştır."],"a":1,"sol":["'Bile' sözcüğü, beklenmeyen bir durumun gerçekleştiğini sezdirir: annenin beğenmesi beklenmedik bir şeydir."],"kaz":"'Bile' sözcüğünün katkısını sezer.","sure":35,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-025"},{"area":"soz","topic":"cumle","sub":"Abartma","level":1,"q":"Aşağıdaki cümlelerin hangisinde <b>abartma</b> vardır?","opts":["Seni görmek beni çok mutlu etti.","Seni görmeyeli neredeyse bin yıl oldu.","Haftaya yeniden görüşebiliriz.","Seninle en son geçen bayram görüşmüştük.","Seni görmeyeli üç yıl oldu."],"a":1,"sol":["'Bin yıl', bir durumu olduğundan çok büyük gösteren abartılı bir anlatımdır."],"kaz":"Abartmayı tanır.","sure":30,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-026"},{"area":"soz","topic":"cumle","sub":"Kesin çıkarım","level":3,"q":"Kentteki toplu taşıma araçlarının tamamı 2027 yılı sonuna kadar elektrikli araçlarla değiştirilecek.<br>Bu cümleden aşağıdaki yargılardan hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Kentte hava kirliliği son yıllarda artmıştır.","Yeni araçların tamamı yerli üretim olacaktır.","Elektrikli araçlar diğer araçlardan daha ucuzdur.","Toplu taşıma kullanımı 2027'de artacaktır.","Kentteki toplu taşıma araçlarının en az bir kısmı şu anda elektrikli değildir."],"a":4,"sol":["Araçların elektrikli araçlarla 'değiştirilecek' olması, mevcut araçların hiç değilse bir kısmının elektrikli olmadığını gösterir.","Maliyet, kirlilik, üretim yeri ve kullanım artışı cümlede yer almaz."],"kaz":"Bir planın dayandığı mevcut durumu kesin olarak çıkarır.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-027"},{"area":"soz","topic":"cumle","sub":"Kesin çıkarım","level":4,"q":"Ankete katılan öğretmenlerin yalnızca beşte biri, yeni ders kitaplarını yeterli bulduğunu belirtti.<br>Bu cümleden aşağıdaki yargılardan hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Ankete okuldaki bütün öğretmenler katılmıştır.","Yeni ders kitapları gelecek yıl değiştirilecektir.","Öğretmenlerin beşte dördü yeni ders kitaplarını yetersiz bulmaktadır.","Katılımcı öğretmenlerin çoğunluğu, yeni ders kitaplarını yeterli bulduğunu belirtmemiştir.","Öğrenciler de yeni ders kitaplarını yetersiz bulmuştur."],"a":3,"sol":["Beşte birin 'yeterli' dediği bilinir; geri kalan beşte dört yalnızca bu görüşü belirtmemiştir.","Bu beşte dördün kararsız ya da görüş bildirmemiş olabileceği için 'yetersiz buluyor' denemez; bu seçenek sık yapılan bir tuzaktır."],"kaz":"Bir oranın tümleyenini aşırı yorumlamaktan kaçınır.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-028"},{"area":"soz","topic":"cumle","sub":"Amaç–sonuç","level":2,"q":"Aşağıdaki cümlelerin hangisinde <b>amaç</b> bildiren bir anlatım <b>yoktur</b>?","opts":["Sınava hazırlanmak amacıyla bir kursa yazıldı.","Gün doğumunu izlemek üzere tepeye tırmandılar.","Yol çalışması yüzünden servis bu sabah geç geldi.","Kuyrukta beklememek için biletini önceden aldı.","Herkes duysun diye yüksek sesle konuştu."],"a":2,"sol":["'Yüzünden' gerçekleşmiş bir nedeni bildirir (neden–sonuç).","Diğerlerinde 'için, amacıyla, diye, üzere' ile henüz gerçekleşmemiş bir hedef anlatılır."],"kaz":"Amaç ile nedeni ayırt eder.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-029"},{"area":"soz","topic":"cumle","sub":"Karşıtlık","level":1,"q":"Aşağıdaki cümlelerin hangisinde <b>karşıtlık</b> ilişkisi vardır?","opts":["Projeyi bitirmek için hafta sonu da çalıştık.","Proje zamanında bittiği için ödül aldık.","Proje bitince hep birlikte tatile çıktık.","Proje bitmeden kimse ayrılmayacak.","Proje zamanında bitti, ancak bütçe aşıldı."],"a":4,"sol":["'Ancak' bağlacı, beklenen olumlu sonuca ters düşen bir durumu bağlar.","Diğerlerinde neden, zaman, koşul ve amaç ilişkileri vardır."],"kaz":"Karşıtlık bildiren bağlaçları tanır.","sure":35,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-030"},{"area":"soz","topic":"cumle","sub":"Varsayım","level":4,"q":"Bu yıl kütüphaneye yeni kitap alınmazsa öğrenciler güncel kaynaklara ulaşamayacak.<br>Bu yargı aşağıdakilerden hangisi <b>varsayılarak</b> ileri sürülmüştür?","opts":["Öğrencilerin hepsi kütüphaneye her gün gider.","Kütüphane bütçesi geçen yıl artırılmıştır.","Öğrencilerin güncel kaynaklara ulaşması büyük ölçüde kütüphaneye bağlıdır.","Öğrenciler kitap okumaktan hoşlanmaz.","Kütüphaneye bu yıl kesinlikle kitap alınmayacaktır."],"a":2,"sol":["Kitap alınmamasının erişimi engelleyeceği sonucu, öğrencilerin başka kaynaklardan bu kaynaklara ulaşamayacağı öncülüne dayanır.","'Kesinlikle alınmayacak' koşul ekiyle çelişir; 'hepsi her gün gider' gereksiz derecede güçlü bir iddiadır."],"kaz":"Koşullu yargının dayandığı örtük öncülü bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-031"},{"area":"soz","topic":"cumle","sub":"Cümle yorumlama","level":2,"q":"Eleştiriye kulak tıkayan, aynı hatayı yeniden yapmaya kendini mahkûm eder.<br>Bu cümleyle anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Her eleştiri haklıdır.","Hata yapmak kaçınılmazdır.","Eleştirileri dikkate almamak, hatalardan ders çıkarmayı engeller.","İnsan hatalarını her zaman kendi başına fark eder.","Eleştiri yapanlar hata yapmaz."],"a":2,"sol":["'Kulak tıkamak' dinlememek, 'kendini mahkûm etmek' kaçınılmaz sonuca sürüklenmek demektir: Eleştiriyi dinlemeyen, hatasını düzeltemez."],"kaz":"Deyimli anlatımı yorumlar.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-032"},{"area":"soz","topic":"yapi","sub":"Anlam bütünlüğünü bozan cümle","level":3,"q":"(I) Uyku, beynin gün boyunca edindiği bilgileri düzenlediği bir süreçtir. (II) Özellikle derin uyku evresinde öğrenilen bilgiler kalıcı belleğe aktarılır. (III) Bu nedenle sınavdan önceki gece uykusuz kalmak, sanıldığının aksine öğrenmeyi zayıflatabilir. (IV) Araştırmalar da sınav öncesinde yeterince uyuyan öğrencilerin hatırlama testlerinde daha başarılı olduğunu göstermektedir. (V) Öte yandan bazı araştırmacılar, rüyaların içeriğinin kişinin kültürel çevresine göre değiştiğini öne sürmektedir.<br>Numaralanmış cümlelerden hangisi, parçanın <b>anlam bütünlüğünü bozmaktadır</b>?","opts":["II","I","V","IV","III"],"a":2,"sol":["Parçanın konusu uyku ile öğrenme/bellek arasındaki ilişkidir.","V. cümle rüyaların kültürle ilişkisine geçerek konudan sapar."],"kaz":"Paragrafın konusunu ve akışını izleyerek konudan sapan cümleyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-001"},{"area":"soz","topic":"yapi","sub":"Anlam bütünlüğünü bozan cümle","level":3,"q":"(I) Arılar, bitkilerin tozlaşmasında kilit bir rol üstlenir. (II) Dünyadaki gıda ürünlerinin önemli bir kısmı doğrudan ya da dolaylı olarak bu tozlaşmaya bağlıdır. (III) Bal, antik çağlardan beri tatlandırıcı olarak kullanılmaktadır. (IV) Bu nedenle arı popülasyonlarındaki azalma yalnızca bir çevre sorunu değil, aynı zamanda bir gıda güvenliği sorunudur. (V) Tarım ilaçlarının bilinçsiz kullanımı bu azalmanın başlıca nedenleri arasında gösterilmektedir.<br>Numaralanmış cümlelerden hangisi, parçanın <b>anlam bütünlüğünü bozmaktadır</b>?","opts":["IV","V","III","I","II"],"a":2,"sol":["Parça tozlaşma – gıda güvenliği ilişkisini anlatır.","III. cümle balın tarihsel kullanımına değinerek akışı keser; IV. cümledeki 'Bu nedenle' de II. cümleye bağlanır."],"kaz":"Paragrafın konusunu ve akışını izleyerek konudan sapan cümleyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-002"},{"area":"soz","topic":"yapi","sub":"Anlam bütünlüğünü bozan cümle","level":3,"q":"(I) Çocuklarda okuma alışkanlığı büyük ölçüde evde kazanılır. (II) Kitapların kolayca ulaşılabilir olduğu, anne babanın da okuduğu evlerde büyüyen çocuklar okumayı doğal bir etkinlik olarak benimser. (III) Okulda verilen zorunlu okuma ödevleri ise bazen bu alışkanlığı desteklemek yerine okumayı bir yüke dönüştürebilir. (IV) Çocuk edebiyatı son yıllarda resimli kitaplarla görsel açıdan oldukça zenginleşmiştir. (V) Bu nedenle okuma sevgisinin kazandırılmasında ailenin örnek olması, okulun dayatmalarından daha belirleyicidir.<br>Numaralanmış cümlelerden hangisi, parçanın <b>anlam bütünlüğünü bozmaktadır</b>?","opts":["II","V","I","IV","III"],"a":3,"sol":["Parça okuma alışkanlığının kazanılmasında aile ve okulun rolünü karşılaştırır.","IV. cümle çocuk kitaplarının görsel niteliğine geçer; V. cümledeki sonuç ise I–III'e dayanır."],"kaz":"Paragrafın konusunu ve akışını izleyerek konudan sapan cümleyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-003"},{"area":"soz","topic":"yapi","sub":"Anlam bütünlüğünü bozan cümle","level":3,"q":"(I) Kentlerdeki ağaçlar yaz aylarında çevre sıcaklığını birkaç derece düşürebilmektedir. (II) Kentlerde yaşayan nüfus, kırsal kesimdeki nüfusu çoktan geride bırakmıştır. (III) Ağaçlar gölge oluşturmalarının yanı sıra yapraklarından buharlaşan suyla da havayı serinletir. (IV) Bu yönüyle ağaçlandırma, kentlerin iklim değişikliğine uyum sağlamasında düşük maliyetli bir çözüm sunar. (V) Ancak ağaç türleri seçilirken kentin iklimi ve su kaynakları dikkate alınmalıdır.<br>Numaralanmış cümlelerden hangisi, parçanın <b>anlam bütünlüğünü bozmaktadır</b>?","opts":["V","I","III","II","IV"],"a":3,"sol":["Parçanın konusu ağaçların kentleri serinletme işlevidir.","II. cümle nüfus dağılımına geçerek konudan sapar."],"kaz":"Paragrafın konusunu ve akışını izleyerek konudan sapan cümleyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-004"},{"area":"soz","topic":"yapi","sub":"Anlam bütünlüğünü bozan cümle","level":4,"q":"(I) Türkçe, eklemeli bir dil olduğundan sözcük türetme olanakları oldukça geniştir. (II) Çeviri, bir metni yalnızca bir dilden ötekine aktarmak değildir. (III) Çevirmen, kaynak metnin kültürel göndermelerini hedef dilin okuruna da anlamlı gelecek biçimde yeniden kurmak zorundadır. (IV) Bu nedenle iyi bir çevirmen iki dili bildiği kadar iki kültürü de tanımalıdır. (V) Deyimler ve atasözleri bu bağlamda çevirmeni en çok zorlayan öğelerdir.<br>Numaralanmış cümlelerden hangisi, parçanın <b>anlam bütünlüğünü bozmaktadır</b>?","opts":["I","II","IV","III","V"],"a":0,"sol":["II–V. cümleler çevirinin kültürel boyutunu anlatır.","I. cümle Türkçenin yapısına ilişkin genel bir bilgi verir ve paragrafın konusuyla bağlantı kurmaz."],"kaz":"Paragrafın konusunu ve akışını izleyerek konudan sapan cümleyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-005"},{"area":"soz","topic":"yapi","sub":"Anlam bütünlüğünü bozan cümle","level":3,"q":"(I) Düzenli fiziksel etkinlik yalnızca bedensel değil ruhsal sağlık için de önemlidir. (II) Egzersiz sırasında salgılanan bazı hormonlar kişinin kendini daha iyi hissetmesini sağlar. (III) Olimpiyat oyunlarının kökeni Antik Yunan'a dayanmaktadır. (IV) Bu nedenle hekimler hafif depresyonun tedavisinde düzenli yürüyüşü de önermektedir. (V) Üstelik grup sporları bireyin sosyal bağlarını güçlendirerek yalnızlık duygusunu azaltır.<br>Numaralanmış cümlelerden hangisi, parçanın <b>anlam bütünlüğünü bozmaktadır</b>?","opts":["V","I","III","IV","II"],"a":2,"sol":["Konu sporun ruh sağlığına etkisidir.","III. cümle olimpiyatların tarihine geçer; IV. cümledeki 'Bu nedenle' II. cümleye bağlanır."],"kaz":"Paragrafın konusunu ve akışını izleyerek konudan sapan cümleyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-006"},{"area":"soz","topic":"yapi","sub":"Anlam bütünlüğünü bozan cümle","level":3,"q":"(I) Pek çok müze, koleksiyonlarını dijital ortama aktararak dünyanın her yerinden erişime açmaktadır. (II) Bu sayede müzeyi ziyaret etme olanağı bulamayanlar da eserleri ayrıntılı biçimde inceleyebilmektedir. (III) Araştırmacılar da eserlere ilişkin verilere zaman ve mekân sınırı olmadan ulaşabilmektedir. (IV) Müzelerin büyük bölümü hafta başında bakım ve temizlik için kapalıdır. (V) Ne var ki dijital kopya, eserin karşısında durmanın verdiği deneyimin yerini tam olarak tutamaz.<br>Numaralanmış cümlelerden hangisi, parçanın <b>anlam bütünlüğünü bozmaktadır</b>?","opts":["V","II","III","IV","I"],"a":3,"sol":["Parça müzelerin dijitalleşmesinin yararlarını ve sınırını anlatır.","IV. cümle müzelerin kapalı olduğu günlere değinir; dijital erişim konusuyla ilgisizdir."],"kaz":"Paragrafın konusunu ve akışını izleyerek konudan sapan cümleyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-007"},{"area":"soz","topic":"yapi","sub":"Anlam bütünlüğünü bozan cümle","level":3,"q":"(I) Su ayak izi, bir ürünün üretiminde kullanılan toplam su miktarını ifade eder. (II) Örneğin bir fincan kahvenin, çekirdeğin yetiştirilmesinden paketlenmesine kadar yaklaşık 130 litre su gerektirdiği hesaplanmaktadır. (III) Bu tür hesaplamalar, tüketicilerin görünmeyen su tüketimini fark etmesini sağlar. (IV) Su ayak izi kavramı, tüketim tercihlerimizin su kaynakları üzerindeki etkisini görünür kılar. (V) Kahve, ilk olarak Etiyopya'da keşfedildiği kabul edilen bir bitkidir.<br>Numaralanmış cümlelerden hangisi, parçanın <b>anlam bütünlüğünü bozmaktadır</b>?","opts":["II","V","I","IV","III"],"a":1,"sol":["Parçanın konusu su ayak izi kavramıdır; kahve yalnızca örnek olarak kullanılmıştır.","V. cümle örnekteki kahvenin kökenine geçerek ana konudan uzaklaşır."],"kaz":"Paragrafın konusunu ve akışını izleyerek konudan sapan cümleyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-008"},{"area":"soz","topic":"yapi","sub":"Cümle yer değiştirme","level":3,"q":"(I) Kâğıdın icadından önce yazı taş, kil tablet ve parşömen gibi malzemelere yazılıyordu. (II) Böylece yazılı bilgi hem daha ucuz hem de daha kolay taşınır hâle geldi. (III) Kâğıt Çin'de bulunduktan sonra yüzyıllar içinde İpek Yolu üzerinden batıya yayıldı. (IV) Bu malzemeler ya çok ağırdı ya da üretimleri çok pahalıydı. (V) Bu gelişme matbaanın icadıyla birleşince bilginin yayılma hızı benzeri görülmemiş bir düzeye ulaştı.<br>Bu parçada numaralanmış cümlelerin anlamlı bir bütün oluşturacak biçimde sıralanması için hangi iki cümlenin <b>yer değiştirmesi</b> gerekir?","opts":["II ile V","II ile IV","I ile V","I ile II","IV ile V"],"a":1,"sol":["'Bu malzemeler' ifadesi I. cümledeki malzemelere, 'Böylece' ise kâğıdın yayılmasına (III) bağlanmalıdır.","II ve IV yer değiştirince sıra: malzemeler → sorunları → kâğıdın yayılması → sonuç → matbaa."],"kaz":"Gönderim öğelerini (bu, böylece, örneğin) izleyerek cümle sırasını kurar.","sure":90,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-009"},{"area":"soz","topic":"yapi","sub":"Cümle yer değiştirme","level":3,"q":"(I) Göçmen kuşlar binlerce kilometrelik yolculuklarında yönlerini şaşırmadan hedeflerine ulaşır. (II) Uzun süre bu yeteneğin nasıl işlediği bir sır olarak kaldı. (III) Bu bulgular, kuşların adeta doğal bir pusulaya sahip olduğunu gösteriyor. (IV) Hatta bazı türlerin gözlerinde manyetik alanı algılayan özel proteinler bulundu. (V) Günümüzde araştırmacılar, kuşların güneşin konumunu, yıldızları ve dünyanın manyetik alanını birlikte kullandığını düşünüyor.<br>Bu parçada numaralanmış cümlelerin anlamlı bir bütün oluşturacak biçimde sıralanması için hangi iki cümlenin <b>yer değiştirmesi</b> gerekir?","opts":["I ile II","IV ile V","II ile IV","III ile V","I ile V"],"a":3,"sol":["'Bu bulgular' ifadesi bulguların anlatıldığı cümlelerden sonra gelmelidir.","III ile V yer değiştirince: yetenek → sır → açıklama → kanıt → sonuç."],"kaz":"Gönderim öğelerini (bu, böylece, örneğin) izleyerek cümle sırasını kurar.","sure":90,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-010"},{"area":"soz","topic":"yapi","sub":"Cümle yer değiştirme","level":2,"q":"(I) Kısa sürede yalnızca kahve içilen yerler olmaktan çıkıp sohbetin, haber alışverişinin ve tartışmanın merkezi hâline geldiler. (II) Kahvehaneler Osmanlı kentlerinde 16. yüzyıldan itibaren yaygınlaşmaya başladı. (III) Meddahların hikâyelerini anlattığı, şiirlerin okunduğu mekânlar olarak kültürel yaşamı da beslediler. (IV) Bu canlılık, zaman zaman yönetimin kaygıyla izlediği bir kamusal alan yarattı. (V) Nitekim bazı dönemlerde kahvehaneler geçici olarak kapatıldı.<br>Bu parçada numaralanmış cümlelerin anlamlı bir bütün oluşturacak biçimde sıralanması için hangi iki cümlenin <b>yer değiştirmesi</b> gerekir?","opts":["IV ile V","II ile III","I ile II","I ile III","II ile V"],"a":2,"sol":["'Kısa sürede' ifadesi bir başlangıçtan sonra gelmelidir; parça bu nedenle yaygınlaşmayı anlatan cümleyle açılmalıdır."],"kaz":"Gönderim öğelerini (bu, böylece, örneğin) izleyerek cümle sırasını kurar.","sure":90,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-011"},{"area":"soz","topic":"yapi","sub":"Cümle yer değiştirme","level":3,"q":"(I) İnsan beyni, yeni bir beceri öğrenildiğinde yapısal olarak değişebilir. (II) Bu özelliğe nöroplastisite adı verilir. (III) Bu bulgu, öğrenmenin yalnızca çocuklukla sınırlı olmadığını gösterir. (IV) Örneğin müzik aleti çalmayı öğrenen yetişkinlerde ilgili beyin bölgelerinde belirgin değişimler saptanmıştır. (V) Dolayısıyla hayat boyu öğrenme beynin sağlığını korumanın da bir yoludur.<br>Bu parçada numaralanmış cümlelerin anlamlı bir bütün oluşturacak biçimde sıralanması için hangi iki cümlenin <b>yer değiştirmesi</b> gerekir?","opts":["II ile IV","I ile II","IV ile V","I ile V","III ile IV"],"a":4,"sol":["'Bu bulgu' ifadesi, örnekteki bulgudan (müzik aleti) sonra gelmelidir.","III ile IV yer değiştirince örnek → bulgu → sonuç sırası kurulur."],"kaz":"Gönderim öğelerini (bu, böylece, örneğin) izleyerek cümle sırasını kurar.","sure":90,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-012"},{"area":"soz","topic":"yapi","sub":"Cümle yer değiştirme","level":3,"q":"(I) Bu yüzden şirketler ürün geliştirmeye harcadıkları kadar markalarına da yatırım yapar. (II) Tüketicilerin o ürüne biçtiği değer de fiyatı doğrudan etkiler. (III) Örneğin aynı kalitedeki iki ürün, markalarının algılanış biçimine göre çok farklı fiyatlarla satılabilir. (IV) Bir ürünün fiyatı yalnızca üretim maliyetiyle belirlenmez. (V) Reklam bütçelerinin üretim bütçelerini aştığı sektörler bu durumun açık örnekleridir.<br>Bu parçada numaralanmış cümlelerin anlamlı bir bütün oluşturacak biçimde sıralanması için hangi iki cümlenin <b>yer değiştirmesi</b> gerekir?","opts":["I ile IV","I ile II","II ile V","IV ile V","II ile III"],"a":0,"sol":["'Bu yüzden' ile başlayan cümle parçayı açamaz; bir gerekçeden sonra gelmelidir.","I ile IV yer değiştirince: genel yargı → ek etken → örnek → sonuç → örnek sektörler."],"kaz":"Gönderim öğelerini (bu, böylece, örneğin) izleyerek cümle sırasını kurar.","sure":90,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-013"},{"area":"soz","topic":"yapi","sub":"Söz dizimi / sıralama","level":2,"q":"I. yalnızca<br>II. bilgi aktarmakla kalmamalı<br>III. iyi bir öğretmen<br>IV. öğrencilerine<br>V. merak duygusunu da aşılamalıdır<br>Yukarıda numaralanmış sözler anlamlı ve kurallı bir cümle oluşturacak biçimde sıralandığında hangisi <b>sondan ikinci</b> olur?","opts":["II","V","IV","III","I"],"a":0,"sol":["Kurallı cümle: 'İyi bir öğretmen (III) öğrencilerine (IV) yalnızca (I) bilgi aktarmakla kalmamalı (II), merak duygusunu da aşılamalıdır (V).'","I ile IV yer değiştirse de II sondan ikinci kalır."],"kaz":"Söz öbeklerini kurallı cümle düzenine yerleştirir.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-014"},{"area":"soz","topic":"yapi","sub":"Söz dizimi / sıralama","level":2,"q":"I. kentlerin<br>II. yeşil alanlar<br>III. hava kalitesini artırmanın<br>IV. en etkili yollarından biri<br>V. olmaya devam ediyor<br>Yukarıda numaralanmış sözler anlamlı ve kurallı bir cümle oluşturacak biçimde sıralandığında hangisi <b>baştan üçüncü</b> olur?","opts":["II","I","IV","V","III"],"a":4,"sol":["Kurallı cümle: 'Yeşil alanlar (II), kentlerin (I) hava kalitesini artırmanın (III) en etkili yollarından biri (IV) olmaya devam ediyor (V).'"],"kaz":"Özne–tümleç–yüklem düzenini kurar.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-015"},{"area":"soz","topic":"yapi","sub":"Söz dizimi / sıralama","level":2,"q":"I. özenle<br>II. sınav öncesinde<br>III. hazırlanan bir çalışma planı<br>IV. adayın kaygısını<br>V. önemli ölçüde azaltır<br>Yukarıda numaralanmış sözler anlamlı ve kurallı bir cümle oluşturacak biçimde sıralandığında hangisi <b>baştan dördüncü</b> olur?","opts":["II","I","IV","V","III"],"a":2,"sol":["Kurallı cümle: 'Sınav öncesinde (II) özenle (I) hazırlanan bir çalışma planı (III) adayın kaygısını (IV) önemli ölçüde azaltır (V).'"],"kaz":"Sıfat-fiil öbeğini doğru konumlandırır.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-016"},{"area":"soz","topic":"yapi","sub":"Söz dizimi / sıralama","level":2,"q":"I. bugünü<br>II. tarih<br>III. yalnızca geçmişi değil<br>IV. de anlamamızı<br>V. sağlayan bir bilimdir<br>Yukarıda numaralanmış sözler anlamlı ve kurallı bir cümle oluşturacak biçimde sıralandığında hangisi <b>baştan üçüncü</b> olur?","opts":["V","III","IV","I","II"],"a":3,"sol":["Kurallı cümle: 'Tarih (II), yalnızca geçmişi değil (III) bugünü (I) de anlamamızı (IV) sağlayan bir bilimdir (V).'"],"kaz":"'Yalnızca … değil … de' yapısını doğru kurar.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-017"},{"area":"soz","topic":"yapi","sub":"Paragraf tamamlama","level":3,"q":"Bir dilin zenginliği yalnızca sözcük sayısıyla ölçülmez. ---- Örneğin Türkçede ekler aracılığıyla tek bir kökten onlarca yeni sözcük türetilebilir.<br>Bu parçada boş bırakılan yere düşüncenin akışına göre aşağıdakilerden hangisi getirilmelidir?","opts":["Türkçe, dünyada en çok konuşulan diller arasında yer alır.","Sözlükler her yıl yeni baskılarla güncellenmektedir.","Yabancı sözcükler bir dili zamanla zayıflatır.","Dilin yeni kavramları kendi olanaklarıyla karşılayabilme gücü de bu zenginliğin önemli bir göstergesidir.","Dil, düşüncenin aynasıdır."],"a":3,"sol":["Boşluktan sonraki örnek 'türetme' ile ilgilidir; boşluk bu örneğin desteklediği bir yargı içermelidir.","Yalnızca ilk seçenek 'sözcük sayısı dışında bir zenginlik ölçütü' getirir ve örnekle bağ kurar."],"kaz":"Örnekten geriye doğru düşüncenin akışını kurar.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-018"},{"area":"soz","topic":"yapi","sub":"Paragraf tamamlama","level":3,"q":"Bilimsel bilgi kesin değil, sürekli sınanan ve gerektiğinde düzeltilen bir bilgidir. ---- Bu durum bilimin zayıflığı değil, tam tersine gücüdür.<br>Bu parçada boş bırakılan yere düşüncenin akışına göre aşağıdakilerden hangisi getirilmelidir?","opts":["Bilim insanları çalışmalarının çoğunu laboratuvarda yürütür.","Felsefe, bilimin annesi olarak kabul edilir.","Bilim tarihinde pek çok kadın bilim insanı önemli katkılar yapmıştır.","Yeni kanıtlar ortaya çıktığında en köklü kuramlar bile değiştirilebilir.","Bilimsel bilgi deneylerle kesinlik kazanır ve bir daha değişmez."],"a":3,"sol":["'Bu durum' ifadesi, boşluktaki cümlenin bir 'değişebilirlik' durumu anlatmasını gerektirir.","İkinci yanlış seçenek ilk cümleyle çelişir."],"kaz":"Gönderim öğesine (bu durum) uygun cümleyi seçer.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-019"},{"area":"soz","topic":"yapi","sub":"Paragraf tamamlama","level":3,"q":"Kentlerde bisiklet kullanımını artırmak için yalnızca yol yapmak yeterli değildir. Güvenli park alanları, toplu taşımayla bağlantı ve sürücülerin bilinçlendirilmesi de en az yollar kadar önemlidir. ----<br>Bu parça aşağıdakilerden hangisiyle <b>tamamlanabilir</b>?","opts":["Bu nedenle öncelikle yeni bisiklet yolları yapılmalıdır.","Yani bisiklet dostu bir kent tek bir yatırımla değil, birbirini tamamlayan düzenlemelerle oluşur.","Avrupa kentlerinde bisiklet kullanımı oldukça yaygındır.","Bisiklet, sağlıklı ve çevreci bir ulaşım aracıdır.","Bisikletin ilk örnekleri 19. yüzyılda ortaya çıkmıştır."],"a":1,"sol":["Parça birden çok etkenin birlikte gerektiğini söyler; sonuç cümlesi bunu özetlemelidir.","'Öncelikle yeni yollar' seçeneği ilk cümleyle çelişir."],"kaz":"Paragrafı uygun bir sonuç cümlesiyle bağlar.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-020"},{"area":"soz","topic":"yapi","sub":"Paragraf tamamlama","level":2,"q":"Bir romanda karakterlerin inandırıcılığı, onların kusurlarıyla birlikte verilmesine bağlıdır. ---- Okur kendisine benzeyen, hata yapabilen karakterlerle daha kolay bağ kurar.<br>Bu parçada boş bırakılan yere düşüncenin akışına göre aşağıdakilerden hangisi getirilmelidir?","opts":["Romanların çoğu birinci tekil şahıs ağzından anlatılır.","Karakter adları romanın geçtiği döneme uygun seçilmelidir.","İyi bir roman her şeyden önce sürükleyici olmalıdır.","Okurlar mutlu sonla biten romanları daha çok sever.","Hiç hata yapmayan, her durumda doğru kararı veren bir kahraman okura yapay gelir."],"a":4,"sol":["Boşluk, 'kusurlu karakter inandırıcıdır' yargısının karşıt durumu üzerinden açıklanmasına uygundur.","Sonraki cümle de bu açıklamayı okur açısından tamamlar."],"kaz":"Karşıt örnekle düşünceyi destekleyen cümleyi bulur.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-021"},{"area":"soz","topic":"yapi","sub":"Paragraf tamamlama","level":3,"q":"---- Bu nedenle sağlıklı beslenme, tek tek besinlerden çok bunların nasıl bir araya getirildiğiyle ilgilidir. Dengeli bir tabak farklı besin gruplarını uygun oranlarda içerir.<br>Bu parça aşağıdakilerden hangisiyle <b>başlatılmalıdır</b>?","opts":["Hazır yiyecek tüketimi gençler arasında giderek artmaktadır.","Bazı besinler vücudun bütün ihtiyaçlarını tek başına karşılar.","Hiçbir besin, vücudun ihtiyaç duyduğu öğelerin tümünü tek başına karşılayamaz.","Diyetisyenler kilo vermek için öğün atlamayı önermez.","Yemek kültürü bölgeden bölgeye farklılık gösterir."],"a":2,"sol":["'Bu nedenle' ifadesi, birleştirmenin önemini doğuran bir gerekçe ister: tek besinin yetmemesi.","Üçüncü seçenek bu gerekçenin tam tersidir."],"kaz":"Giriş cümlesini sonraki cümlenin bağlacından hareketle belirler.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-022"},{"area":"soz","topic":"yapi","sub":"Paragraf tamamlama","level":3,"q":"Teknoloji, insanların birbirleriyle iletişim kurmasını hiç olmadığı kadar kolaylaştırdı. ---- Ekranlar aracılığıyla sürekli bağlantıda olmak, çoğu zaman yüz yüze ilişkilerin derinliğinin yerini tutmuyor.<br>Bu parçada boş bırakılan yere düşüncenin akışına göre aşağıdakilerden hangisi getirilmelidir?","opts":["Akıllı telefonların satışı her yıl artıyor.","İletişim teknolojileri ilk olarak askerî amaçlarla geliştirildi.","Ne var ki iletişim olanaklarının artması, ilişkilerin niteliğinin de arttığı anlamına gelmiyor.","Bu sayede insanlar hiç olmadığı kadar derin dostluklar kuruyor.","Yüz yüze görüşmeler zaman kaybı olarak görülmelidir."],"a":2,"sol":["İlk cümle olumlu, son cümle olumsuz bir durum anlatıyor; boşluk bu geçişi sağlayan 'ne var ki' cümlesidir.","'Derin dostluklar' seçeneği son cümleyle çelişir."],"kaz":"Düşünce yönünü değiştiren geçiş cümlesini bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-023"},{"area":"soz","topic":"yapi","sub":"Anlam bütünlüğünü bozan cümle","level":2,"q":"(I) Gönüllülük, bireyin karşılık beklemeden topluma katkı sunmasıdır. (II) Araştırmalar, düzenli gönüllü çalışmalara katılanların kendilerini daha anlamlı bir yaşamın parçası olarak hissettiğini gösteriyor. (III) Gönüllüler, yeni insanlarla tanışarak sosyal çevrelerini de genişletiyor. (IV) Pek çok ülkede asgari ücret her yıl yeniden belirlenmektedir. (V) Kısacası gönüllülük, yardım edilen kadar yardım edene de kazandıran bir etkinliktir.<br>Numaralanmış cümlelerden hangisi, parçanın <b>anlam bütünlüğünü bozmaktadır</b>?","opts":["IV","III","I","II","V"],"a":0,"sol":["Parçanın konusu gönüllülüğün gönüllüye sağladığı yararlardır.","IV. cümle ücretli çalışmaya ilişkin bir düzenlemeye geçer; V. cümledeki 'Kısacası' ise II ve III'ü toparlar."],"kaz":"Paragrafın konusunu ve akışını izleyerek konudan sapan cümleyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-024"},{"area":"soz","topic":"yapi","sub":"Anlam bütünlüğünü bozan cümle","level":4,"q":"(I) Mikroplastikler, boyutu 5 milimetreden küçük plastik parçacıklardır. (II) Bu parçacıklar büyük plastik atıkların zamanla parçalanmasıyla ya da kozmetik ürünlerdeki mikro boncuklardan doğrudan oluşur. (III) Plastik, hafifliği ve dayanıklılığı sayesinde ambalaj sektöründe yaygın biçimde kullanılmaktadır. (IV) Denizlere ulaşan mikroplastikler besin zinciri yoluyla insan vücuduna kadar girebilmektedir. (V) Bu nedenle bilim insanları, tek kullanımlık plastiklerin azaltılmasını acil bir öncelik olarak görüyor.<br>Numaralanmış cümlelerden hangisi, parçanın <b>anlam bütünlüğünü bozmaktadır</b>?","opts":["V","II","III","IV","I"],"a":2,"sol":["Parça mikroplastiklerin tanımını, kaynağını, yayılışını ve buna karşı önerilen önlemi anlatır.","III. cümle plastiğin ambalajda neden tercih edildiğine geçer; aynı genel alanda olsa da mikroplastik konusundan sapar."],"kaz":"Paragrafın konusunu ve akışını izleyerek konudan sapan cümleyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-025"},{"area":"soz","topic":"yapi","sub":"Anlam bütünlüğünü bozan cümle","level":3,"q":"(I) Bir dili konuşanların sayısı azaldığında o dil yalnızca sözcüklerini değil, taşıdığı bilgi birikimini de yitirme tehlikesiyle karşılaşır. (II) Dünyanın en çok konuşulan dilleri arasında Çince, İngilizce ve İspanyolca yer alır. (III) Örneğin bazı yerel dillerde bitkilerin tıbbi özelliklerine ilişkin yüzyıllık bilgiler yalnızca sözlü olarak aktarılmaktadır. (IV) Son konuşurlar öldüğünde bu bilgiler çoğu zaman kayıt altına alınmadan kaybolur. (V) Bu yüzden dilbilimciler, tehlike altındaki dilleri belgeleme çalışmalarına öncelik vermektedir.<br>Numaralanmış cümlelerden hangisi, parçanın <b>anlam bütünlüğünü bozmaktadır</b>?","opts":["I","V","III","IV","II"],"a":4,"sol":["Parçanın konusu, yok olma tehlikesindeki dillerle birlikte kaybolan bilgi birikimidir.","II. cümle en çok konuşulan dillere geçer; III. cümledeki 'Örneğin' de I. cümleye bağlanır."],"kaz":"Paragrafın konusunu ve akışını izleyerek konudan sapan cümleyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-026"},{"area":"soz","topic":"yapi","sub":"Cümle yer değiştirme","level":3,"q":"(I) Kentlerde gece aydınlatmasının artması, ışık kirliliği adı verilen bir sorunu beraberinde getirdi. (II) Bu sorun yalnızca gökyüzünü gözlemleyen astronomları etkilemiyor. (III) Bu nedenle bazı kentler sokak lambalarını yalnızca aşağıyı aydınlatacak biçimde yeniden tasarlıyor. (IV) İnsanlarda ise gece boyunca ışığa maruz kalmak uyku düzenini bozabiliyor. (V) Gece göç eden kuşlar yapay ışıklar nedeniyle yönlerini şaşırabiliyor.<br>Bu parçada numaralanmış cümlelerin anlamlı bir bütün oluşturacak biçimde sıralanması için hangi iki cümlenin <b>yer değiştirmesi</b> gerekir?","opts":["I ile V","I ile II","II ile IV","IV ile V","III ile V"],"a":4,"sol":["'Bu nedenle' ile başlayan çözüm cümlesi, sorunun etkileri sayıldıktan sonra gelmelidir.","III ile V yer değiştirince: sorun → yalnızca astronomlar değil → kuşlar → insanlar → çözüm."],"kaz":"Gönderim öğelerini (bu, böylece, örneğin) izleyerek cümle sırasını kurar.","sure":90,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-027"},{"area":"soz","topic":"yapi","sub":"Cümle yer değiştirme","level":4,"q":"(I) Arkeologlar bir yerleşim yerinin ne zaman kurulduğunu belirlemek için çeşitli tarihleme yöntemleri kullanır. (II) Canlılar öldükten sonra karbon-14 düzenli bir hızla azaldığından kalan miktar, ölüm zamanını gösterir. (III) Bunlardan en bilineni, organik kalıntılardaki karbon-14 miktarının ölçülmesine dayanır. (IV) Ancak bu yöntem yaklaşık 50 bin yıldan eski kalıntılarda güvenilir sonuç vermez. (V) Daha eski buluntular için ise volkanik katmanlara dayanan farklı yöntemler tercih edilir.<br>Bu parçada numaralanmış cümlelerin anlamlı bir bütün oluşturacak biçimde sıralanması için hangi iki cümlenin <b>yer değiştirmesi</b> gerekir?","opts":["I ile V","I ile II","II ile V","IV ile V","II ile III"],"a":4,"sol":["'Bunlardan en bilineni' ifadesi I. cümledeki 'tarihleme yöntemleri'ne bağlanır ve hemen ardından gelmelidir.","Karbon-14'ün azalması ancak yöntem tanıtıldıktan sonra açıklanabilir; II ile III yer değiştirmelidir."],"kaz":"Gönderim öğelerini (bu, böylece, örneğin) izleyerek cümle sırasını kurar.","sure":90,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-028"},{"area":"soz","topic":"yapi","sub":"Söz dizimi / sıralama","level":2,"q":"I. bir toplumun<br>II. kültürel mirası<br>III. yalnızca müzelerde değil<br>IV. gündelik alışkanlıklarında da<br>V. yaşamaya devam eder<br>Yukarıda numaralanmış sözler anlamlı ve kurallı bir cümle oluşturacak biçimde sıralandığında hangisi <b>baştan ikinci</b> olur?","opts":["II","IV","V","III","I"],"a":0,"sol":["Kurallı cümle: 'Bir toplumun (I) kültürel mirası (II) yalnızca müzelerde değil (III) gündelik alışkanlıklarında da (IV) yaşamaya devam eder (V).'","İlgi hâlindeki 'bir toplumun' tamlanan olan 'kültürel mirası'ndan hemen önce gelir."],"kaz":"Tamlama ve '… değil … da' yapısını doğru sıralar.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-029"},{"area":"soz","topic":"yapi","sub":"Paragraf tamamlama","level":3,"q":"Uzaktan çalışma, çalışanlara zaman ve mekân esnekliği sağlıyor. ---- Bu nedenle pek çok şirket, haftanın birkaç gününü ofiste geçirmeyi öngören karma modellere yöneliyor.<br>Bu parçada boş bırakılan yere düşüncenin akışına göre aşağıdakilerden hangisi getirilmelidir?","opts":["Şirketler ofis kira giderlerini düşürmek istiyor.","Uzaktan çalışma ilk kez geçen yüzyılın ikinci yarısında tartışılmaya başlandı.","Bu esneklik sayesinde çalışanlar ofise artık hiç ihtiyaç duymuyor.","Çalışanların çoğu evden çalışmayı tercih ediyor.","Ancak ekip içi iletişimin ve kurum kültürünün zayıflaması, bu modelin göz ardı edilemeyecek bir bedeli olarak görülüyor."],"a":4,"sol":["Karma modele yönelişin 'nedeni' boşlukta olmalıdır: Tamamen uzaktan çalışmanın bir sakıncası.","'Ofise hiç ihtiyaç duymuyor' sonuç cümlesiyle çelişir; kira ve tercih seçenekleri ofise dönüşü değil uzaktan çalışmayı destekler."],"kaz":"Sonuç cümlesinden geriye doğru gerekçeyi bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-030"},{"area":"soz","topic":"yapi","sub":"Paragraf tamamlama","level":3,"q":"---- Örneğin aynı sözcük, söylenişteki vurguya göre soru, şaşkınlık ya da öfke anlatabilir. Bu nedenle yazılı iletişimde yanlış anlaşılmalar sözlü iletişime göre daha sık yaşanır.<br>Bu parça aşağıdakilerden hangisiyle <b>başlatılmalıdır</b>?","opts":["Konuşurken iletilen anlamın önemli bir kısmı, sözcüklerden çok ses tonu ve vurguyla taşınır.","Sözcükler her bağlamda aynı anlamı taşır.","Dil bilgisi kuralları yazı dilinde daha katıdır.","Telefonla konuşmak mektup yazmaktan daha pahalıdır.","Yazılı iletişim, sözlü iletişimden daha eski bir yöntemdir."],"a":0,"sol":["'Örneğin' cümlesi vurgunun anlamı değiştirdiğini örnekler; giriş cümlesi bu genel yargıyı vermelidir.","Son cümledeki sonuç da yazıda tonun kaybolmasına dayanır."],"kaz":"Örnek ve sonuç cümlelerinden giriş cümlesini çıkarır.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-031"},{"area":"soz","topic":"yapi","sub":"Paragraf tamamlama","level":2,"q":"Bir kentin turizm potansiyeli yalnızca tarihî yapılarıyla ölçülmez. Yerel mutfağı, el sanatları ve festivalleri de ziyaretçilerin o kenti seçmesinde belirleyici olabilir. ----<br>Bu parça aşağıdakilerden hangisiyle <b>tamamlanabilir</b>?","opts":["El sanatları kırsal bölgelerde daha yaygındır.","Tarihî yapılar turizm açısından hiçbir önem taşımaz.","Bu nedenle yalnızca tarihî yapıların restorasyonuna kaynak ayrılmalıdır.","Dolayısıyla turizm planlaması, somut mirasın yanında yaşayan kültürü de gözetmelidir.","Festivaller genellikle yaz aylarında düzenlenir."],"a":3,"sol":["Parça iki öğeyi (tarihî yapılar + yaşayan kültür) birlikte önemser; sonuç cümlesi bu ikisini birleştirmelidir.","İlk ve son yanlış seçenekler parçanın iki yönünden birini dışlar."],"kaz":"Paragrafı uygun bir sonuç cümlesiyle tamamlar.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-YAP-032"},{"area":"soz","topic":"paragraf","sub":"Ana düşünce","level":2,"q":"Yetenek, bir alanda başarılı olmak için gerekli bir başlangıç noktasıdır; ancak tek başına yeterli değildir. Pek çok yetenekli kişi, disiplinli çalışma alışkanlığı kazanamadığı için potansiyelini gerçekleştiremez. Buna karşın orta düzeyde yetenekli olup düzenli çalışan kişiler, zamanla çok daha ileri noktalara ulaşabilir.<br>Bu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Başarı için yetenek gereksizdir.","Başarıda düzenli ve disiplinli çalışma, yetenek kadar hatta ondan daha çok belirleyici olabilir.","Orta düzeyde yetenekli kişiler her zaman daha başarılıdır.","Yetenekli insanlar genellikle tembel olur.","Yetenek doğuştan gelir, sonradan kazanılamaz."],"a":1,"sol":["Parça 'ancak tek başına yeterli değildir' diyerek yeteneği yadsımadan disiplinin önemini vurgular.","'Gereksizdir' ve 'her zaman' içeren seçenekler parçadan daha güçlü iddialardır; 'genellikle tembel' ise aşırı genellemedir."],"kaz":"Parçanın ana düşüncesini aşırı genellemelerden ayırır.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-001"},{"area":"soz","topic":"paragraf","sub":"Ana düşünce","level":2,"q":"Eskiden bir bilgiye ulaşmak için kütüphanelerde saatler harcanırdı; bugün aynı bilgiye saniyeler içinde erişebiliyoruz. Ancak bu hız beraberinde başka bir sorunu getirdi: Hangi bilginin doğru olduğunu ayırt etmek. Artık asıl beceri bilgiye ulaşmak değil, ulaşılan bilgiyi sorgulayabilmek ve kaynağını değerlendirebilmektir.<br>Bu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Eskiden insanlar daha doğru bilgiye sahipti.","İnternetteki bilgilerin tamamı yanlıştır.","Bilgiye hızlı erişim yalnızca olumlu sonuçlar doğurmuştur.","Kütüphaneler artık işlevini yitirmiştir.","Günümüzde bilgiye erişmekten çok bilgiyi eleştirel biçimde değerlendirebilmek önem kazanmıştır."],"a":4,"sol":["Son cümle ana düşünceyi doğrudan verir: asıl beceri sorgulamaktır.","Diğer seçenekler parçada yer almayan ya da parçayla çelişen yargılardır."],"kaz":"Ana düşüncenin yerini (çoğunlukla sonuç cümlesi) belirler.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-002"},{"area":"soz","topic":"paragraf","sub":"Çıkarım","level":3,"q":"Antik kentlerde yapılan kazılarda bulunan çanak çömlek parçaları, arkeologlar için çoğu zaman altın sikkelerden daha değerlidir. Çünkü sikkeler genellikle seçkin kesimin elindeydi ve kolayca başka yerlere taşınabiliyordu. Oysa gündelik kullanımdaki kaplar, sıradan insanların ne yiyip içtiğini, hangi bölgelerle ticaret yaptığını ve nasıl yaşadığını doğrudan yansıtır.<br>Bu parçadan aşağıdakilerden hangisi <b>çıkarılabilir</b>?","opts":["Altın sikkeler arkeolojik açıdan değersizdir.","Arkeologlar için bir buluntunun değeri, maddi değerinden çok sunduğu bilgiyle ilgilidir.","Antik kentlerde ticaret yapılmazdı.","Kazılarda sikke bulunması son derece ender görülür.","Çanak çömlekler yalnızca seçkinlerce kullanılırdı."],"a":1,"sol":["Çanak çömleğin altından 'daha değerli' sayılması, değerin bilgi sağlama gücüne bağlandığını gösterir.","'Değersizdir' fazla güçlüdür (parça 'çoğu zaman daha değerli' diyor); ticaret ve seçkinler seçenekleri parçayla çelişir."],"kaz":"Örtük ölçütü (bilgi değeri) metinden çıkarır.","sure":90,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-003"},{"area":"soz","topic":"paragraf","sub":"Yardımcı düşünce","level":2,"q":"Bonsai, ağaçların küçük saksılarda doğadaki görünümlerini koruyacak biçimde yetiştirilmesi sanatıdır. Kökeni Çin'e dayanan bu uygulama daha sonra Japonya'da gelişerek bugünkü biçimini almıştır. Bir bonsainin şekillendirilmesi yıllar, hatta on yıllar sürebilir; bu nedenle sabır bu sanatın vazgeçilmez öğesidir. Düzenli budama ve sulama yapılmadığında ağaç kısa sürede biçimini kaybeder.<br>Bu parçada aşağıdakilerden hangisine <b>değinilmemiştir</b>?","opts":["Şekillendirme sürecinin uzunluğuna","Bonsainin kökenine","Bakım aksatıldığında ortaya çıkan duruma","Bu sanatın gerektirdiği kişisel özelliğe","Bonsai yetiştirmeye en uygun ağaç türlerine"],"a":4,"sol":["Köken (Çin–Japonya), süre (yıllar), kişisel özellik (sabır) ve bakım eksikliğinin sonucu parçada vardır.","Hangi ağaç türlerinin uygun olduğuna hiç değinilmemiştir."],"kaz":"Parçada bulunan ve bulunmayan bilgiyi ayırır.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-004"},{"area":"soz","topic":"paragraf","sub":"Ana düşünce","level":3,"q":"Bir şehrin kimliği, gökdelenlerinden çok sokaklarında gizlidir. Mahalle fırınları, küçük esnaf dükkânları, çocukların oynadığı meydanlar şehri yaşanılır kılan asıl öğelerdir. Hızlı kentsel dönüşüm projeleri bu dokuyu yok ettiğinde şehir, birbirinin aynısı yapı yığınlarına dönüşür.<br>Bu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Bir şehri özgün kılan, gündelik yaşamın sürdüğü küçük ölçekli mekânlardır.","Kentsel dönüşüm projeleri tümüyle durdurulmalıdır.","Gökdelenler şehirlerin en önemli simgeleridir.","Mahalle fırınları ekonomik açıdan verimsizdir.","Büyük şehirlerde çocuklar için yeterli oyun alanı yoktur."],"a":0,"sol":["İlk cümle ana düşünceyi verir; ikinci cümle bu 'sokak' öğelerini örnekler, üçüncüsü bu dokunun kaybının sonucunu gösterir.","'Tümüyle durdurulmalıdır' parçada savunulmayan aşırı bir sonuçtur."],"kaz":"Örneklerle desteklenen ana yargıyı bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-005"},{"area":"soz","topic":"paragraf","sub":"Yazarın tutumu","level":3,"q":"Bazı eleştirmenler popüler romanları edebî değeri olmayan tüketim ürünleri olarak görür. Oysa bugün klasik kabul ettiğimiz pek çok eser, yazıldığı dönemde geniş kitlelerin okuduğu popüler eserlerdi. Bir eserin çok okunması, onun değersiz olduğunun kanıtı olamaz.<br>Bu parçada yazar aşağıdakilerden hangisini <b>eleştirmektedir</b>?","opts":["Popüler romanların çok satmasını","Eleştirmenlerin klasikleri övmesini","Klasik eserlerin artık okunmamasını","Yazarların eserlerinden para kazanmasını","Çok okunmayı edebî değersizliğin ölçütü sayan yaklaşımı"],"a":4,"sol":["'Oysa' ile başlayan cümle ve son yargı, popülerliğin değersizlik kanıtı sayılmasına karşı çıkar."],"kaz":"Yazarın karşı çıktığı görüşü belirler.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-006"},{"area":"soz","topic":"paragraf","sub":"Ana düşünce","level":2,"q":"Bir yabancı dili öğrenmek yalnızca yeni sözcükler ve dil bilgisi kuralları ezberlemek değildir. Her dil, onu konuşan toplumun dünyayı algılayış biçimini de taşır. Bu yüzden bir dili gerçekten öğrenen kişi, farklı bir bakış açısı da kazanır.<br>Bu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Her toplum dünyayı aynı biçimde algılar.","Sözcük ezberlemek dil öğrenmenin en etkili yoludur.","Yabancı dil öğrenmek, insana yeni bir dünya görüşü kazandırır.","Dil bilgisi kuralları ezberlenmeden dil öğrenilemez.","Yabancı dil öğrenmek yalnızca çocuklukta mümkündür."],"a":2,"sol":["'Bu yüzden' ile başlayan son cümle sonucu, yani ana düşünceyi verir."],"kaz":"Sonuç cümlesinden ana düşünceye ulaşır.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-007"},{"area":"soz","topic":"paragraf","sub":"Çıkarım","level":3,"q":"Kuraklığa dayanıklı tohum çeşitleri üzerine yapılan çalışmalar son yıllarda hız kazandı. Bunun başlıca nedeni, iklim değişikliğiyle birlikte yağış düzeninin öngörülemez hâle gelmesi. Uzmanlar, geleneksel tarım yöntemlerinde ısrar eden bölgelerde verimin önümüzdeki on yılda belirgin biçimde düşebileceği uyarısında bulunuyor.<br>Bu parçadan aşağıdakilerden hangisi <b>çıkarılabilir</b>?","opts":["Son yıllarda yağış miktarı düzenli olarak artmıştır.","Geleneksel tarım yöntemleri tamamen terk edilmiştir.","Tohum çalışmaları yalnızca tek bir ülkede yürütülmektedir.","Kuraklığa dayanıklı tohumlar her bölgede verimi kesinlikle artırır.","Tarımda değişen iklim koşullarına uyum sağlamak giderek önem kazanmaktadır."],"a":4,"sol":["Çalışmaların hız kazanması ve uzman uyarıları, iklime uyumun öneminin arttığını gösterir.","'Tamamen terk edilmiştir' parçayla çelişir ('ısrar eden bölgeler' var); 'kesinlikle artırır' parçada yoktur."],"kaz":"Parçadaki verilerden makul ve sınırlı bir çıkarım yapar.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-008"},{"area":"soz","topic":"paragraf","sub":"Başlık","level":2,"q":"Ergenlik döneminde biyolojik saat ileri kayar; gençler doğal olarak geç uyuyup geç uyanmaya eğilim gösterir. Erken başlayan okul saatleri ise bu ritimle çatışır. Araştırmalar, okul başlangıç saatini bir saat ileri alan okullarda öğrencilerin derslere katılımının ve başarısının arttığını gösteriyor.<br>Bu parçaya en uygun başlık aşağıdakilerden hangisidir?","opts":["Okul Saatleri ve Ergenlerin Biyolojik Ritmi","Ev Ödevlerinin Gereksizliği","Uykusuzluğun Kısa Tarihi","Ergenlerde Beslenme Sorunları","Öğretmenlerin Çalışma Saatleri"],"a":0,"sol":["Parçanın konusu, ergenlerin uyku ritmi ile okul başlangıç saatleri arasındaki ilişkidir; başlık iki öğeyi de kapsamalıdır."],"kaz":"Konuyu kapsayan başlığı seçer.","sure":50,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-009"},{"area":"soz","topic":"paragraf","sub":"Ana düşünce","level":2,"q":"Eleştiri, karşısındakini küçük düşürmek için değil, onun daha iyiye ulaşmasına katkı sağlamak için yapıldığında anlam kazanır. Yapıcı bir eleştiri, eksikleri gösterirken güçlü yönleri de görmezden gelmez ve somut öneriler içerir. Böyle bir eleştiriyi alan kişi, savunmaya geçmek yerine kendini geliştirmeye yönelir.<br>Bu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Eleştirinin değeri, kişinin gelişimine katkı sağlamasından gelir.","Eleştiri her zaman kırıcıdır.","Güçlü yönleri söylemek eleştirinin etkisini azaltır.","İnsanlar eleştiriye karşı daima savunmaya geçer.","Eleştiri yalnızca uzmanlar tarafından yapılmalıdır."],"a":0,"sol":["İlk cümle ana düşünceyi verir; diğer cümleler yapıcı eleştirinin özelliklerini ve sonucunu açıklar."],"kaz":"Giriş cümlesinde verilen ana düşünceyi belirler.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-010"},{"area":"soz","topic":"paragraf","sub":"Yardımcı düşünce","level":2,"q":"Ahşap binlerce yıldır yapı malzemesi olarak kullanılmaktadır. Hafif olması, kolay işlenmesi ve ısıyı iyi yalıtması onu cazip kılar. Günümüzde mühendislik ürünü ahşap paneller sayesinde çok katlı ahşap binalar da yapılabilmektedir. Üstelik ağaçlar büyürken karbon depoladığından, sürdürülebilir ormanlardan elde edilen ahşap çevre açısından da avantajlıdır.<br>Bu parçada ahşapla ilgili aşağıdakilerden hangisine <b>değinilmemiştir</b>?","opts":["Maliyetinin diğer yapı malzemeleriyle karşılaştırılmasına","Uzun bir kullanım geçmişi olduğuna","Çevresel yararlarına","Kolay işlenebildiğine","Yalıtım özelliğine"],"a":0,"sol":["Kullanım geçmişi (binlerce yıl), işlenebilirlik, yalıtım ve karbon depolama parçada yer alır; maliyet karşılaştırması yoktur."],"kaz":"Parçadaki bilgileri tek tek denetler.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-011"},{"area":"soz","topic":"paragraf","sub":"Çıkarım","level":3,"q":"Kitap kulüpleri, okumayı bireysel bir etkinlik olmaktan çıkarıp paylaşılan bir deneyime dönüştürür. Katılımcılar aynı kitabı farklı açılardan okuduklarını fark ettikçe kendi yorumlarını sorgulamaya başlar. Ayrıca düzenli buluşmalar, okumayı erteleyenler için bir tür motivasyon kaynağı olur.<br>Bu parçadan aşağıdakilerden hangisi <b>çıkarılamaz</b>?","opts":["Kitap kulüpleri farklı bakış açılarıyla karşılaşma olanağı sunar.","Düzenli buluşmalar okumanın sürekliliğini destekler.","Okuma, paylaşıldığında farklı bir deneyime dönüşebilir.","Kitap kulüplerine katılanlar daha çok kitap satın alır.","Katılımcılar kendi yorumlarını yeniden değerlendirme fırsatı bulur."],"a":3,"sol":["Kitap satın alma alışkanlığına parçada hiç değinilmemiştir.","Diğer dört seçenek sırasıyla ikinci, üçüncü, ilk ve ikinci cümlelerden çıkarılabilir."],"kaz":"Metne dayanmayan yargıyı belirler.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-012"},{"area":"soz","topic":"paragraf","sub":"Ana düşünce","level":2,"q":"Bilim tarihindeki pek çok önemli buluş, başarısız sayılan deneylerin ardından gelmiştir. Beklenen sonucu vermeyen bir deney, araştırmacıyı sorunu farklı bir açıdan düşünmeye zorlar. Bu nedenle başarısızlık, bilimsel süreçte kaçınılması gereken bir durum değil, öğrenmenin doğal bir parçasıdır.<br>Bu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Bilim insanları deneylerinde çoğunlukla başarısız olur.","Başarısızlık, bilimsel ilerlemenin yapıcı bir öğesidir.","Bütün önemli buluşlar tesadüfen yapılmıştır.","Başarılı deneyler bilime katkı sağlamaz.","Deney sonuçları her zaman beklentilere uygun çıkar."],"a":1,"sol":["Son cümle 'bu nedenle' ile ana düşünceyi bağlar.","'Bütün' ve 'her zaman' içeren seçenekler parçayı aşan genellemelerdir."],"kaz":"Ana düşünceyi aşırı genellemelerden ayırır.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-013"},{"area":"soz","topic":"paragraf","sub":"Çıkarım","level":2,"q":"Yönetmenin son filmi, büyük bütçeli yapımların aksine yalnızca üç oyuncu ve tek bir mekânla çekilmiş. Film, diyaloglarının gücüyle izleyiciyi iki saat boyunca ekrana bağlıyor. Görsel efektlere hiç başvurulmaması ise hikâyenin ve oyunculuğun öne çıkmasını sağlıyor.<br>Bu parçada sözü edilen filmle ilgili aşağıdakilerden hangisi <b>söylenebilir</b>?","opts":["Yönetmen ilk kez bir film çekmiştir.","Filmde çok sayıda farklı mekân kullanılmıştır.","Film görsel efektleriyle öne çıkmaktadır.","Filmin etkisi teknik olanaklardan çok anlatım ve oyunculuktan kaynaklanır.","Film gişede beklenen ilgiyi görmemiştir."],"a":3,"sol":["Diyalogların gücü ve efektlerin bulunmaması, etkinin anlatım ve oyunculuktan geldiğini gösterir.","Mekân ve efekt seçenekleri parçayla çelişir; gişe ve ilk film bilgisi parçada yoktur."],"kaz":"Parçadaki bilgilerden geçerli bir yargıya ulaşır.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-014"},{"area":"soz","topic":"paragraf","sub":"Ana düşünce","level":2,"q":"Çocukların oyun oynaması çoğu zaman boşa geçen zaman olarak görülür. Oysa oyun, çocuğun sorun çözme, iş birliği yapma ve duygularını düzenleme becerilerini geliştirdiği en doğal öğrenme ortamıdır. Serbest oyuna yeterince zaman tanınmayan çocuklar bu becerileri kazanmakta güçlük çekebilir.<br>Bu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Oyun yalnızca eğlence amacı taşır.","İş birliği becerisi yetişkinlikte kazanılır.","Çocuklar okulda yeterince oyun oynamaktadır.","Oyun, çocuğun gelişiminde önemli bir öğrenme aracıdır.","Serbest oyun çocuklar için zararlıdır."],"a":3,"sol":["'Oysa' ile başlayan cümle yaygın görüşe karşı ana düşünceyi verir."],"kaz":"'Oysa' sonrasında gelen ana yargıyı yakalar.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-015"},{"area":"soz","topic":"paragraf","sub":"Yardımcı düşünce","level":3,"q":"Peri bacaları, volkanik kül ve lavların oluşturduğu tüf katmanlarının rüzgâr ve yağmur sularıyla aşınması sonucu oluşmuştur. Üst kısımlarındaki daha sert kaya, alttaki yumuşak tabakayı aşınmaya karşı korur ve bu kendine özgü şapkalı görünümü ortaya çıkarır. Bölge, sunduğu bu doğal manzara nedeniyle her yıl çok sayıda yerli ve yabancı turisti ağırlar.<br>Bu parçada peri bacalarıyla ilgili aşağıdakilerden hangisine <b>değinilmemiştir</b>?","opts":["Oluşumlarında etkili olan doğal etkenlere","Turizm açısından önemlerine","Hangi malzemeden oluştuklarına","Şapkalı görünümlerinin nedenine","Oluşumlarının ne kadar sürdüğüne"],"a":4,"sol":["Malzeme (tüf), etkenler (rüzgâr, yağmur), şapkanın nedeni (sert kaya) ve turizm parçada vardır.","Oluşum süresine ilişkin bir bilgi verilmemiştir."],"kaz":"Bilgi taraması yaparak eksik olanı belirler.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-016"},{"area":"soz","topic":"paragraf","sub":"Yazarın tutumu","level":3,"q":"Yapay zekâ araçlarının öğrencilerin ödevlerini yapmasından kaygı duyanlar haklıdır; ancak bu araçları yasaklamak sorunu çözmez. Hesap makinesinin icadı matematik eğitimini bitirmedi, yalnızca neyin öğretilmesi gerektiğini değiştirdi. Asıl yapılması gereken, ölçme yöntemlerini ezberlenmiş bilgiyi değil düşünme sürecini değerlendirecek biçimde yeniden tasarlamaktır.<br>Bu parçaya göre yazarın yapay zekâ araçlarına ilişkin görüşü aşağıdakilerden hangisidir?","opts":["Bu araçların okullarda kullanımı yasaklanmalıdır.","Bu araçlar eğitim için hiçbir risk taşımamaktadır.","Bu araçlar matematik eğitimini sona erdirecektir.","Bu araçlar yasaklanmak yerine eğitimin yeniden düzenlenmesiyle ele alınmalıdır.","Ödevler tümüyle kaldırılmalıdır."],"a":3,"sol":["Yazar kaygıyı haklı bulur ('haklıdır') ama yasağı çözüm saymaz; ölçme yöntemlerinin değişmesini önerir.","'Hiçbir risk' seçeneği yazarın kaygıyı haklı bulmasıyla çelişir."],"kaz":"Yazarın görüşünü karşı görüşlerden ayırır.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-017"},{"area":"soz","topic":"paragraf","sub":"Ana düşünce","level":2,"q":"Okur, bir şiiri okuduğunda şairin anlatmak istediğini birebir yakalamak zorunda değildir. Şiir, her okurun kendi deneyimleriyle yeniden anlam kazanan açık bir metindir. Bu nedenle aynı şiir farklı okurlarda, hatta aynı okurda farklı zamanlarda başka duygular uyandırabilir.<br>Bu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Şiir yalnızca bir kez okunmalıdır.","Şairler şiirlerini açıklamalıdır.","Okurlar şiiri anlamakta güçlük çeker.","Şiirin anlamı, okurun yorumuyla zenginleşir.","Şiirin tek ve doğru bir anlamı vardır."],"a":3,"sol":["Parça şiirin 'açık metin' olduğunu ve okura göre anlam kazandığını söyler."],"kaz":"Metnin temel yargısını belirler.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-018"},{"area":"soz","topic":"paragraf","sub":"Çıkarım","level":4,"q":"Bir mağaza zinciri, şubelerinde müzik çalmayı bıraktıktan sonra müşterilerin mağazada geçirdiği ortalama sürenin kısaldığını fark etti. Yeniden müzik çalınmaya başlandığında süre eski düzeyine döndü. Şirket yöneticileri, müziğin satışlar üzerindeki etkisini ölçmek için yeni bir araştırma başlattı.<br>Bu parçadan aşağıdakilerden hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Mağazada müzik çalınması ile müşterilerin mağazada kalma süresi arasında bir ilişki gözlenmiştir.","Mağaza zinciri bazı şubelerini kapatmıştır.","Mağazada müzik çalınması satışları kesinlikle artırır.","Müşteriler mağazada çalan müzikten rahatsız olmaktadır.","Şirket, araştırmanın sonucunu kamuoyuyla paylaşmıştır."],"a":0,"sol":["Parça yalnızca süre ile müzik arasında gözlenen birlikteliği bildirir.","Satış etkisi henüz araştırılmaktadır; bu yüzden 'kesinlikle artırır' çıkarılamaz."],"kaz":"Gözlem ile kanıtlanmış sonucu ayırt eder.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-019"},{"area":"soz","topic":"paragraf","sub":"Ana düşünce","level":2,"q":"Çok şey bilmek, bilge olmak için yeterli değildir. Bilgi, ancak ne zaman ve nasıl kullanılacağı bilindiğinde değer kazanır. Bilge kişi, bildiklerini yaşamın karmaşık durumlarında yerinde ve ölçülü biçimde uygulayabilen kişidir.<br>Bu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Çok okuyan herkes bilge olur.","Bilge kişiler az şey bilir.","Bilgi, bilgelikten daha değerlidir.","Bilgi zamanla değerini yitirir.","Bilgelik, bilgiyi yerinde ve ölçülü kullanabilme becerisidir."],"a":4,"sol":["Parça bilgi ile bilgeliği ayırır; bilgeliği bilginin yerinde kullanımı olarak tanımlar."],"kaz":"Tanıma dayalı ana düşünceyi belirler.","sure":50,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-020"},{"area":"soz","topic":"paragraf","sub":"Uzun metin analizi","level":2,"q":"Bu parçaya göre dijital platformlardaki bazı özellikler hangi amaçla tasarlanmaktadır?","opts":["Kullanıcıların platformda geçirdiği süreyi artırmak","Derin okuma alışkanlığını desteklemek","Kullanıcıların ekran süresini sınırlamak","Reklamları tümüyle ortadan kaldırmak","Kullanıcıların bilgiye daha hızlı ulaşmasını sağlamak"],"a":0,"sol":["İkinci cümle bu özelliklerin kullanıcının 'kendi isteğiyle durmasını zorlaştıracak biçimde' tasarlandığını söyler; amaç ekranda kalma süresini uzatmaktır."],"kaz":"Uzun metinden doğrudan bilgi bulur.","sure":50,"src":"Özgün – ALES Akademi","group":{"id":"pg-dikkat","info":"Günümüzde dijital platformların temel hedefi, kullanıcıların dikkatini olabildiğince uzun süre ekranda tutmaktır. Bu nedenle bildirimler, sonsuz kaydırma ve otomatik oynatma gibi özellikler, kullanıcının kendi isteğiyle durmasını zorlaştıracak biçimde tasarlanır. Uzmanlar bu duruma 'dikkat ekonomisi' adını veriyor: Dikkat sınırlı bir kaynaktır ve şirketler bu kaynağı reklam gelirine dönüştürmek için birbiriyle yarışır. Bunun bedelini ise çoğu zaman kullanıcılar öder; uzun süre kesintisiz odaklanma becerisi zayıflar, derin okuma yerini yüzeysel taramaya bırakır. Yine de çözüm teknolojiyi reddetmek değil, onu bilinçli kullanmayı öğrenmektir. Bildirimleri sınırlamak, belirli saatlerde ekrandan uzak durmak gibi küçük alışkanlıklar dikkatin denetimini yeniden kullanıcıya verebilir."},"id":"SOZ-PAR-021"},{"area":"soz","topic":"paragraf","sub":"Uzun metin analizi","level":3,"q":"Parçada sözü edilen 'dikkat ekonomisi' kavramıyla anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Ekonomi haberlerinin dijital ortamda daha çok okunması","Kullanıcıların dijital platformlara para ödemesi","Sınırlı bir kaynak olan insan dikkatinin gelir elde etmek için rekabet konusu hâline gelmesi","Reklam harcamalarının giderek azalması","İnsanların dikkatlerini tasarruflu kullanmayı öğrenmesi"],"a":2,"sol":["Kavram, iki nokta üst üsteden sonra açıklanır: dikkat sınırlıdır ve şirketler onu reklam gelirine dönüştürmek için yarışır."],"kaz":"Kavramı metindeki açıklamasından yola çıkarak yorumlar.","sure":60,"src":"Özgün – ALES Akademi","group":{"id":"pg-dikkat","info":"Günümüzde dijital platformların temel hedefi, kullanıcıların dikkatini olabildiğince uzun süre ekranda tutmaktır. Bu nedenle bildirimler, sonsuz kaydırma ve otomatik oynatma gibi özellikler, kullanıcının kendi isteğiyle durmasını zorlaştıracak biçimde tasarlanır. Uzmanlar bu duruma 'dikkat ekonomisi' adını veriyor: Dikkat sınırlı bir kaynaktır ve şirketler bu kaynağı reklam gelirine dönüştürmek için birbiriyle yarışır. Bunun bedelini ise çoğu zaman kullanıcılar öder; uzun süre kesintisiz odaklanma becerisi zayıflar, derin okuma yerini yüzeysel taramaya bırakır. Yine de çözüm teknolojiyi reddetmek değil, onu bilinçli kullanmayı öğrenmektir. Bildirimleri sınırlamak, belirli saatlerde ekrandan uzak durmak gibi küçük alışkanlıklar dikkatin denetimini yeniden kullanıcıya verebilir."},"id":"SOZ-PAR-022"},{"area":"soz","topic":"paragraf","sub":"Uzun metin analizi","level":3,"q":"Yazarın önerdiği çözümle ilgili aşağıdakilerden hangisi <b>söylenebilir</b>?","opts":["Dijital platformların yasaklanmasını savunmaktadır.","Teknolojinin kullanım biçimine yönelik bireysel düzenlemeleri öne çıkarmaktadır.","Kullanıcıların sorumluluğu olmadığını vurgulamaktadır.","Teknolojinin tümüyle bırakılmasını önermektedir.","Sorunun yalnızca şirketlerce çözülebileceğini düşünmektedir."],"a":1,"sol":["'Çözüm teknolojiyi reddetmek değil, onu bilinçli kullanmayı öğrenmektir' ve verilen örnekler (bildirim sınırlama, ekran molası) bireysel düzenlemelerdir."],"kaz":"Yazarın önerisini doğru biçimde nitelendirir.","sure":60,"src":"Özgün – ALES Akademi","group":{"id":"pg-dikkat","info":"Günümüzde dijital platformların temel hedefi, kullanıcıların dikkatini olabildiğince uzun süre ekranda tutmaktır. Bu nedenle bildirimler, sonsuz kaydırma ve otomatik oynatma gibi özellikler, kullanıcının kendi isteğiyle durmasını zorlaştıracak biçimde tasarlanır. Uzmanlar bu duruma 'dikkat ekonomisi' adını veriyor: Dikkat sınırlı bir kaynaktır ve şirketler bu kaynağı reklam gelirine dönüştürmek için birbiriyle yarışır. Bunun bedelini ise çoğu zaman kullanıcılar öder; uzun süre kesintisiz odaklanma becerisi zayıflar, derin okuma yerini yüzeysel taramaya bırakır. Yine de çözüm teknolojiyi reddetmek değil, onu bilinçli kullanmayı öğrenmektir. Bildirimleri sınırlamak, belirli saatlerde ekrandan uzak durmak gibi küçük alışkanlıklar dikkatin denetimini yeniden kullanıcıya verebilir."},"id":"SOZ-PAR-023"},{"area":"soz","topic":"paragraf","sub":"Uzun metin analizi","level":2,"q":"Yazara göre bir dil için asıl tehlike aşağıdakilerden hangisidir?","opts":["Ticaret ve göç yoluyla değişmek","Kendi sözcük türetme olanaklarını kullanmaktan vazgeçmek","Ses özelliklerinin zamanla değişmesi","Yabancı dil öğrenen sayısının artması","Başka dillerden sözcük almak"],"a":1,"sol":["Son cümle bunu doğrudan söyler: 'Asıl tehlike ödünç almak değil, … türetme olanaklarını kullanmaktan vazgeçmektir.'"],"kaz":"Yazarın vurguladığı yargıyı bulur.","sure":45,"src":"Özgün – ALES Akademi","group":{"id":"pg-odunc","info":"Diller tarih boyunca birbirleriyle etkileşerek değişir. Ticaret, göç ve kültürel alışveriş, bir dilden ötekine sözcük geçişini kaçınılmaz kılar. Türkçe de yüzyıllar içinde Arapça, Farsça, Fransızca ve İngilizce gibi dillerden çok sayıda sözcük almıştır. Bu durum kimi zaman dilin bozulduğu kaygısına yol açsa da ödünç sözcüklerin önemli bir kısmı, zamanla Türkçenin ses ve yapı özelliklerine uyarak dilin doğal bir parçası hâline gelmiştir. Asıl tehlike ödünç almak değil, dilin kendi türetme olanaklarını kullanmaktan vazgeçmektir."},"id":"SOZ-PAR-024"},{"area":"soz","topic":"paragraf","sub":"Uzun metin analizi","level":3,"q":"Bu parçadan aşağıdakilerden hangisi <b>çıkarılabilir</b>?","opts":["Ödünç sözcükler zamanla alıcı dilin kurallarına uyum sağlayabilir.","Diller etkileşim olmadan da hızla değişir.","Türkçe yalnızca Arapçadan sözcük almıştır.","Türkçe başka dillere hiç sözcük vermemiştir.","Ödünç sözcük kullanımı yasaklanmalıdır."],"a":0,"sol":["Dördüncü cümle, ödünç sözcüklerin Türkçenin ses ve yapı özelliklerine uyduğunu belirtir.","'Yalnızca Arapça' parçayla çelişir; diğerleri parçada yer almaz."],"kaz":"Uzun metinden doğrulanabilir çıkarım yapar.","sure":60,"src":"Özgün – ALES Akademi","group":{"id":"pg-odunc","info":"Diller tarih boyunca birbirleriyle etkileşerek değişir. Ticaret, göç ve kültürel alışveriş, bir dilden ötekine sözcük geçişini kaçınılmaz kılar. Türkçe de yüzyıllar içinde Arapça, Farsça, Fransızca ve İngilizce gibi dillerden çok sayıda sözcük almıştır. Bu durum kimi zaman dilin bozulduğu kaygısına yol açsa da ödünç sözcüklerin önemli bir kısmı, zamanla Türkçenin ses ve yapı özelliklerine uyarak dilin doğal bir parçası hâline gelmiştir. Asıl tehlike ödünç almak değil, dilin kendi türetme olanaklarını kullanmaktan vazgeçmektir."},"id":"SOZ-PAR-025"},{"area":"soz","topic":"paragraf","sub":"Ana düşünce","level":3,"q":"Bilimsel bir buluşun değeri çoğu zaman ortaya çıktığı anda anlaşılmaz. Kimi buluşlar yıllarca kullanım alanı bulunamadan bekler; sonra bambaşka bir alandaki gelişme onları birdenbire vazgeçilmez kılar. Bu nedenle 'Ne işe yarayacak?' sorusuyla temel araştırmaları değerlendirmek, geleceğin olanaklarını bugünden kısıtlamak anlamına gelebilir.<br>Bu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","opts":["Uygulamalı araştırmalara kaynak ayrılmamalıdır.","Bilimsel buluşların çoğu hiçbir işe yaramaz.","Bilim insanları buluşlarının değerini bilmez.","Buluşlar yalnızca ortaya çıktıkları alanda kullanılır.","Temel araştırmalar yalnızca hemen sağlayacakları yarara göre değerlendirilmemelidir."],"a":4,"sol":["Son cümle 'Bu nedenle' ile yazarın asıl görüşünü verir: Anlık yarar ölçütü temel araştırmaları değerlendirmek için yetersizdir.","Diğer seçenekler parçayı aşan ya da parçayla çelişen genellemelerdir."],"kaz":"Sonuç cümlesindeki ana yargıyı belirler.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-026"},{"area":"soz","topic":"paragraf","sub":"Çıkarım","level":4,"q":"Bir araştırmada, öğle arasında yirmi dakikalık kısa bir şekerleme yapan çalışanların öğleden sonraki dikkat testlerinde daha başarılı olduğu görüldü. Ancak şekerlemesi bir saati aşanlarda uyandıktan sonra kısa süreli bir sersemlik gözlendi. Araştırmacılar, şekerlemenin süresinin en az kendisi kadar önemli olduğunu vurguluyor.<br>Bu parçadan aşağıdakilerden hangisi <b>çıkarılamaz</b>?","opts":["Uzun bir şekerlemeden sonra geçici sersemlik yaşanabilir.","Kısa şekerleme, öğleden sonraki dikkat performansıyla olumlu ilişkilidir.","Araştırma çalışanlar üzerinde yapılmıştır.","Şekerlemenin süresi sonuçlarını etkileyebilir.","Uzun şekerleme yapanların gece uykusu bozulur."],"a":4,"sol":["Parça yalnızca uyanıştan sonraki kısa süreli sersemlikten söz eder; gece uykusuna ilişkin bir bilgi yoktur.","Diğer dört yargı parçadaki bulgulardan doğrudan çıkarılabilir."],"kaz":"Metne dayanmayan yargıyı ayırt eder.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-027"},{"area":"soz","topic":"paragraf","sub":"Yazarın tutumu","level":3,"q":"Her yeni teknolojinin ardından 'Gençler artık okumuyor.' yakınması yükselir. Oysa yayın ve kütüphane verileri, gençlerin önemli bir kısmının okumayı sürdürdüğünü gösteriyor; değişen, okunan metinlerin türü ve okuma ortamı. Bu dönüşümü bir çöküş olarak görmek yerine anlamaya çalışmak, eğitimcilere daha çok şey kazandıracaktır.<br>Bu parçada yazarın tutumu aşağıdakilerden hangisidir?","opts":["Gençlerin okuma alışkanlığına ilişkin karamsar genellemelere karşı çıkmakta, değişimi anlamaya çağırmaktadır.","Kütüphanelerin gereksizleştiğini ileri sürmektedir.","Gençlerin artık hiç okumadığını kabul etmektedir.","Ekrandan okumanın kitap okumaktan üstün olduğunu savunmaktadır.","Eğitimcileri okuma alışkanlığının yok olmasından sorumlu tutmaktadır."],"a":0,"sol":["'Oysa' sonrası yazarın görüşüdür: Okuma sürüyor, biçimi değişiyor.","Yazar iki ortamı karşılaştırıp birini üstün saymaz; bu yüzden ikinci yanlış seçenek parçayı aşar."],"kaz":"Yazarın karşı çıktığı görüşü ve önerisini belirler.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-028"},{"area":"soz","topic":"paragraf","sub":"Başlık","level":2,"q":"Son yıllarda pek çok kentte apartman çatıları ve boş arsalar, mahalle sakinlerinin birlikte işlediği bahçelere dönüşüyor. Bu bahçeler taze sebze sağlamanın yanında, birbirini tanımayan komşuları ortak bir uğraşta buluşturuyor. Çocuklar da toprağa dokunarak besinin nereden geldiğini öğreniyor.<br>Bu parçaya en uygun başlık aşağıdakilerden hangisidir?","opts":["Apartman Yönetiminde Sorunlar","Organik Gübre Nasıl Yapılır?","Kent Bahçeleri: Sebzeden Fazlası","Çatı Yalıtımının Önemi","Kırsaldan Kente Göç"],"a":2,"sol":["Parça kent bahçelerinin besin üretimi dışındaki toplumsal ve eğitsel yararlarını anlatır; başlık hem konuyu hem bu vurguyu kapsamalıdır."],"kaz":"Konuyu ve vurguyu kapsayan başlığı seçer.","sure":50,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-029"},{"area":"soz","topic":"paragraf","sub":"Yardımcı düşünce","level":2,"q":"Kâğıt üretiminde geri dönüştürülmüş lif kullanmak hem ağaç kesimini hem de su ve enerji tüketimini azaltır. Ancak lifler her geri dönüşümde kısalır ve kâğıt ancak sınırlı sayıda geri dönüştürülebilir. Bu nedenle sistemin sürmesi için belirli oranda yeni lif eklemek gerekir.<br>Bu parçada aşağıdakilerden hangisine <b>değinilmemiştir</b>?","opts":["Liflerin geri dönüşümle değiştiğine","Geri dönüşüm tesislerinin sayısına","Geri dönüşümün çevresel yararlarına","Üretimde yeni life duyulan ihtiyaca","Kâğıdın sınırsız biçimde geri dönüştürülemeyeceğine"],"a":1,"sol":["Çevresel yararlar, sınırlı dönüşüm, liflerin kısalması ve yeni lif gereği parçada vardır; tesis sayısına değinilmemiştir."],"kaz":"Parçadaki bilgileri tek tek denetler.","sure":50,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-030"},{"area":"soz","topic":"paragraf","sub":"Ana düşünce","level":4,"q":"Bir çevirmenin görünmez olması uzun süre iyi çevirinin ölçütü sayıldı: Okur, metnin bir çeviri olduğunu fark etmemeliydi. Ne var ki bu yaklaşım, kaynak kültürün tuhaf ve yabancı gelen öğelerini hedef dilin alışkanlıklarına uydurarak silikleştirme tehlikesi taşır. Bazı çevirmenler bu yüzden okurun yabancılığı hissetmesine bilinçli olarak izin vermenin, metne daha sadık kalmak anlamına geldiğini savunur.<br>Bu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","opts":["İyi bir çeviri her zaman zor okunur.","Yabancı kültür öğeleri çeviriden çıkarılmalıdır.","Çeviride akıcılık uğruna kaynak kültürün farklılıklarının silinmesi sorgulanmaktadır.","Çeviriler okuru kaynak dili öğrenmeye yöneltir.","Çevirmenler kendilerini okurdan tümüyle gizlemelidir."],"a":2,"sol":["'Ne var ki' ile geleneksel ölçüt eleştirilir: Akıcılık, kaynak kültürü silikleştirebilir.","İlk iki yanlış seçenek eleştirilen görüşün kendisidir; 'her zaman zor okunur' parçayı aşan bir genellemedir."],"kaz":"Eleştirilen görüş ile yazarın vurguladığı düşünceyi ayırt eder.","sure":90,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-031"},{"area":"soz","topic":"paragraf","sub":"Çıkarım","level":3,"q":"Kutup bölgelerindeki buzullarda açılan sondaj kuyularından çıkarılan buz örnekleri, içlerinde hapsolmuş küçük hava kabarcıkları barındırır. Bu kabarcıklar, buzun oluştuğu dönemdeki atmosferin bileşimini korur. Araştırmacılar farklı derinliklerden alınan örnekleri karşılaştırarak geçmiş dönemlerin iklimine ilişkin bilgi edinebilmektedir.<br>Bu parçadan aşağıdakilerden hangisi <b>çıkarılabilir</b>?","opts":["Buz örnekleri gelecekteki iklimi kesin olarak gösterir.","Hava kabarcıkları buzun erimesine yol açar.","Buzulun farklı derinliklerdeki katmanları farklı dönemlere ait bilgiler taşır.","Buzul araştırmaları yalnızca kutup bölgelerinde yapılabilir.","Geçmişte atmosferin bileşimi hiç değişmemiştir."],"a":2,"sol":["Derinlikler karşılaştırılarak 'geçmiş dönemler' hakkında bilgi edinilmesi, katmanların farklı dönemleri temsil ettiğini gösterir.","'Hiç değişmemiştir' karşılaştırmanın amacıyla çelişir; diğer seçenekler parçada yer almaz ya da onu aşar."],"kaz":"Metindeki yöntemden örtük bilgiyi çıkarır.","sure":75,"src":"Özgün – ALES Akademi","id":"SOZ-PAR-032"}]};

<script>
/* ---- lessons.js ---- */
/* ALES Akademi — müfredat ve konu anlatımları.
