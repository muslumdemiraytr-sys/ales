<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ALES Akademi — ÖSYM'nin güncel ALES yapısını esas alan, özgün sorulu dijital ALES hazırlık platformu.">
<meta name="theme-color" content="#3550d9">
<title>ALES Akademi</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#f0f2f8; --surface-3:#e6e9f2;
  --border:#e2e5ee; --text:#151a2d; --text-2:#4a5068; --muted:#7a8098;
  --accent:#3550d9; --accent-2:#5b73ff; --accent-soft:#e8ecff; --accent-ink:#ffffff;
  --good:#12805c; --good-soft:#e3f5ee; --bad:#c9353a; --bad-soft:#fbe9ea; --warn:#a86400; --warn-soft:#fdf1dc;
  --series-1:#2a78d6; --series-2:#eb6834; --grid:#e7e9f0;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95;
  --shadow:0 1px 2px rgba(20,26,45,.05),0 8px 24px rgba(20,26,45,.06);
  --radius:14px; --radius-sm:10px;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e111a; --surface:#161a26; --surface-2:#1c2130; --surface-3:#262c3e;
    --border:#2a3043; --text:#eef0f7; --text-2:#b9bed0; --muted:#8a90a6;
    --accent:#7b8dff; --accent-2:#98a6ff; --accent-soft:#232a4a; --accent-ink:#0e111a;
    --good:#3dc495; --good-soft:#143428; --bad:#f06b70; --bad-soft:#3a1c20; --warn:#f0b250; --warn-soft:#3a2c14;
    --series-1:#3987e5; --series-2:#d95926; --grid:#262c3e;
    --seq-1:#1d2a44; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e111a; --surface:#161a26; --surface-2:#1c2130; --surface-3:#262c3e;
  --border:#2a3043; --text:#eef0f7; --text-2:#b9bed0; --muted:#8a90a6;
  --accent:#7b8dff; --accent-2:#98a6ff; --accent-soft:#232a4a; --accent-ink:#0e111a;
  --good:#3dc495; --good-soft:#143428; --bad:#f06b70; --bad-soft:#3a1c20; --warn:#f0b250; --warn-soft:#3a2c14;
  --series-1:#3987e5; --series-2:#d95926; --grid:#262c3e;
  --seq-1:#1d2a44; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:1.65rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0 0 .8em}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px 24px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7a4dff);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand b{display:block;font-size:1.02rem}
.brand span{font-size:.75rem;color:var(--muted)}
.nav-sec{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--text-2);font-weight:500;font-size:.92rem}
.nav a:hover{background:var(--surface-2);text-decoration:none;color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;background:var(--surface-3);color:var(--text-2);border-radius:20px;padding:0 7px;font-size:.72rem;font-weight:600}
.side-foot{margin-top:auto;padding:12px 8px 0;display:flex;gap:8px;align-items:center}
.main{min-width:0;padding:28px 32px 64px}
.wrap{max-width:1120px;margin:0 auto}
.topbar{display:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{color:var(--text-2);margin:0}
.crumb{font-size:.8rem;color:var(--muted);margin-bottom:4px}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 15px;border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer;transition:transform .08s ease,background .15s ease,border-color .15s ease;white-space:nowrap}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.icon{padding:8px}
.btn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-size:.76rem;font-weight:600;border:1px solid var(--border)}
.chip.say{background:color-mix(in srgb,var(--series-1) 14%,transparent);color:var(--series-1);border-color:transparent}
.chip.soz{background:color-mix(in srgb,var(--series-2) 14%,transparent);color:var(--series-2);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.orig{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.lvl{display:inline-flex;gap:2px;vertical-align:middle}
.lvl i{width:6px;height:10px;border-radius:2px;background:var(--surface-3)}
.lvl i.f{background:var(--accent)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 11px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:600;color:var(--text-2)}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 10px 10px 0;font-size:.9rem;color:var(--text)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.good{border-color:var(--good);background:var(--good-soft)}
.progress{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:1.65rem;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .s{font-size:.8rem;color:var(--text-2)}
.hero{background:linear-gradient(120deg,var(--accent),#6a4dff);color:#fff;border:0;position:relative;overflow:hidden}
.hero h1,.hero p{color:#fff}
.hero p{opacity:.9}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.hero .btn.primary{background:#fff;color:#2a2f6e;border-color:#fff}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.list{display:flex;flex-direction:column}
.list>.it{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border)}
.list>.it:last-child{border-bottom:0}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:4px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-weight:600;font-size:.86rem;color:var(--text-2);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

/* ---------- lesson ---------- */
.topic-card{display:flex;flex-direction:column;gap:10px;transition:transform .15s ease,border-color .15s ease;cursor:pointer;color:inherit}
.topic-card:hover{transform:translateY(-2px);border-color:var(--accent);text-decoration:none}
.lesson-nav{position:sticky;top:20px;align-self:start}
.lesson-nav a{display:block;padding:5px 10px;border-radius:8px;color:var(--text-2);font-size:.86rem}
.lesson-nav a:hover{background:var(--surface-2);text-decoration:none}
.lesson-sec{scroll-margin-top:20px}
.lesson-sec h2{display:flex;gap:10px;align-items:center}
.lesson-sec h2 .num{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.85rem;flex:none}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:.9rem}
.example{border:1px dashed var(--border);border-radius:12px;padding:14px}
.example ol{margin:.4em 0 .4em 1.2em;padding:0}
ul.clean{margin:0;padding-left:1.15em} ul.clean li{margin:.25em 0}

/* ---------- question ---------- */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.qcard .qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.qtext{font-size:1.02rem;line-height:1.65}
.qinfo{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:.95rem}
.qinfo ul{margin:.4em 0;padding-left:1.2em}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;background:var(--surface);cursor:pointer;transition:border-color .12s ease,background .12s ease;width:100%}
.opt:hover{border-color:var(--accent-2)}
.opt .k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;flex:none;font-size:.85rem}
.opt .ot{padding-top:3px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.sol{margin-top:16px;border-radius:12px;background:var(--surface-2);padding:14px 16px;border:1px solid var(--border)}
.sol ol{margin:.3em 0 0 1.2em;padding:0}
.sol li{margin:.3em 0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.88em;line-height:1.05;margin:0 2px}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.ov{text-decoration:overline}
.seq{font-family:ui-monospace,Menlo,monospace;font-size:1.1rem;letter-spacing:.04em}
table.qt{border-collapse:collapse;margin:10px 0;font-size:.9rem;background:var(--surface)}
table.qt th,table.qt td{border:1px solid var(--border);padding:6px 10px;text-align:center}
table.qt th{background:var(--surface-3)}
.chartwrap{max-width:380px}
svg.qchart{width:100%;height:auto}
svg.qchart .bar{fill:var(--series-1)}
svg.qchart .bv{font-size:11px;fill:var(--text);text-anchor:middle;font-weight:600}
svg.qchart .bl{font-size:11px;fill:var(--text-2);text-anchor:middle}
svg.qchart .ax{stroke:var(--muted);stroke-width:1}
.qside .card{padding:16px}
.qtimer{font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- exam ---------- */
.exam-bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);margin:-28px -32px 20px;padding:12px 32px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.clock{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.navgrid button{aspect-ratio:1;border:1px solid var(--border);background:var(--surface);border-radius:6px;font-size:.7rem;font-weight:600;cursor:pointer;padding:0;color:var(--text-2);position:relative}
.navgrid button.ans{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.navgrid button.cur{outline:2px solid var(--text);outline-offset:1px}
.navgrid button.mk:after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.navgrid button.ok{background:var(--good);border-color:var(--good);color:#fff}
.navgrid button.no{background:var(--bad);border-color:var(--bad);color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--border)}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
.chart .grid line{stroke:var(--grid);stroke-width:1}
.chart .s1{stroke:var(--series-1);fill:var(--series-1)}
.chart .s2{stroke:var(--series-2);fill:var(--series-2)}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .hit{fill:transparent;cursor:pointer}
.chart .dl{fill:var(--text-2);font-weight:600}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--text);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:.8rem;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;max-width:240px}
.tip.on{opacity:1}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.heat .cell{border-radius:10px;padding:10px 12px;font-size:.82rem;color:var(--text);background:var(--surface-2);border:1px solid var(--border)}
.heat .cell b{display:block;font-size:1.1rem}
.heat .cell.dark{color:#fff;border-color:transparent}
.streak{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.streak i{aspect-ratio:1;border-radius:3px;background:var(--surface-3)}

/* ---------- logic workshop ---------- */
.lgrid{border-collapse:separate;border-spacing:4px;font-size:.85rem}
.lgrid th{font-weight:600;color:var(--text-2);padding:2px 6px;font-size:.78rem}
.lgrid td button{width:44px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:800;font-size:1rem}
.lgrid td button.y{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.lgrid td button.n{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.shape-opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.shape-opts button{border:1.5px solid var(--border);border-radius:12px;background:var(--surface);padding:6px;cursor:pointer}
.shape-opts button.ok{border-color:var(--good);background:var(--good-soft)}
.shape-opts button.no{border-color:var(--bad);background:var(--bad-soft)}
.shape-seq{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shape-seq svg,.shape-opts svg{width:64px;height:64px}
.shape-seq .q{width:64px;height:64px;border:2px dashed var(--border);border-radius:12px;display:grid;place-items:center;font-size:1.5rem;color:var(--muted)}
.fig{fill:var(--series-1);stroke:var(--text);stroke-width:1.5}
.fig.o{fill:transparent}
.fig.h{fill:url(#hatch)}

/* ---------- task ---------- */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--border);border-radius:10px;padding:8px;font-size:.75rem;background:var(--surface);min-height:84px;cursor:pointer}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.past{opacity:.6}
.day b{display:block;font-size:.8rem}
.day .ph{font-size:.68rem;color:var(--muted)}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,20,.5);display:grid;place-items:center;z-index:200;padding:16px;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:16px;padding:22px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--border)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;font-weight:600;opacity:0;transition:all .2s ease;z-index:300;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeup .25s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width: 1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .qwrap{grid-template-columns:1fr} }
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:282px;z-index:150;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .side.open{transform:none}

 −1 ile çarpılıp sıralama ters çevrilir): (−13, 14).","Açık aralıktaki tam sayılar −12, …, 13 ⇒ <b>26</b> tane."],"kaz":"Eşitsizlikleri taraf tarafa işleme sokar.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-ESI-001"},{"area":"say","topic":"esitsizlik","sub":"Mutlak değer","level":2,"q":"|x − 4| ≤ 11<br>eşitsizliğini sağlayan x tam sayılarının toplamı kaçtır?","opts":["87","90","91","92","93"],"a":3,"sol":["−11 ≤ x − 4 ≤ 11 ⇒ −7 ≤ x ≤ 15.","Tam sayı çözümler: −7, …, 15.","İstenen: <b>92</b>."],"kaz":"Mutlak değerli eşitsizliği çift taraflı eşitsizliğe çevirir.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-ESI-002"},{"area":"say","topic":"esitsizlik","sub":"Sıralama ve eşitsizlik","level":3,"q":"a, b ve c gerçel sayıları için a &lt; b &lt; 0 &lt; c olduğuna göre aşağıdakilerden hangisi <b>kesinlikle doğrudur</b>?","opts":["a + c &lt; b","a − b &gt; 0","a·b·c &lt; 0","b·c &gt; a","⟦1/a⟧ &gt; ⟦1/b⟧"],"a":4,"sol":["Sıralamadan işaretler ve büyüklükler belirlenir (a &lt; b &lt; 0 &lt; c).","<b>⟦1/a⟧ &gt; ⟦1/b⟧</b> ifadesi verilen sıralamadaki her değer için sağlanır.","Diğer seçenekler için koşulu sağlayan karşı örnekler bulunabilir (örneğin kesirli ya da mutlak değerce farklı değerler)."],"kaz":"Eşitsizliklerde çarpma/bölme işaret kurallarını uygular.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-ESI-003"},{"area":"say","topic":"esitsizlik","sub":"Eşitsizlikler","level":3,"q":"x ve y tam sayılar olmak üzere 3 ≤ x ≤ 4 ve −2 ≤ y ≤ −1 olduğuna göre x² + y² ifadesinin alabileceği en küçük değer kaçtır?","opts":["5","6","7","10","12"],"a":3,"sol":["Kare alan ifadelerde mutlak değerce en büyük/en küçük değer, çarpımda ise işaret dikkate alınır.","En küçük değer x = 3, y = −1 için elde edilir: <b>10</b>."],"kaz":"Tam sayı aralıklarında ifadenin uç değerini bulur.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-ESI-004"},{"area":"say","topic":"esitsizlik","sub":"Eşitsizlikler","level":3,"q":"x ve y gerçel sayılar olmak üzere<br>−2 &lt; x &lt; 0 &nbsp; ve &nbsp; − ":"Özgün – ALES Akademi","id":"SAY-PRB-004"},{"area":"say","topic":"problem","sub":"Kâr-zarar ve yüzde","level":3,"q":"Bir dikdörtgenin uzun kenarı %40 artırılır, kısa kenarı %25 azaltılırsa alanı yüzde kaç değişir?","opts":["Değişmez","%15 artar","%5 azalır","%5 artar","%10 artar"],"a":3,"sol":["Kenarlar 10 ve 10 birim düşünülür (alan 100).","Yeni alan: 14·7.5 = 105.","Alan %5 artar."],"kaz":"Yüzde değişimlerin çarpımsal etkisini hesaplar.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-PRB-005"},{"area":"say","topic":"problem","sub":"Karışım problemleri","level":3,"q":"Şeker oranı %20 olan 200 gram şekerli suya kaç gram saf su eklenirse şeker oranı %10 olur?","opts":["100","175","200","275","300"],"a":2,"sol":["Şeker miktarı değişmez: 200·⟦20/100⟧ = 40 g.","40 ÷ (200 + x) = ⟦10/100⟧ ⇒ x = <b>200</b>."],"kaz":"Seyreltmede çözünen miktarının sabitliğini kullanır.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-PRB-006"},{"area":"say","topic":"problem","sub":"Faiz problemleri","level":2,"q":"40000 TL, yıllık %18 basit faiz oranıyla 6 aylığına bankaya yatırılıyor.<br>Süre sonunda elde edilen faiz kaç TL'dir?","opts":["1100","1600","2600","3600","7200"],"a":3,"sol":["Basit faiz: F = A·r·t / 1200 (t ay).","F = 40000·18·6 / 1200 = 3600 TL.","Faiz: <b>3600</b> TL."],"kaz":"Basit faiz formülünü ay cinsinden uygular.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-PRB-007"},{"area":"say","topic":"problem","sub":"Sayı problemleri","level":2,"q":"Üç sayıdan ikincisi birincisinden 3 fazla, üçüncüsü birincisinin 2 katıdır. Bu üç sayının toplamı 63 olduğuna göre en büyük sayı kaçtır?","opts":["30","31","32","35","36"],"a":0,"sol":["Birinci sayı x: x + (x + 3) + 2x = 63.","4x = 60 ⇒ x = 15.","Sayılar 15, 18, 30; en büyüğü <b>30</b>."],"kaz":"Sözel ifadeyi denkleme çevirir.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-PRB-008"},{"area":"say","topic":"problem","sub":"Yaş problemleri","level":2,"q":"Bir annenin bugünkü yaşı kızının bugünkü yaşının 4 katıdır. 12 yıl sonra AY-PRB-012"},{"area":"say","topic":"problem","sub":"Karışım problemleri","level":3,"q":"Tuz oranı %20 olan 400 gram tuzlu su ile tuz oranı %15 olan 600 gram tuzlu su karıştırılıyor.<br>Elde edilen karışımın tuz oranı yüzde kaçtır?","opts":["%11","%13","%15","%16","%17"],"a":4,"sol":["Tuz miktarları: 400·⟦20/100⟧ = 80 g ve 600·⟦15/100⟧ = 90 g.","Oran: (80 + 90) ÷ 1000 = %<b>17</b>."],"kaz":"Karışımda madde miktarını korur.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-PRB-013"},{"area":"say","topic":"problem","sub":"Faiz problemleri","level":2,"q":"40000 TL, yıllık %24 basit faiz oranıyla 10 aylığına bankaya yatırılıyor.<br>Süre sonunda elde edilen faiz kaç TL'dir?","opts":["4000","5000","7000","8000","16000"],"a":3,"sol":["Basit faiz: F = A·r·t / 1200 (t ay).","F = 40000·24·10 / 1200 = 8000 TL.","Faiz: <b>8000</b> TL."],"kaz":"Basit faiz formülünü ay cinsinden uygular.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-PRB-014"},{"area":"say","topic":"problem","sub":"Sayı problemleri","level":2,"q":"Bir tiyatroda öğrenci bileti 60 TL, tam bilet 90 TL'dir. Bir gösteri için satılan 39 biletten toplam 2970 TL gelir elde edilmiştir.<br>Kaç öğrenci bileti satılmıştır?","opts":["17","18","20","21","22"],"a":1,"sol":["Hepsi tam bilet olsaydı gelir 3510 TL olurdu.","Fark: 3510 − 2970 = 540; her öğrenci bileti farkı 30 TL azaltır.","Öğrenci bileti: 540 ÷ 30 = <b>18</b>."],"kaz":"Varsayım yöntemiyle hızlı çözüm üretir.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-PRB-015"},{"area":"say","topic":"problem","sub":"Yaş problemleri","level":2,"q":"Bir dedenin bugünkü yaşı torununun bugünkü yaşının 5 katıdır. 3 yıl sonra dedenin yaşı torununun yaşının 4 katı olacaktır.<br>Buna göre dedenin bugünkü yaşı kaçtır?","opts":["45","47","49","51","55"],"a":0,"sol":["Çocuğun yaşı x ise yetişkinin yaşı 5x olur.","3 yıl sonra: 5x + 3 = 4(x + 3) ⇒ 1x = 9 ⇒ x = 9.","Yetişkinin bugünkü yaşı: 5·9 = <b>45</b>."],"kaz":"Yaş farkının sabitliğini kullanarak denklem kurar.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-PRB-016"},{"area":"say","topic":"problem","sub":"Yaş problemleri","level":3,"q":"3 çocuklu bir ailede babanın yaşı annenin yaşından 5 fazladır. Anne, baba ve çocukların bugünkü yaşları toplamı 114'tür; 8 yıl sonra çocukların yaşları toplamı 47 olacaktır.<br>Buna göre annenin bugünkü yaşı kaçtır?","opts":["43","44","47","48","50"],"a":0,"sol":["Çocukların bugünkü yaş toplamı: 47 − 3·8 = 23.","Anne + baba = 114 − 23 = 91.","Anne x ise 2x + 5 = 91 ⇒ x = <b>43</b>."],"kaz":"Birden çok kişinin yaş toplamlarını zamanla ilişkilendirir.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-PRB-017"},{"area":"say","topic":"problem","sub":"İşçi ve havuz problemleri","level":2,"q":"Bir işi A tek başına 15 günde, B tek başına 30 günde bitirebilmektedir.<br>İkisi birlikte bu işi kaç günde bitirir?","opts":["10","12","14","16","⟦45/2⟧"],"a":0,"sol":["Bir günde yapılan işler: A ⟦1/15⟧, B ⟦1/30⟧.","Birlikte: ⟦1/15⟧ + ⟦1/30⟧ = ⟦1/10⟧.","Süre: <b>10</b> gün."],"kaz":"İş hızlarını toplayarak ortak süreyi bulur.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-PRB-018"},{"area":"say","topic":"problem","sub":"Hareket problemleri","level":2,"q":"Aralarında 300 km bulunan A ve B kentlerinden iki araç aynı anda birbirine doğru hareket ediyor. A'dan çıkan aracın hızı saatte 40 km, B'den çıkanınki saatte 60 km'dir.<br>Araçlar A'dan kaç km uzakta karşılaşır?","opts":["100","120","130","140","160"],"a":1,"sol":["Yaklaşma hızı: 40 + 60 = 100 km/sa.","Karşılaşma süresi: 300 ÷ 100 = 3 saat.","A'dan uzaklık: 40·3 = <b>120</b> km."],"kaz":"Karşılıklı harekette hızları toplar.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-PRB-019"},{"area":"say","topic":"problem","sub":"Kâr-zarar ve yüzde","level":3,"q":"Bir dikdörtgenin uzun kenarı %20 artırılır, kısa kenarı %25 azaltılırsa alanı yüzde kaç değişir?","opts":["%15 azalır","%10 azalır","%5 azalır","%10 artar","%20 azalır"],"a":1,"sol":["Kenarlar 10 ve 10 birim düşünülür (alan 100).","Yeni alan: 12·7.5 = 90.","Alan %10 azalır."],"kaz":"Yüzde değişimlerin çarpımsal etkisini hesaplar.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-PRB-020"},{"area":"say","topic":"problem","sub":"Karışım problemleri","level":3,"q":"Tuz oranı %30 olan 200 gram tuzlu su ile tuz oranı %50 olan 200 gram tuzlu su karıştırılıyor.<br>Elde edilen karışımın tuz oranı yüzde kaçtır?","opts":["%37","%38","%39","%40","%43"],"a":3,"sol":["Tuz miktarları: 200·⟦30/100⟧ = 60 g ve 200·⟦50/100⟧ = 100 g.","Oran: (60 + 100) ÷ 400 = %<b>40</b>."],"kaz":"Karışımda madde miktarını korur.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-PRB-021"},{"area":"say","topic":"problem","sub":"Faiz problemleri","level":2,"q":"50000 TL, yıllık %40 basit faiz oranıyla 6 aylığına bankaya yatırılıyor.<br>Süre sonunda hesapta toplam kaç TL olur?","opts":["59200","59400","60000","60800","70000"],"a":2,"sol":["Basit faiz: F = A·r·t / 1200 (t ay).","F = 50000·40·6 / 1200 = 10000 TL.","Toplam: 50000 + 10000 = <b>60000</b> TL."],"kaz":"Basit faiz formülünü ay cinsinden uygular.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-PRB-022"},{"area":"say","topic":"problem","sub":"Sayı problemleri","level":2,"q":"Üç sayıdan ikincisi birincisinden 7 fazla, üçüncüsü birincisinin 2 katıdır. Bu üç sayının toplamı 79 olduğuna göre en büyük sayı kaçtır?","opts":["18","25","31","36","37"],"a":3,"sol":["Birinci sayı x: x + (x + 7) + 2x = 79.","4x = 72 ⇒ x = 18.","Sayılar 18, 25, 36; en büyüğü <b>36</b>."],"kaz":"Sözel ifadeyi denkleme çevirir.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-PRB-023"},{"area":"say","topic":"problem","sub":"Yaş problemleri","level":2,"q":"Bir dedenin bugünkü yaşı torununun bugünkü yaşının 5 katıdır. 5 yıl sonra dedenin yaşı torununun yaşının 3 katı olacaktır.<br>Buna göre dedenin bugünkü yaşı kaçtır?","opts":["21","23","25","27","31"],"a":2,"sol":["Çocuğun yaşı x ise yetişkinin yaşı 5x olur.","5 yıl sonra: 5x + 5 = 3(x + 5) ⇒ 2x = 10 ⇒ x = 5.","Yetişkinin bugünkü yaşı: 5·5 = <b>25</b>."],"kaz":"Yaş farkının sabitliğini kullanarak denklem kurar.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-PRB-024"},{"area":"say","topic":"problem","sub":"Yaş problemleri","level":3,"q":"2 çocuklu bir ailede babanın yaşı annenin yaşından 1 fazladır. Anne, baba ve çocukların bugünkü yaşları toplamı 97'dir; 2 yıl sonra çocukların yaşları toplamı 18 olacaktır.<br>Buna göre annenin bugünkü yaşı kaçtır?","opts":["36","38","39","41","42"],"a":3,"sol":["Çocukların bugünkü yaş toplamı: 18 − 2·2 = 14.","Anne + baba = 97 − 14 = 83.","Anne x ise 2x + 1 = 83 ⇒ x = <b>41</b>."],"kaz":"Birden çok kişinin yaş toplamlarını zamanla ilişkilendirir.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-PRB-025"},{"area":"say","topic":"problem","sub":"İşçi ve havuz problemleri","level":2,"q":"Bir işi A tek başına 20 günde, B tek başına 60 günde bitirebilmektedir.<br>İkisi birlikte bu işi kaç günde bitirir?","opts":["12","15","16","17","40"],"a":1,"sol":["Bir günde yapılan işler: A ⟦1/20⟧, B ⟦1/60⟧.","Birlikte: ⟦1/20⟧ + ⟦1/60⟧ = ⟦1/15⟧.","Süre: <b>15</b> gün."],"kaz":"İş hızlarını toplayarak ortak süreyi bulur.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-PRB-026"},{"area":"say","topic":"problem","sub":"Hareket problemleri","level":3,"q":"Bir araç A'dan B'ye saatte 60 km, B'den A'ya ise aynı yoldan saatte 120 km hızla gitmiştir.<br>Gidiş-dönüş boyunca aracın ortalama hızı saatte kaç km'dir?","opts":["72","74","80","88","90"],"a":2,"sol":["Ortalama hız = toplam yol ÷ toplam süre (hızların aritmetik ortalaması DEĞİL).","Yol x ise: 2x ÷ (⟦x/60⟧ + ⟦x/120⟧) = 2·60·120 ÷ (60 + 120) = <b>80</b>."],"kaz":"Ortalama hızı doğru tanımla hesaplar.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-PRB-027"},{"area":"say","topic":"problem","sub":"Kâr-zarar ve yüzde","level":2,"q":"Etiket fiyatı 1200 TL olan bir ürüne önce %20, ardından indirimli fiyat üzerinden %10 indirim uygulanıyor.<br>Ürünün son fiyatı kaç TL'dir?","opts":["816","840","864","888","912"],"a":2,"sol":["İlk indirim sonrası: 1200·⟦80/100⟧ = 960 TL.","İkinci indirim sonrası: <b>864</b> TL."],"kaz":"Ardışık indirimi doğru tabana uygular.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-PRB-028"},{"area":"say","topic":"problem","sub":"Karışım problemleri","level":3,"q":"Tuz oranı %40 olan 300 gram tuzlu su ile tuz oranı %20 olan 200 gram tuzlu su karıştırılıyor.<br>Elde edilen karışımın tuz oranı yüzde kaçtır?","opts":["%32","%33","%34","%37","%38"],"a":0,"sol":["Tuz miktarları: 300·⟦40/100⟧ = 120 g ve 200·⟦20/100⟧ = 40 g.","Oran: (120 + 40) ÷ 500 = %<b>32</b>."],"kaz":"Karışımda madde miktarını korur.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-PRB-029"},{"area":"say","topic":"problem","sub":"Faiz problemleri","level":2,"q":"60000 TL, yıllık %30 basit faiz oranıyla 6 aylığına bankaya yatırılıyor.<br>Süre sonunda hesapta toplam kaç TL olur?","opts":["67000","68000","69000","70000","78000"],"a":2,"sol":["Basit faiz: F = A·r·t / 1200 (t ay).","F = 60000·30·6 / 1200 = 9000 TL.","Toplam: 60000 + 9000 = <b>69000</b> TL."],"kaz":"Basit faiz formülünü ay cinsinden uygular.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-PRB-030"},{"area":"say","topic":"problem","sub":"Sayı problemleri","level":2,"q":"Bir tiyatroda öğrenci bileti 50 TL, tam bilet 80 TL'dir. Bir gösteri için satılan 13 biletten toplam 800 TL gelir elde edilmiştir.<br>Kaç öğrenci bileti satılmıştır?","opts":["5","8","9","12","13"],"a":1,"sol":["Hepsi tam bilet olsaydı gelir 1040 TL olurdu.","Fark: 1040 − 800 = 240; her öğrenci bileti farkı 30 TL azaltır.","Öğrenci bileti: 240 ÷ 30 = <b>8</b>."],"kaz":"Varsayım yöntemiyle hızlı çözüm üretir.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-PRB-031"},{"area":"say","topic":"problem","sub":"Yaş problemleri","level":2,"q":"Bir babanın bugünkü yaşı oğlunun bugünkü yaşının 4 katıdır. 20 yıl sonra babanın yaşı oğlunun yaşının 2 katı olacaktır.<br>Buna göre babanın bugünkü yaşı kaçtır?","opts":["40","48","52","56","64"],"a":0,"sol":["Çocuğun yaşı x ise yetişkinin yaşı 4x olur.","20 yıl sonra: 4x + 20 = 2(x + 20) ⇒ 2x = 20 ⇒ x = 10.","Yetişkinin bugünkü yaşı: 4·10 = <b>40</b>."],"kaz":"Yaş farkının sabitliğini kullanarak denklem kurar.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-PRB-032"},{"area":"say","topic":"problem","sub":"Yaş problemleri","level":3,"q":"3 çocuklu bir ailede babanın yaşı annenin yaşından 5 fazladır. Anne, baba ve çocukların bugünkü yaşları toplamı 82'dir; 4 yıl sonra çocukların yaşları toplamı 29 olacaktır.<br>Buna göre annenin bugünkü yaşı kaçtır?","opts":["24","26","27","29","30"],"a":4,"sol":["Çocukların bugünkü yaş toplamı: 29 − 3·4 = 17.","Anne + baba = 82 − 17 = 65.","Anne x ise 2x + 5 = 65 ⇒ x = <b>30</b>."],"kaz":"Birden çok kişinin yaş toplamlarını zamanla ilişkilendirir.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-PRB-033"},{"area":"say","topic":"problem","sub":"İşçi ve havuz problemleri","level":2,"q":"Bir işi A tek başına 20 günde, B tek başına 30 günde bitirebilmektedir.<br>İkisi birlikte bu işi kaç günde bitirir?","opts":["9","11","12","14","25"],"a":2,"sol":["Bir günde yapılan işler: A ⟦1/20⟧, B ⟦1/30⟧.","Birlikte: ⟦1/20⟧ + ⟦1/30⟧ = ⟦1/12⟧.","Süre: <b>12</b> gün."],"kaz":"İş hızlarını toplayarak ortak süreyi bulur.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-PRB-034"},{"area":"say","topic":"problem","sub":"Hareket problemleri","level":2,"q":"Saatte 60 km hızla giden bir araç yola çıktıktan 3 saat sonra, aynı noktadan aynı yöne saatte 80 km hızla ikinci bir araç hareket ediyor.<br>İkinci araç birinciye kaç saat sonra yetişir?","opts":["5","8","9","10","12"],"a":2,"sol":["Aradaki mesafe: 60·3 = 180 km.","Yaklaşma hızı: 80 − 60 = 20 km/sa.","Süre: 180 ÷ 20 = <b>9</b> saat."],"kaz":"Aynı yönlü harekette hız farkını kullanır.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-PRB-035"},{"area":"say","topic":"problem","sub":"Kâr-zarar ve yüzde","level":2,"q":"Etiket fiyatı 800 TL olan bir ürüne önce %25, ardından indirimli fiyat üzerinden %25 indirim uygulanıyor.<br>Ürünün son fiyatı kaç TL'dir?","opts":["450","462","474","486","522"],"a":0,"sol":["İlk indirim sonrası: 800·⟦75/100⟧ = 600 TL.","İkinci indirim sonrası: <b>450</b> TL."],"kaz":"Ardışık indirimi doğru tabana uygular.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-PRB-036"},{"area":"say","topic":"islem","sub":"Tanımlı işlemler","level":2,"q":"Gerçel sayılar kümesi üzerinde ∗ işlemi<br>a ∗ b = a·b + a + b<br>biçiminde tanımlanıyor.<br>Buna göre (0 ∗ 4) ∗ 0 işleminin sonucu kaçtır?","opts":["−4","0","4","6","8"],"a":2,"sol":["Önce parantez: 0 ∗ 4 = 4.","Sonra 4 ∗ 0 = <b>4</b>."],"kaz":"Yeni tanımlanan işlemi kurala uygun uygular.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-ISL-001"},{"area":"say","topic":"islem","sub":"Tanımlı işlemler","level":3,"q":"x ve y doğal sayılar olmak üzere Δ işlemi<br>x ≥ y ise x Δ y = x − y,<br>x &lt; y ise x Δ y = 4y − x + 3<br>olarak tanımlanıyor.<br>Buna göre (12 Δ 8) Δ 9 kaçtır?","opts":["35","38","39","40","41"],"a":0,"sol":["12 ≥ 8 olduğundan 12 Δ 8 = 4.","4 &lt; 9 olduğundan sonuç <b>35</b>."],"kaz":"Koşullu tanımlı işlemde doğru kuralı seçer.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-ISL-002"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":1,"q":"Bugün günlerden Pazar olduğuna göre bugünden 43 gün sonra hangi gündür?","opts":["Salı","Pazar","Pazartesi","Cumartesi","Çarşamba"],"a":2,"sol":["Haftanın günleri 7'lik döngüdür: 43 = 7·6 + 1.","Pazar gününden 1 gün sonra: <b>Pazartesi</b>."],"kaz":"Periyodik durumlarda mod 7 hesabı yapar.","sure":40,"src":"Özgün – ALES Akademi","id":"SAY-ISL-003"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":3,"q":"3<sup>195</sup> sayısının 5 ile bölümünden kalan kaçtır?","opts":["0","1","2","3","4"],"a":2,"sol":["3'ün kuvvetlerinin 5 ile kalanı döngüsü: 3, 4, 2, 1 (uzunluk 4).","195 ≡ 3 (mod 4) ⇒ sonuç <b>2</b>."],"kaz":"Kuvvetlerde kalan döngüsünü kullanır.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-ISL-004"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":2,"q":"5 ile bölümünden kalan 2 olan iki basamaklı kaç doğal sayı vardır?","opts":["16","17","18","20","22"],"a":2,"sol":["İlk sayı 12, son sayı 97; sayılar 5'er artar.","Terim sayısı: (97 − 12) ÷ 5 + 1 = <b>18</b>."],"kaz":"Belirli kalanı veren sayıları sayar.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-ISL-005"},{"area":"say","topic":"islem","sub":"Fonksiyonlar","level":2,"q":"f(x) = 2x − 1 ve g(x) = 2x + 1<br>olduğuna göre (f ∘ g)(4) kaçtır?","opts":["11","13","15","17","19"],"a":3,"sol":["Önce g(4) = 9.","Sonra f(9) = <b>17</b>."],"kaz":"Bileşke fonksiyonu içten dışa hesaplar.","sure":45,"src":"Özgün – ALES Akademi","id":"SAY-ISL-006"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":1,"q":"Saat 08.00'da başlayan bir çalışma 900 dakika sürmüştür.<br>Çalışma saat kaçta bitmiştir?","opts":["00.00","01.00","23.00","23.10","23.30"],"a":2,"sol":["900 dakika = 15 saat 0 dakika.","08.00 + 15 sa 0 dk = <b>23.00</b> (24 saat düzeni)."],"kaz":"Zaman hesabında 60 ve 24'lük döngüleri kullanır.","sure":40,"src":"Özgün – ALES Akademi","id":"SAY-ISL-007"},{"area":"say","topic":"islem","sub":"Tanımlı işlemler","level":2,"q":"Gerçel sayılar kümesi üzerinde ∗ işlemi<br>a ∗ b = 3a·b + 2a + 2b<br>biçiminde tanımlanıyor.<br>Buna göre (3 ∗ −1) ∗ 3 işleminin sonucu kaçtır?","opts":["−59","−55","−51","−49","−43"],"a":3,"sol":["Önce parantez: 3 ∗ −1 = −5.","Sonra −5 ∗ 3 = <b>−49</b>."],"kaz":"Yeni tanımlanan işlemi kurala uygun uygular.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-ISL-008"},{"area":"say","topic":"islem","sub":"Tanımlı işlemler","level":3,"q":"x ve y doğal sayılar olmak üzere Δ işlemi<br>x ≥ y ise x Δ y = x − y,<br>x &lt; y ise x Δ y = 3y − x + 5<br>olarak tanımlanıyor.<br>Buna göre (1 Δ 3) Δ 5 kaçtır?","opts":["6","7","8","10","12"],"a":2,"sol":["1 &lt; 3 olduğundan 1 Δ 3 = 13.","13 ≥ 5 olduğundan sonuç <b>8</b>."],"kaz":"Koşullu tanımlı işlemde doğru kuralı seçer.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-ISL-009"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":1,"q":"Bugün günlerden Cuma olduğuna göre bugünden 325 gün sonra hangi gündür?","opts":["Salı","Pazartesi","Cumartesi","Pazar","Çarşamba"],"a":1,"sol":["Haftanın günleri 7'lik döngüdür: 325 = 7·46 + 3.","Cuma gününden 3 gün sonra: <b>Pazartesi</b>."],"kaz":"Periyodik durumlarda mod 7 hesabı yapar.","sure":40,"src":"Özgün – ALES Akademi","id":"SAY-ISL-010"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":3,"q":"8<sup>30</sup> sayısının birler basamağındaki rakam kaçtır?","opts":["0","1","2","3","4"],"a":4,"sol":["8'in kuvvetlerinin birler basamağı döngüsü: 8, 4, 2, 6 (uzunluk 4).","30 ≡ 2 (mod 4) ⇒ sonuç <b>4</b>."],"kaz":"Kuvvetlerde kalan döngüsünü kullanır.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-ISL-011"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":2,"q":"13 ile bölümünden kalan 4 olan üç basamaklı kaç doğal sayı vardır?","opts":["65","68","69","70","73"],"a":2,"sol":["İlk sayı 108, son sayı 992; sayılar 13'er artar.","Terim sayısı: (992 − 108) ÷ 13 + 1 = <b>69</b>."],"kaz":"Belirli kalanı veren sayıları sayar.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-ISL-012"},{"area":"say","topic":"islem","sub":"Fonksiyonlar","level":2,"q":"f(3x + 4) = 3x + 2<br>olduğuna göre f(7) kaçtır?","opts":["−7","−5","−3","1","5"],"a":4,"sol":["İç ifade 7'ye eşitlenir: 3x + 4 = 7 ⇒ x = 1.","f(7) = 3·(1) + 2 = <b>5</b>."],"kaz":"Fonksiyonda iç ifadeyi eşitleyerek değer bulur.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-ISL-013"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":1,"q":"Saat 08.00'da başlayan bir çalışma 1050 dakika sürmüştür.<br>Çalışma saat kaçta bitmiştir?","opts":["01.20","01.30","01.40","02.30","23.30"],"a":1,"sol":["1050 dakika = 17 saat 30 dakika.","08.00 + 17 sa 30 dk = <b>01.30</b> (24 saat düzeni)."],"kaz":"Zaman hesabında 60 ve 24'lük döngüleri kullanır.","sure":40,"src":"Özgün – ALES Akademi","id":"SAY-ISL-014"},{"area":"say","topic":"islem","sub":"Tanımlı işlemler","level":3,"q":"x ve y doğal sayılar olmak üzere Δ işlemi<br>x ≥ y ise x Δ y = x − y,<br>x &lt; y ise x Δ y = 4y − x + 2<br>olarak tanımlanıyor.<br>Buna göre (10 Δ 6) Δ 5 kaçtır?","opts":["18","20","21","22","23"],"a":0,"sol":["10 ≥ 6 olduğundan 10 Δ 6 = 4.","4 &lt; 5 olduğundan sonuç <b>18</b>."],"kaz":"Koşullu tanımlı işlemde doğru kuralı seçer.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-ISL-015"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":1,"q":"Bugün günlerden Perşembe olduğuna göre bugünden 177 gün sonra hangi gündür?","opts":["Pazar","Cumartesi","Pazartesi","Perşembe","Cuma"],"a":1,"sol":["Haftanın günleri 7'lik döngüdür: 177 = 7·25 + 2.","Perşembe gününden 2 gün sonra: <b>Cumartesi</b>."],"kaz":"Periyodik durumlarda mod 7 hesabı yapar.","sure":40,"src":"Özgün – ALES Akademi","id":"SAY-ISL-016"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":3,"q":"2<sup>257</sup> sayısının birler basamağındaki rakam kaçtır?","opts":["2","4","5","6","7"],"a":0,"sol":["2'nin kuvvetlerinin birler basamağı döngüsü: 2, 4, 8, 6 (uzunluk 4).","257 ≡ 1 (mod 4) ⇒ sonuç <b>2</b>."],"kaz":"Kuvvetlerde kalan döngüsünü kullanır.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-ISL-017"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":2,"q":"8 ile bölümünden kalan 4 olan üç basamaklı kaç doğal sayı vardır?","opts":["110","111","113","116","117"],"a":2,"sol":["İlk sayı 100, son sayı 996; sayılar 8'er artar.","Terim sayısı: (996 − 100) ÷ 8 + 1 = <b>113</b>."],"kaz":"Belirli kalanı veren sayıları sayar.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-ISL-018"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":1,"q":"Saat 09.00'da başlayan bir çalışma 1312 dakika sürmüştür.<br>Çalışma saat kaçta bitmiştir?","opts":["06.52","07.02","07.22","07.52","08.52"],"a":0,"sol":["1312 dakika = 21 saat 52 dakika.","09.00 + 21 sa 52 dk = <b>06.52</b> (24 saat düzeni)."],"kaz":"Zaman hesabında 60 ve 24'lük döngüleri kullanır.","sure":40,"src":"Özgün – ALES Akademi","id":"SAY-ISL-019"},{"area":"say","topic":"islem","sub":"Tanımlı işlemler","level":2,"q":"Gerçel sayılar kümesi üzerinde ∗ işlemi<br>a ∗ b = 3a·b − a + 3b<br>biçiminde tanımlanıyor.<br>Buna göre (−1 ∗ −2) ∗ 0 işleminin sonucu kaçtır?","opts":["−5","−3","−2","−1","1"],"a":3,"sol":["Önce parantez: −1 ∗ −2 = 1.","Sonra 1 ∗ 0 = <b>−1</b>."],"kaz":"Yeni tanımlanan işlemi kurala uygun uygular.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-ISL-020"},{"area":"say","topic":"islem","sub":"Tanımlı işlemler","level":3,"q":"x ve y doğal sayılar olmak üzere Δ işlemi<br>x ≥ y ise x Δ y = x − y,<br>x &lt; y ise x Δ y = 3y − x + 3<br>olarak tanımlanıyor.<br>Buna göre (10 Δ 5) Δ 1 kaçtır?","opts":["0","1","2","3","4"],"a":4,"sol":["10 ≥ 5 olduğundan 10 Δ 5 = 5.","5 ≥ 1 olduğundan sonuç <b>4</b>."],"kaz":"Koşullu tanımlı işlemde doğru kuralı seçer.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-ISL-021"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":1,"q":"Bugün günlerden Çarşamba olduğuna göre bugünden 340 gün sonra hangi gündür?","opts":["Salı","Cuma","Cumartesi","Pazartesi","Pazar"],"a":4,"sol":["Haftanın günleri 7'lik döngüdür: 340 = 7·48 + 4.","Çarşamba gününden 4 gün sonra: <b>Pazar</b>."],"kaz":"Periyodik durumlarda mod 7 hesabı yapar.","sure":40,"src":"Özgün – ALES Akademi","id":"SAY-ISL-022"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":3,"q":"13<sup>196</sup> sayısının 5 ile bölümünden kalan kaçtır?","opts":["0","1","2","3","4"],"a":1,"sol":["13'ün kuvvetlerinin 5 ile kalanı döngüsü: 3, 4, 2, 1 (uzunluk 4).","196 ≡ 4 (mod 4) ⇒ sonuç <b>1</b>."],"kaz":"Kuvvetlerde kalan döngüsünü kullanır.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-ISL-023"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":2,"q":"4 ile bölümünden kalan 2 olan iki basamaklı kaç doğal sayı vardır?","opts":["18","21","22","23","25"],"a":3,"sol":["İlk sayı 10, son sayı 98; sayılar 4'er artar.","Terim sayısı: (98 − 10) ÷ 4 + 1 = <b>23</b>."],"kaz":"Belirli kalanı veren sayıları sayar.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-ISL-024"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":1,"q":"Saat 07.00'da başlayan bir çalışma 766 dakika sürmüştür.<br>Çalışma saat kaçta bitmiştir?","opts":["18.46","19.46","19.56","20.16","20.46"],"a":1,"sol":["766 dakika = 12 saat 46 dakika.","07.00 + 12 sa 46 dk = <b>19.46</b> (24 saat düzeni)."],"kaz":"Zaman hesabında 60 ve 24'lük döngüleri kullanır.","sure":40,"src":"Özgün – ALES Akademi","id":"SAY-ISL-025"},{"area":"say","topic":"islem","sub":"Tanımlı işlemler","level":2,"q":"Gerçel sayılar kümesi üzerinde ∗ işlemi<br>a ∗ b = 3a·b − 3a − 2b<br>biçiminde tanımlanıyor.<br>Buna göre (−2 ∗ −2) ∗ 2 işleminin sonucu kaçtır?","opts":["52","58","60","62","86"],"a":3,"sol":["Önce parantez: −2 ∗ −2 = 22.","Sonra 22 ∗ 2 = <b>62</b>."],"kaz":"Yeni tanımlanan işlemi kurala uygun uygular.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-ISL-026"},{"area":"say","topic":"islem","sub":"Tanımlı işlemler","level":3,"q":"x ve y doğal sayılar olmak üzere Δ işlemi<br>x ≥ y ise x Δ y = x − y,<br>x &lt; y ise x Δ y = 2y − x + 2<br>olarak tanımlanıyor.<br>Buna göre (1 Δ 6) Δ 7 kaçtır?","opts":["2","4","5","6","8"],"a":3,"sol":["1 &lt; 6 olduğundan 1 Δ 6 = 13.","13 ≥ 7 olduğundan sonuç <b>6</b>."],"kaz":"Koşullu tanımlı işlemde doğru kuralı seçer.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-ISL-027"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":1,"q":"Bugün günlerden Pazar olduğuna göre bugünden 203 gün sonra hangi gündür?","opts":["Pazartesi","Salı","Cuma","Pazar","Cumartesi"],"a":3,"sol":["Haftanın günleri 7'lik döngüdür: 203 = 7·29 + 0.","Pazar gününden 0 gün sonra: <b>Pazar</b>."],"kaz":"Periyodik durumlarda mod 7 hesabı yapar.","sure":40,"src":"Özgün – ALES Akademi","id":"SAY-ISL-028"},{"area":"say","topic":"islem","sub":"Modüler aritmetik","level":3,"q":"17<sup>190</sup> sayısının 5 ile bölümünden kalan kaçtır?","opts":["0","1","2", :"sayma","sub":"Sayma yöntemleri","level":3,"q":"{0, 2, 3, 7, 9} kümesinin elemanları kullanılarak rakamları birbirinden farklı üç basamaklı kaç çift sayı yazılabilir?","opts":["1","5","17","21","37"],"a":3,"sol":["Önce kısıtlı basamaklar (birler basamağı / yüzler basamağı, 0'ın başta olamaması) yerleştirilir.","Gerekirse 0'ın birler basamağında olup olmadığına göre durumlara ayrılır.","Sonuç: <b>21</b>."],"kaz":"Çarpma ilkesini kısıtlarla uygular.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-SAY-003"},{"area":"say","topic":"sayma","sub":"Olasılık","level":3,"q":"Bir torbada 2 kırmızı, 7 mavi, 3 yeşil top vardır. Torbadan rastgele aynı anda iki top çekiliyor.<br>Çekilen topların <b>ikisi de kırmızı</b> olma olasılığı kaçtır?","opts":["⟦1/66⟧","⟦1/33⟧","⟦5/66⟧","⟦1/11⟧","⟦7/66⟧"],"a":0,"sol":["Tüm durumlar: C(12,2) = 66.","İstenen durumlar: 1.","Olasılık: ⟦1/66⟧ = <b>⟦1/66⟧</b>."],"kaz":"Kombinasyonla olasılık hesaplar.","sure":75,"src":"Özgün – ALES Akademi","id":"SAY-SAY-004"},{"area":"say","topic":"sayma","sub":"Olasılık","level":2,"q":"İki hilesiz zar birlikte atılıyor.<br>Zarların üst yüzlerindeki sayıların çarpımının çift olma olasılığı kaçtır?","opts":["⟦23/36⟧","⟦2/3⟧","⟦25/36⟧","⟦3/4⟧","⟦31/36⟧"],"a":3,"sol":["Tüm durumlar: 6·6 = 36.","Uygun durum sayısı: 27.","Olasılık: ⟦27/36⟧ = <b>⟦3/4⟧</b>."],"kaz":"Örnek uzayı listeleyerek olasılık bulur.","sure":60,"src":"Özgün – ALES Akademi","id":"SAY-SAY-005"},{"area":"say","topic":"sayma","sub":"Sayma yöntemleri","level":2,"q":"2 birim doğuya ve 5 birim kuzeye gidilmesi gereken kareli bir şehir planında, yalnızca doğu ve kuzey yönünde hareket ederek en kısa yoldan kaç farklı biçimde gidilebilir?","opts":["21","24","27","30","36"],"a":0,"sol":["Toplam 7 adımın 2 tanesi doğu olacaktır.","C(7,2) = <b>21</b>."],"kaz":"En kısa yol sayısını kombinasyonla bulur.","sure":50,"src":"Özgün – ALES Akademi","id":"SAY-SAY-006"},{"area":"say","topic":"sayma","sub":"Permütasyon","level":3,"q":"KİTAP kelimesinin harflerinin tü rc":"Özgün – ALES Akademi","id":"SOZ-SOZ-001"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":3,"q":"Kentlerin belleği yalnızca anıtlarda değil, gündelik hayatın ---- izlerinde saklıdır; bu izler silindiğinde kent, ---- bir dekora dönüşür.<br>Bu cümlede boş bırakılan yerlere aşağıdakilerden hangileri sırasıyla getirilmelidir?","opts":["kalıcı – zengin","sıradan – ruhsuz","görkemli – canlı","belirgin – tarihî","yapay – özgün"],"a":1,"sol":["İlk boşluk, 'anıtlar' ile karşıtlık kuruyor: anıtların karşıtı gündelik hayatın sıradan izleridir.","İzler silindiğinde kentin olumsuz bir duruma düşmesi beklenir: 'ruhsuz bir dekor'. Diğer çiftlerde ikinci sözcük olumlu anlamlıdır ya da ilk sözcük karşıtlığı kurmaz."],"kaz":"Karşıtlık ve sonuç ilişkisini kullanarak sözcük çiftini belirler.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-002"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":2,"q":"Yazarın üslubu, karmaşık düşünceleri ---- bir dille aktarmasıyla öne çıkar; okur, metnin derinliğini yorulmadan kavrar.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["ağdalı","dolambaçlı","kapalı","yalın","süslü"],"a":3,"sol":["'Okur yorulmadan kavrar' ifadesi, dilin anlaşılır ve sade olduğunu gösterir.","'Yalın' bu anlamı karşılar; diğer seçenekler anlaşılmayı zorlaştıran nitelikler bildirir."],"kaz":"Sonuç cümlesinden hareketle sıfatın anlamını belirler.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-003"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":2,"q":"Deneyimli bir hekim, hastanın anlattıklarının yanı sıra ---- belirtilere de dikkat eder; çünkü bazı hastalıklar kendini ancak küçük ayrıntılarla ele verir.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["herkesin bildiği","hastanın abarttığı","tedavi edilmiş","kesinleşmiş","gözden kaçabilecek"],"a":4,"sol":["Gerekçe cümlesi 'küçük ayrıntılar'dan söz ediyor.","Küçük ayrıntılar kolayca fark edilmeyen, 'gözden kaçabilecek' belirtilerdir."],"kaz":"Gerekçe bildiren cümleyi boşlukla ilişkilendirir.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-004"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":3,"q":"Sanatçı, eserlerinde geleneği körü körüne ---- da ondan tümüyle ---- da; geleneği yeniden yorumlayarak kendine özgü bir dil kurar.<br>Bu cümlede boş bırakılan yerlere aşağıdakilerden hangileri sırasıyla getirilmelidir?","opts":["reddetmez – uzaklaşmaz","tekrarlamaz – kopmaz","benimser – etkilenir","yüceltir – beslenir","eleştirir – yararlanır"],"a":1,"sol":["'Yeniden yorumlamak', geleneği ne olduğu gibi tekrar etmek ne de ondan bütünüyle ayrılmak demektir.","Bu iki uç, 'tekrarlamaz – kopmaz' çiftiyle karşılanır. 'Reddetmez – uzaklaşmaz' çifti, 'körü körüne' ifadesiyle anlamca uyuşmaz."],"kaz":"İki uç arasındaki orta yolu anlatan yapıyı çözümler.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-005"},{"area":"soz","topic":"sozcuk","sub":"Sözcükte anlam","level":2,"q":"Bu romanda yazar, kahramanın iç dünyasındaki <u>kırılmaları</u> ustalıkla yansıtıyor.<br>Bu cümlede altı çizili sözcüğün anlamı aşağıdakilerden hangisidir?","opts":["Duygu ve düşüncelerde yaşanan sarsıcı değişimler","Fiyatların belirgin biçimde düşmesi","Işığın bir ortamdan ötekine geçerken yön değiştirmesi","İki kişi arasındaki ilişkinin sona ermesi","Bir nesnenin parçalara ayrılması"],"a":0,"sol":["'İç dünya' ifadesi sözcüğün mecaz anlamda, ruhsal bir değişimi anlatmak için kullanıldığını gösterir."],"kaz":"Bağlama göre sözcüğün mecaz anlamını belirler.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-006"},{"area":"soz","topic":"sozcuk","sub":"Gerçek ve mecaz anlam","level":2,"q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcük <b>mecaz</b> anlamda kullanılmıştır?","opts":["Derenin <u>derin</u> yerlerinde yüzmek yasaktı.","Ondan gördüğümüz <u>soğuk</u> karşılama hepimizi şaşırttı.","Bahçedeki <u>kuru</u> yaprakları topladık.","Masanın üzerindeki <u>ağır</u> kutuyu birlikte kaldırdık.","Fırından yeni çıkan <u>sıcak</u> ekmeği dilimledi."],"a":1,"sol":["'Soğuk karşılama', sıcaklıkla değil ilgisizlik ve mesafeyle ilgilidir; sözcük mecazdır.","Diğer cümlelerde sözcükler somut, ölçülebilir özellikleri (ağırlık, nem, sıcaklık, derinlik) bildirir."],"kaz":"Gerçek ve mecaz anlamı ayırt eder.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-007"},{"area":"soz","topic":"sozcuk","sub":"Terim anlam","level":2,"q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcük <b>terim</b> anlamıyla kullanılmıştır?","opts":["Bahçedeki otları <u>kökünden</u> söktük.","Sorunun <u>kökü</u> yanlış planlamadaydı.","Bu geleneğin <u>kökleri</u> çok eskiye dayanır.","Bu denklemin <u>kökleri</u> birbirine eşittir.","Ağacın <u>kökleri</u> kaldırımı kırmış."],"a":3,"sol":["'Denklemin kökü', matematik alanına özgü bir kavramdır: denklemi sağlayan değer.","Diğerlerinde sözcük gerçek (bitki kökü) ya da mecaz (kaynak, temel) anlamdadır."],"kaz":"Terim anlamı gerçek ve mecaz anlamdan ayırır.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-008"},{"area":"soz","topic":"sozcuk","sub":"Eş anlamlılık","level":2,"q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcüğün yerine ayraç içindeki sözcük getirilirse cümlenin anlamı <b>değişmez</b>?","opts":["Sınav <u>sonuçları</u> bugün açıklandı. (nedenleri)","Yolun <u>sonunda</u> küçük bir köy göründü. (amacında)","Bu <u>sorun</u> bir an önce çözülmeli. (soru)","Bugün hava biraz <u>serin</u>. (soğuk)","Bu konuda henüz <u>kesin</u> bir karar verilmedi. (kati)"],"a":4,"sol":["'Kesin' ile 'kati' eş anlamlıdır.","'Serin' ile 'soğuk' yakın anlamlıdır ama derece farkı taşır; diğer çiftler farklı anlamlardadır."],"kaz":"Eş ve yakın anlamlı sözcükleri ayırt eder.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-009"},{"area":"soz","topic":"sozcuk","sub":"Zıt anlamlılık","level":1,"q":"Aşağıdaki cümlelerin hangisinde <b>zıt anlamlı</b> sözcükler bir arada kullanılmıştır?","opts":["Hızlı ama dikkatli bir sürücüydü.","Dar ve uzun bir sokaktan geçtik.","Güzel ve anlamlı bir konuşma yaptı.","Kazancı da kaybı da onu aynı ölçüde düşündürüyordu.","Yolculuğun sonunda yorgun ve bitkin düşmüştü."],"a":3,"sol":["'Kazanç' ile 'kayıp' karşıt kavramlardır.","'Yorgun – bitkin' yakın anlamlı; diğer çiftler ise karşıtlık bildirmez."],"kaz":"Zıt anlam ilişkisini tanır.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-010"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":2,"q":"Araştırmacılar, verilerin ---- olduğunu fark edince sonuçları yayımlamaktan vazgeçtiler; çünkü ölçüm aletlerinden biri hatalı çalışıyordu.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["anlamlı","tutarlı","güncel","kapsamlı","güvenilmez"],"a":4,"sol":["Hatalı çalışan bir ölçüm aleti verilerin güvenilirliğini ortadan kaldırır.","Yayımlamaktan vazgeçme kararı da olumsuz bir niteliği gerektirir: 'güvenilmez'."],"kaz":"Gerekçeden yola çıkarak olumsuz niteleme seçer.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-011"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":3,"q":"Bilgiye erişimin kolaylaşması, ---- bilgi ile ---- bilgi arasındaki ayrımı yapmayı zorlaştırdı.<br>Bu cümlede boş bırakılan yerlere aşağıdakilerden hangileri sırasıyla getirilmelidir?","opts":["yazılı – basılı","güvenilir – kulaktan dolma","kısa – uzun","yerel – ulusal","yeni – güncel"],"a":1,"sol":["'Ayrımı yapmayı zorlaştırmak' iki karşıt niteliği gerektirir; erişimin kolaylaşmasının yarattığı sorun, doğru ile doğrulanmamış bilginin ayırt edilmesidir.","Bu karşıtlığı yalnızca 'güvenilir – kulaktan dolma' çifti kurar."],"kaz":"Karşıtlık kuran sözcük çiftini bağlama göre seçer.","sure":50,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-012"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":3,"q":"Eleştirmen, romanın kurgusundaki ---- dikkat çekerek olayların birbirine inandırıcı biçimde bağlanmadığını belirtti.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["özgünlüğe","akıcılığa","zenginliğe","derinliğe","boşluklara"],"a":4,"sol":["Eleştirmenin vurguladığı şey olumsuzdur: olaylar inandırıcı biçimde bağlanmıyor.","Bu olumsuzluğu 'boşluklar' karşılar; diğer seçenekler olumlu niteliklerdir."],"kaz":"Olumsuz yargıyla uyumlu sözcüğü seçer.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-013"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":2,"q":"Müzenin yeni sergisi, ziyaretçileri yalnızca izleyici olmaktan çıkarıp sürecin ---- dönüştürmeyi amaçlıyor.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["dışında kalan birine","uzak bir tanığına","sessiz bir seyircisine","etkin bir parçasına","yorgun bir takipçisine"],"a":3,"sol":["'Yalnızca izleyici olmaktan çıkarmak', pasif konumun karşıtına geçişi anlatır.","Pasifliğin karşıtı 'etkin bir parça' olmaktır; diğer seçenekler yine edilgen konumları anlatır."],"kaz":"Karşıtlık ilişkisinden hareketle boşluğu tamamlar.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-014"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":2,"q":"Göç, yalnızca bir yerden bir yere taşınmak değil, aynı zamanda alışılmış olanla ---- ve yeni olana uyum sağlama sürecidir.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["övünme","buluşma","vedalaşma","yarışma","yetinme"],"a":2,"sol":["Cümle iki yönlü bir süreç anlatıyor: eskiden ayrılma ve yeniye uyum.","'Alışılmış olanla vedalaşma' bu ayrılmayı karşılar."],"kaz":"Paralel yapıdaki anlam ilişkisini kurar.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-015"},{"area":"soz","topic":"sozcuk","sub":"Deyimler","level":2,"q":"Yönetici, gelen eleştirilere rağmen yeni planı uygulamayı <u>göze aldı</u>.<br>Bu cümlede altı çizili sözün anlamı aşağıdakilerden hangisidir?","opts":["Bir konuyu dikkatle incelemek","Bir kararı ileri bir tarihe ertelemek","Bir işi başkasına devretmek","Olası olumsuz sonuçları kabullenerek bir işe girişmek","Bir işi kimseye duyurmadan yürütmek"],"a":3,"sol":["'Eleştirilere rağmen' ifadesi riskin bilindiğini gösterir.","'Göze almak' deyimi tam olarak riski üstlenerek harekete geçmeyi anlatır."],"kaz":"Deyimin bağlamdaki anlamını belirler.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-016"},{"area":"soz","topic":"sozcuk","sub":"Sözcükler arası ilişki","level":2,"q":"Aşağıdaki sözcük çiftlerinden hangisinde, 'kalem – yazmak' çifti arasındaki anlam ilişkisinin benzeri vardır?","opts":["makas – kesmek","bulut – yağmur","kitap – kütüphane","ağaç – orman","öğretmen – öğrenci"],"a":0,"sol":["Kalem bir araçtır, yazmak onun işlevidir (araç – işlev).","Aynı ilişki yalnızca 'makas – kesmek' çiftinde vardır; diğerleri yer, karşılıklı rol, parça–bütün ve neden–sonuç ilişkileridir."],"kaz":"Sözcükler arasındaki ilişki türünü belirler.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-017"},{"area":"soz","topic":"sozcuk","sub":"Sözcükler arası ilişki","level":2,"q":"Aşağıdaki sözcük çiftlerinden hangisinde, 'damla – deniz' çifti arasındaki anlam ilişkisinin benzeri vardır?","opts":["çekiç – çivi","doktor – hastane","sıcak – soğuk","kuraklık – kıtlık","tuğla – duvar"],"a":4,"sol":["Damla, denizi oluşturan küçük birimdir (parça – bütün).","Tuğla da duvarı oluşturan birimdir; diğer çiftler araç–nesne, kişi–yer, karşıtlık ve neden–sonuç ilişkisi taşır."],"kaz":"Parça–bütün ilişkisini tanır.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-018"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":2,"q":"Uzmanlara göre çocukların dil gelişimi, çevrelerinde duydukları sözcüklerin ---- yakından ilişkilidir; zengin bir söz varlığıyla büyüyen çocuk kendini daha rahat ifade eder.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["azlığıyla","kökeniyle","yazımıyla","çeşitliliğiyle","tekdüzeliğiyle"],"a":3,"sol":["İkinci cümle 'zengin söz varlığı'ndan söz ediyor; bu, sözcüklerin çeşitliliğine karşılık gelir."],"kaz":"Açıklayıcı cümleyle boşluk arasında bağ kurar.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-019"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":3,"q":"Bu çalışma, konuyu ---- ele aldığı için alandaki dağınık bilgileri bir araya getiren temel bir başvuru kaynağı olmuştur.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["bütüncül bir bakışla","tek bir açıdan","kişisel kaygılarla","yüzeysel biçimde","alışılmış kalıplarla"],"a":0,"sol":["'Dağınık bilgileri bir araya getirmek', konuyu bütün yönleriyle ele almayı gerektirir.","'Bütüncül bir bakış' bu sonucun nedeni olabilecek tek seçenektir."],"kaz":"Neden–sonuç ilişkisini sözcük seçimine yansıtır.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-020"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":3,"q":"Eski fotoğraflar geçmişe ---- bir pencere sunar; ancak bu pencere, fotoğrafçının seçtiği açıyla ---- olduğundan gerçeğin yalnızca bir kısmını gösterir.<br>Bu cümlede boş bırakılan yerlere aşağıdakilerden hangileri sırasıyla getirilmelidir?","opts":["aralanan – sınırlı","değişen – eksiksiz","kapanan – geniş","unutulan – sabit","süslenen – özgür"],"a":0,"sol":["'Pencere sunar' olumlu bir işlev bildirir: geçmişe aralanan bir pencere.","'Ancak … gerçeğin yalnızca bir kısmını gösterir' sınırlılık anlatır: 'sınırlı'."],"kaz":"Ancak bağlacının kurduğu karşıtlığı çözümler.","sure":50,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-021"},{"area":"soz","topic":"sozcuk","sub":"Çok anlamlılık","level":2,"q":"Aşağıdaki cümlelerin hangisinde 'açmak' sözcüğü 'başlatmak' anlamında kullanılmıştır?","opts":["Bahçedeki güller bu yıl erken açtı.","Moderatör, oturumu kısa bir konuşmayla açtı.","Bu kırıcı sözler aramızda yeni bir yara açtı.","Öğleden sonra hava açınca dışarı çıktık.","Pencereyi açınca içeri serin bir hava doldu."],"a":1,"sol":["'Oturumu açmak', oturumu başlatmak demektir.","Diğerlerinde sözcük 'aralamak', 'oluşturmak', 'havanın aydınlanması' ve 'çiçeklenmek' anlamlarındadır."],"kaz":"Çok anlamlı sözcüğün bağlamdaki anlamını belirler.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-022"},{"area":"soz","topic":"sozcuk","sub":"Çok anlamlılık","level":2,"q":"Aşağıdaki cümlelerin hangisinde 'ağır' sözcüğü 'ciddi, tehlikeli' anlamında kullanılmıştır?","opts":["Odaya ağır bir parfüm kokusu sinmişti.","Yaşlı adam ağır adımlarla yürüyordu.","Akşam yediğimiz yemek biraz ağırdı.","Kaza sonucunda iki kişi ağır yaralandı.","Bu kutu tek kişinin taşıyamayacağı kadar ağır."],"a":3,"sol":["'Ağır yaralanmak', yaralanmanın ciddi olduğunu anlatır.","Diğerlerinde 'yavaş', 'kütlesi fazla', 'yoğun' ve 'sindirimi güç' anlamları vardır."],"kaz":"Çok anlamlı sözcüğün anlam ayrımını yapar.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-023"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":1,"q":"Başarılı bir çeviri, kaynak metne ---- kalırken hedef dilin doğallığını da korur.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["düşman","kayıtsız","yabancı","sadık","uzak"],"a":3,"sol":["'Kalırken … da korur' yapısı iki olumlu niteliği birleştirir; kaynak metne bağlılık 'sadık kalmak' ile anlatılır."],"kaz":"Kalıplaşmış sözcük birlikteliklerini tanır.","sure":30,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-024"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":2,"q":"Küresel ısınmanın etkileri artık bilim insanlarının öngörüsü olmaktan çıkmış, gündelik yaşamda ---- bir gerçeğe dönüşmüştür.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["doğrudan hissedilen","uzak geleceğe ait","henüz kanıtlanmamış","yalnızca kuramsal","tartışmaya açık"],"a":0,"sol":["'Öngörü olmaktan çıkmak' soyut olandan somuta geçişi anlatır.","Gündelik yaşamda somutlaşan gerçek 'doğrudan hissedilen' bir gerçektir; diğer seçenekler öngörü düzeyinde kalmayı anlatır."],"kaz":"Durum değişikliğini anlatan yapıyı çözümler.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-025"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":3,"q":"Pek çok buluş, uzun ve ---- bir çalışmanın değil, beklenmedik bir ---- ürünü olarak ortaya çıkmıştır.<br>Bu cümlede boş bırakılan yerlere aşağıdakilerden hangileri sırasıyla getirilmelidir?","opts":["dağınık – düzenin","ortak – tekrarın","sıradan – alışkanlığın","planlı – rastlantının","kısa – sabrın"],"a":3,"sol":["'… değil, …' yapısı karşıtlık kurar: uzun ve planlı çalışma ile beklenmedik rastlantı.","Bu karşıtlığı yalnızca 'planlı – rastlantının' çifti sağlar."],"kaz":"'Değil' yapısıyla kurulan karşıtlığı çözer.","sure":50,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-026"},{"area":"soz","topic":"sozcuk","sub":"Yakın anlamlılık","level":1,"q":"Aşağıdaki cümlelerin hangisinde <b>yakın anlamlı</b> sözcükler birlikte kullanılmıştır?","opts":["Haberi alınca hem sevinçli hem üzgündü.","Uzun bir yürüyüşün ardından yorgun ve halsiz eve döndü.","Çantasına kitabını ve defterini koydu.","Hızlı ama özensiz bir çalışma yapmıştı.","Toplantıya yaşlı genç herkes katıldı."],"a":1,"sol":["'Yorgun' ve 'halsiz' aynı duruma yakın anlamlar taşır.","'Sevinçli – üzgün' ile 'yaşlı – genç' zıt anlamlıdır; diğerlerinde anlam ilişkisi yoktur."],"kaz":"Yakın ve zıt anlamı ayırt eder.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-027"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":2,"q":"Bilim tarihi, bir dönemin ---- kabul edilen düşüncelerinin sonraki dönemlerde nasıl sorgulandığının örnekleriyle doludur.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["geçersiz","gülünç","yasaklanmış","unutulmuş","tartışılmaz"],"a":4,"sol":["Sorgulanmanın vurgu kazanması için düşüncelerin daha önce kesin doğru sayılmış olması gerekir: 'tartışılmaz'."],"kaz":"Zaman içindeki karşıtlığı sezer.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-028"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":4,"q":"Şair, doğayı anlatırken ---- betimlemelerden kaçınıp okurun hayal gücüne alan bırakan ---- imgeler kullanır.<br>Bu cümlede boş bırakılan yerlere aşağıdakilerden hangileri sırasıyla getirilmelidir?","opts":["her şeyi söyleyen – çağrışımı güçlü","çağrışımı güçlü – sıradan","yalın – karmaşık","kısa – uzun","kapalı – açık seçik"],"a":0,"sol":["Okurun hayal gücüne alan bırakmak, her şeyi açıkça söylememekle olur; kaçınılan şey 'her şeyi söyleyen' betimlemelerdir.","Hayal gücünü harekete geçiren imgeler 'çağrışımı güçlü' imgelerdir."],"kaz":"İki boşluk arasındaki karşıtlığı ve amacı birlikte değerlendirir.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-029"},{"area":"soz","topic":"sozcuk","sub":"Boşluk doldurma","level":2,"q":"Ekonomik krizler toplumun en ---- kesimlerini daha derinden etkiler; bu nedenle sosyal politikalar öncelikle bu kesimleri korumalıdır.<br>Bu cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","opts":["kırılgan","dirençli","güçlü","ayrıcalıklı","varlıklı"],"a":0,"sol":["Krizden 'daha derinden etkilenen' ve 'korunması gereken' kesimler, dayanıklılığı düşük olanlardır: 'kırılgan'."],"kaz":"Sonuç cümlesiyle uyumlu niteleme seçer.","sure":35,"src":"Özgün – ALES Akademi","id":"SOZ-SOZ-030"},{"area":"soz","topic":"cumle","sub":"Kesin çıkarım","level":3,"q":"Kentteki bisiklet yollarının uzunluğu son beş yılda iki katına çıkmış olsa da bu yolları kullananların sayısındaki artış, beklenenin oldukça altında kalmıştır.<br>Bu cümleden aşağıdaki yargılardan hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Kentte bisiklet kullananların sayısı azalmıştır.","Bisiklet yollarındaki artış, kullanıcı sayısını beklenen ölçüde artırmamıştır.","Kent yönetimi yeni bisiklet yolu yapımını durduracaktır.","Kentteki bisiklet yolları hâlâ yetersizdir.","Bisiklet yollarının uzunluğu beş yılda üç katına çıkmıştır."],"a":1,"sol":["Cümlede kullanıcı sayısında 'artış' olduğu ama bunun beklenenin altında kaldığı söyleniyor.","'Azalmıştır' cümleyle çelişir; 'yetersizdir' ve 'durduracaktır' cümlede olmayan yorumlardır."],"kaz":"Cümlede açıkça bulunan bilgiyi yorumdan ayırır.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-001"},{"area":"soz","topic":"cumle","sub":"Kesin çıkarım","level":3,"q":"Yazarın son romanı, yayımlandığı ilk ay en çok satanlar listesine girmesine karşın eleştirmenlerden beklediği ilgiyi görmedi.<br>Bu cümleden aşağıdaki yargılardan hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Roman ilk aydan sonra listeden çıkmıştır.","Eleştirmenler romanı olumsuz biçimde eleştirmiştir.","Romanın okurdan gördüğü ilgi ile eleştirmenlerden gördüğü ilgi örtüşmemiştir.","Yazar eleştirmenlerin tutumuna tepki göstermiştir.","Yazarın önceki romanları da çok satmıştır."],"a":2,"sol":["Çok satma okur ilgisini, beklenen ilginin görülmemesi eleştirmen tarafını gösterir; ikisi örtüşmemiştir.","'İlgi görmemek' olumsuz eleştiri anlamına gelmez; diğer seçenekler cümlede yoktur."],"kaz":"Karşıtlık bildiren cümleden kesin yargı çıkarır.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-002"},{"area":"soz","topic":"cumle","sub":"Kesin çıkarım","level":2,"q":"Bu ilaç, yalnızca hekim kontrolünde ve önerilen dozda kullanıldığında etkili ve güvenlidir.<br>Bu cümleden aşağıdaki yargılardan hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Hekimler bu ilacı sıklıkla önermektedir.","İlacın güvenli kullanımı belirli koşullara bağlıdır.","İlaç yüksek dozda daha etkili olur.","İlacın hiçbir yan etkisi yoktur.","İlaç reçetesiz satılmaktadır."],"a":1,"sol":["'Yalnızca … kullanıldığında' ifadesi güvenliği koşula bağlar.","Diğer seçenekler cümlede yer almayan ya da cümleyle çelişen yargılardır."],"kaz":"Koşul bildiren yapıdan kesin yargı çıkarır.","sure":45,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-003"},{"area":"soz","topic":"cumle","sub":"Neden–sonuç","level":1,"q":"Aşağıdaki cümlelerin hangisinde <b>neden–sonuç</b> ilişkisi vardır?","opts":["Yoğun kar yağışı nedeniyle okullar tatil edildi.","Bu kitap ötekinden çok daha sürükleyici.","Erken çıkarsak trafiğe yakalanmayız.","Sınavı kazanmak için her gün düzenli çalışıyor.","Hem okuyor hem de yarı zamanlı çalışıyor."],"a":0,"sol":["Okulların tatil edilmesi (sonuç), kar yağışına (neden) bağlanmıştır.","Diğerlerinde sırasıyla amaç–sonuç, koşul–sonuç, karşılaştırma ve eş zamanlı iki eylem vardır."],"kaz":"Anlam ilişkilerini ayırt eder.","sure":35,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-004"},{"area":"soz","topic":"cumle","sub":"Amaç–sonuç","level":2,"q":"Aşağıdaki cümlelerin hangisinde <b>amaç–sonuç</b> ilişkisi vardır?","opts":["Yağmur yağarsa maç ertelenecek.","Tahtayı daha iyi görebilmek için ön sıraya oturdu.","Kitabı baştan sona okudu ama pek anlamadı.","Gözleri bozuk olduğundan gözlük takmaya başladı.","Hava kararınca hepimiz eve döndük."],"a":1,"sol":["Ön sıraya oturma eylemi bir amaca (daha iyi görmek) yöneliktir; amaç henüz gerçekleşmemiştir.","'Gözleri bozuk olduğundan' bir nedendir; amaç değil. Diğerleri zaman, koşul ve karşıtlık bildirir."],"kaz":"Amaç ile nedeni ayırt eder.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-005"},{"area":"soz","topic":"cumle","sub":"Koşul–sonuç","level":1,"q":"Aşağıdaki cümlelerin hangisinde <b>koşul–sonuç</b> ilişkisi vardır?","opts":["Düzenli çalıştığı için sınavı rahatlıkla geçti.","Sınav, geçen yılkinden daha kolaydı.","Düzenli çalışırsan bu sınavı rahatlıkla geçersin.","Sınavı geçti ama beklediği puanı alamadı.","Sınavı geçmek amacıyla düzenli çalışıyor."],"a":2,"sol":["'-sa/-se' eki ile sınavı geçmek düzenli çalışma koşuluna bağlanmıştır.","Diğerlerinde neden–sonuç, amaç–sonuç, karşıtlık ve karşılaştırma vardır."],"kaz":"Koşul anlamını tanır.","sure":35,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-006"},{"area":"soz","topic":"cumle","sub":"Öznel ve nesnel yargı","level":1,"q":"Aşağıdakilerden hangisi <b>nesnel</b> bir yargıdır?","opts":["Bu şehir yaşamak için dünyanın en güzel yeridir.","Romanın sonu okuru derinden etkiliyor.","Kızılırmak, tamamı Türkiye sınırları içinde kalan en uzun akarsudur.","Yazarın üslubu oldukça sıkıcı.","Bu film, yönetmenin en başarılı işidir."],"a":2,"sol":["Nesnel yargı kanıtlanabilir bilgidir; akarsu uzunluğu ölçülebilir bir veridir.","Diğerleri kişiden kişiye değişebilecek değerlendirmelerdir."],"kaz":"Öznel ve nesnel yargıyı ayırt eder.","sure":35,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-007"},{"area":"soz","topic":"cumle","sub":"Öznel ve nesnel yargı","level":1,"q":"Aşağıdakilerden hangisi <b>öznel</b> bir yargıdır?","opts":["Sergideki tablolar renk kullanımıyla insanı büyülüyor.","Sergi 15 Mart'ta ziyarete açılacak.","Tablolar üç farklı salonda sergileniyor.","Sanatçı eserlerinde yağlıboya tekniğini kullanmıştır.","Sergide kırk tablo yer alıyor."],"a":0,"sol":["'İnsanı büyülemek' kişisel bir izlenimdir; herkes için geçerli olduğu kanıtlanamaz.","Diğerleri sayılabilir ya da doğrulanabilir bilgilerdir."],"kaz":"Öznel yargıyı tanır.","sure":35,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-008"},{"area":"soz","topic":"cumle","sub":"Varsayım","level":3,"q":"Gelecek yıl kütüphane yeniden hizmete açılırsa öğrencilerin çalışma alanı sorunu büyük ölçüde çözülecek.<br>Bu cümlede aşağıdakilerden hangisi <b>varsayılmaktadır</b>?","opts":["Öğrenciler kütüphanede çalışmayı sevmez.","Kütüphane yeniden inşa edilmektedir.","Kentte başka hiçbir çalışma alanı yoktur.","Öğrencilerin çalışma alanı sorunu, kütüphanenin kapalı olmasıyla ilgilidir.","Kütüphane kesinlikle gelecek yıl açılacaktır."],"a":3,"sol":["Kütüphanenin açılmasının sorunu çözeceği düşüncesi, sorunun kütüphanenin kapalı olmasından kaynaklandığı varsayımına dayanır.","'Kesinlikle açılacak' koşul ekiyle çelişir; 'hiçbir çalışma alanı yoktur' gereğinden güçlü bir iddiadır."],"kaz":"Yargının dayandığı örtük öncülü bulur.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-009"},{"area":"soz","topic":"cumle","sub":"Örtülü anlam","level":2,"q":"Bu yıl da toplantıya en son gelen Kerem oldu.<br>Bu cümleden aşağıdakilerden hangisi <b>çıkarılabilir</b>?","opts":["Herkes Kerem'i beklemek zorunda kalmıştır.","Kerem bu yıl toplantıya katılmamıştır.","Kerem toplantılardan hoşlanmaz.","Kerem daha önceki toplantılardan en az birine de en son gelmiştir.","Toplantı geç başlamıştır."],"a":3,"sol":["'da' bağlacı, durumun daha önce de yaşandığını sezdirir (örtülü anlam).","Diğer seçenekler cümlede herhangi bir dayanağı olmayan yorumlardır."],"kaz":"Ek ve bağlaçların taşıdığı örtülü anlamı sezer.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-010"},{"area":"soz","topic":"cumle","sub":"Karşılaştırma","level":2,"q":"Aşağıdaki cümlelerin hangisinde <b>karşılaştırma</b> yoktur?","opts":["En sevdiği mevsim sonbahardı.","Kardeşi kadar çalışkan değil.","Artık eskisi gibi sık görüşmüyoruz.","Kitabı bir solukta okuyup bitirdi.","Bu yol öbüründen daha kısa."],"a":3,"sol":["Karşılaştırma iki ya da daha çok varlık/durum arasında yapılır ('daha', 'kadar', 'gibi', 'en').","'Bir solukta okumak' yalnızca okuma biçimini anlatır."],"kaz":"Karşılaştırma bildiren yapıları tanır.","sure":40,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-011"},{"area":"soz","topic":"cumle","sub":"Kesin çıkarım","level":3,"q":"Türk edebiyatında deneme türü, Tanzimat'la birlikte gazetelerin yaygınlaşması sayesinde gelişme olanağı bulmuştur.<br>Bu cümleden aşağıdaki yargılardan hangisi <b>kesin olarak</b> çıkarılabilir?","opts":["Tanzimat'tan önce Türkçe gazete yayımlanmamıştır.","Deneme, dönemin en çok okunan türüdür.","Gazeteler yalnızca deneme türünde yazılara yer vermiştir.","Gazetelerin yaygınlaşması, deneme türünün gelişmesine ortam hazırlamıştır.","Deneme türünün ilk örnekleri Tanzimat döneminde yazılmıştır."],"a":3,"sol":["'… sayesinde gelişme olanağı bulmuştur' ifadesi doğrudan bu yargıyı verir.","'Gelişme olanağı bulmak' ilk örneklerin bu dönemde yazıldığı anlamına gelmez."],"kaz":"Gelişme ile başlangıç kavramlarını ayırt eder.","sure":60,"src":"Özgün – ALES Akademi","id":"SOZ-CUM-012"},{"area":"soz","topic":"cumle","sub":"Kesin çıkarım","level":2,"q":"Araştırmaya katılan öğrencilerin yarısından fazlası, çevrim içi derslerde dikkatlerini sınıf ortamındakinden
